# OpsCore Buyer Self-Hosted runtime (single-server).
# Does not replace Neon/Vercel hosted path. Production promotion is separate.
#
# Required env file: backend/.env.self-hosted (never commit secrets).
# Quickstart: docs/self-hosted/RUNTIME_COMPOSE.md

services:
  db:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: opscore-postgres:18-postgis-vector
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/var/lib/postgresql/server.crt", "-c", "ssl_key_file=/var/lib/postgresql/server.key"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opscore}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      OPSCORE_RUNTIME_PASSWORD: ${OPSCORE_RUNTIME_PASSWORD:?set OPSCORE_RUNTIME_PASSWORD}
      OPSCORE_MIGRATOR_PASSWORD: ${OPSCORE_MIGRATOR_PASSWORD:?set OPSCORE_MIGRATOR_PASSWORD}
      OPSCORE_WORKER_PASSWORD: ${OPSCORE_WORKER_PASSWORD:?set OPSCORE_WORKER_PASSWORD}
    volumes:
      - opscore-postgres-data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - ./.secrets/postgres-server.crt:/run/secrets/postgres-server.crt:ro
      - ./.secrets/postgres-server.key:/run/secrets/postgres-server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB:-opscore}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - opscore-internal
    # Bound to loopback only — Caddy/app reach it via the compose network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: "no"
    env_file:
      - ${OPSCORE_SELF_HOSTED_ENV_FILE:-.env.self-hosted}
    volumes:
      - ./.secrets/postgres-ca.crt:/run/secrets/postgres-ca.crt:ro
    environment:
      DATABASE_ENGINE: postgres
      OPSC_MIGRATION_DATABASE_URL: "postgresql://opscore_migrator:${OPSCORE_MIGRATOR_PASSWORD}@db:5432/${POSTGRES_DB:-opscore}?sslmode=verify-full&sslrootcert=/run/secrets/postgres-ca.crt"
      OPSC_PG_SSL_MODE: verify-full
      OPSC_PG_SSL_REJECT_UNAUTHORIZED: "true"
      OPSC_MIGRATION_TARGET_CLASS: test
      OPSC_MIGRATION_EXPECTED_DATABASE: ${POSTGRES_DB:-opscore}
      OPSC_MIGRATION_CONFIRM_DATABASE: ${POSTGRES_DB:-opscore}
      OPSC_MIGRATION_EXPECTED_OWNER_ROLE: opscore_migrator
      OPSC_MIGRATION_ALLOW_DOCKER_COMPOSE_HOST: "1"
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "scripts/apply-postgres-migrations.js", "--apply"]
    networks:
      - opscore-internal

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ${OPSCORE_SELF_HOSTED_ENV_FILE:-.env.self-hosted}
    volumes:
      - ./.secrets/postgres-ca.crt:/run/secrets/postgres-ca.crt:ro
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_ENGINE: postgres
      OPSC_DATABASE_URL: "postgresql://opscore_runtime:${OPSCORE_RUNTIME_PASSWORD}@db:5432/${POSTGRES_DB:-opscore}?sslmode=verify-full&sslrootcert=/run/secrets/postgres-ca.crt"
      OPSC_PG_SSL_MODE: verify-full
      OPSC_PG_SSL_REJECT_UNAUTHORIZED: "true"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - opscore-internal
    expose:
      - "3000"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      OPSCORE_PUBLIC_HOST: ${OPSCORE_PUBLIC_HOST:-localhost}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - opscore-caddy-data:/data
      - opscore-caddy-config:/config
    networks:
      - opscore-internal

networks:
  opscore-internal:
    driver: bridge

volumes:
  opscore-postgres-data:
  opscore-caddy-data:
  opscore-caddy-config:
