name: Mobile SDK 58 refresh validation

on:
  push:
    branches:
      - fix/mobile-sdk58-refresh-20261117

permissions:
  contents: read

concurrency:
  group: mobile-sdk58-refresh-validation
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Resolve current SDK 58-compatible dependency graph
        working-directory: mobile
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx expo install --fix
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); console.log('EXPO_LOCK',p.packages['node_modules/expo']?.version); console.log('REACT_NATIVE_LOCK',p.packages['node_modules/react-native']?.version)"

      - name: Require reproducible clean install and dependency alignment
        working-directory: mobile
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node scripts/dependency-upgrade-gate.js
          node scripts/release-preflight.js
          npm run verify
          npx expo-doctor@latest

      - name: Export Android, iOS, and web bundles
        working-directory: mobile
        run: |
          set -euo pipefail
          npx expo export --platform android --output-dir "$RUNNER_TEMP/opscore-mobile-android"
          npx expo export --platform ios --output-dir "$RUNNER_TEMP/opscore-mobile-ios"
          npx expo export --platform web --output-dir "$RUNNER_TEMP/opscore-mobile-web"

      - name: Verify picomatch does not enter client bundles
        run: |
          set -euo pipefail
          for target in android ios web; do
            dir="$RUNNER_TEMP/opscore-mobile-$target"
            if grep -R -n -E 'analyzeRepeatedExtglob|node_modules/picomatch|picomatch/lib/parse' "$dir"; then
              echo "PICOMATCH_PRESENT_IN_CLIENT_BUNDLE target=$target"
              exit 1
            fi
            echo "PICOMATCH_NOT_FOUND_IN_CLIENT_BUNDLE target=$target"
          done

      - name: Report full dependency audit without suppressing findings
        working-directory: mobile
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/mobile-audit-full.json"
          full_status=$?
          npm audit --omit=dev --json > "$RUNNER_TEMP/mobile-audit-production.json"
          production_status=$?
          set -e
          node - "$RUNNER_TEMP/mobile-audit-full.json" "$RUNNER_TEMP/mobile-audit-production.json" <<'NODE'
          const fs = require('node:fs');
          for (const file of process.argv.slice(2)) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const meta = report.metadata?.vulnerabilities;
            if (!meta) throw new Error('AUDIT_REPORT_INCOMPLETE');
            console.log('MOBILE_AUDIT_FILE', file);
            console.log('MOBILE_AUDIT_SUMMARY', JSON.stringify(meta));
            for (const [name, issue] of Object.entries(report.vulnerabilities || {})) {
              console.log('MOBILE_AUDIT_FINDING', JSON.stringify({
                name,
                severity: issue.severity,
                range: issue.range,
                fixAvailable: issue.fixAvailable,
                via: (issue.via || []).map(v => typeof v === 'string' ? v : {
                  title: v.title, url: v.url, range: v.range
                })
              }));
            }
          }
          NODE
          if [ "$full_status" -ne 0 ] || [ "$production_status" -ne 0 ]; then
            echo "MOBILE_DEPENDENCY_AUDIT_HAS_UNRESOLVED_FINDINGS"
            exit 1
          fi
          echo "MOBILE_DEPENDENCY_AUDIT=ZERO_FINDINGS"
