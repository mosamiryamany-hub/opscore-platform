name: ops-signed-context-migration-branch

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CREATE_SIGNED_CONTEXT_MIGRATION_BRANCH
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ops-signed-context-migration-branch
  cancel-in-progress: false

jobs:
  migrate-branch:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'CREATE_SIGNED_CONTEXT_MIGRATION_BRANCH' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for the guarded migration runner
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend migration-runner dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Create disposable child branch and apply 063–067 plus technician-trail 069
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: summer-leaf-18448271
          OPSC_PRODUCTION_NEON_BRANCH_ID: br-proud-salad-bcshhdap
        run: python3 scripts/neon_signed_context_migration_branch.py
