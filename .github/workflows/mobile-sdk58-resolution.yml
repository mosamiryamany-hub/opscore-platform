name: Mobile SDK 58 dependency resolution

on:
  push:
    branches:
      - maintenance/mobile-sdk58-security-remediation-2026-11-11

permissions:
  contents: write

concurrency:
  group: mobile-sdk58-resolution
  cancel-in-progress: false

jobs:
  resolve-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Resolve SDK 58 dependency graph
        working-directory: mobile
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx expo install --fix
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile reproducibility
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Verify Expo SDK dependency alignment
        working-directory: mobile
        run: |
          node scripts/dependency-upgrade-gate.js
          node scripts/release-preflight.js
          npm run verify
          npx expo-doctor@latest

      - name: Bundle Android, iOS and web targets
        working-directory: mobile
        run: |
          set -euo pipefail
          npx expo export --platform android --output-dir "$RUNNER_TEMP/opscore-mobile-android"
          npx expo export --platform ios --output-dir "$RUNNER_TEMP/opscore-mobile-ios"
          npx expo export --platform web --output-dir "$RUNNER_TEMP/opscore-mobile-web"

      - name: Verify picomatch build tooling is absent from shipped client bundles
        run: |
          set -euo pipefail
          for target in android ios web; do
            dir="$RUNNER_TEMP/opscore-mobile-$target"
            if grep -R -n -E 'analyzeRepeatedExtglob|picomatch/lib/parse|node_modules/picomatch' "$dir"; then
              echo "PICOMATCH_SOURCE_PRESENT_IN_CLIENT_BUNDLE target=$target"
              exit 1
            fi
            echo "PICOMATCH_SOURCE_ABSENT_FROM_CLIENT_BUNDLE target=$target"
          done

      - name: Record full mobile audit (findings are not suppressed)
        working-directory: mobile
        run: |
          set +e
          npm audit --json > mobile-dependency-audit.json
          audit_status=$?
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('mobile-dependency-audit.json', 'utf8'));
          const v = report.metadata?.vulnerabilities;
          if (!v || typeof v.total !== 'number') throw new Error('MOBILE_AUDIT_REPORT_INCOMPLETE');
          console.log('MOBILE_AUDIT_SUMMARY', JSON.stringify(v));
          for (const [name, issue] of Object.entries(report.vulnerabilities || {})) {
            console.log('MOBILE_AUDIT_FINDING', JSON.stringify({
              name, severity: issue.severity, range: issue.range,
              fixAvailable: issue.fixAvailable,
              via: (issue.via || []).map(v => typeof v === 'string' ? v : {
                title: v.title, url: v.url, range: v.range
              })
            }));
          }
          NODE
          echo "npm_audit_exit=$audit_status"

      - name: Commit dependency refresh and exact audit evidence
        run: |
          set -euo pipefail
          git diff --check
          git add mobile/package.json mobile/package-lock.json mobile/mobile-dependency-audit.json
          if git diff --cached --quiet; then
            echo "NO_DEPENDENCY_CHANGES"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(mobile): refresh SDK 58 dependencies and audit evidence"
          git push origin HEAD:maintenance/mobile-sdk58-security-remediation-2026-11-11

      - name: Fail closed when dependency findings remain
        working-directory: mobile
        run: |
          node - <<'NODE'
          const report = require('./mobile-dependency-audit.json');
          const v = report.metadata?.vulnerabilities;
          if (!v || typeof v.total !== 'number') throw new Error('AUDIT_REPORT_INCOMPLETE');
          console.log('FINAL_MOBILE_AUDIT', JSON.stringify(v));
          if (v.total !== 0) process.exit(1);
          NODE
