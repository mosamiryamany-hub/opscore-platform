name: neon-primary-manual-snapshot
# Creates a manual snapshot of the configured production branch (root).
# Free plan: max 1 manual snapshot. Paid: schedules available in Console.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CREATE_PRIMARY_SNAPSHOT to proceed
        required: true
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.inputs.confirm == 'CREATE_PRIMARY_SNAPSHOT'
    runs-on: ubuntu-24.04
    steps:
      - name: Create manual snapshot of production branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: summer-leaf-18448271
          # Prefer the branch id published to production env / release identity
          BRANCH_ID: br-proud-salad-bcshhdap
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}"
          NAME="opscore-primary-$(date -u +%Y%m%dT%H%M%SZ)"
          CODE=$(curl -sS -o /tmp/snap.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}/snapshot" \
            -d "{\"snapshot\":{\"name\":\"${NAME}\",\"expires_at\":null}}")
          echo "HTTP $CODE"
          head -c 1200 /tmp/snap.json; echo
          # 200/201 success; 409/422 may indicate plan limit — surface body, fail closed
          test "$CODE" = "200" -o "$CODE" = "201"
