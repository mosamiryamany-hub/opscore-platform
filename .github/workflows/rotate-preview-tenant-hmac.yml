name: Rotate Preview tenant HMAC key

# Preview-only operational rotation. Does not touch Production Neon or Production Vercel env.
on:
  workflow_dispatch:
    inputs:
      neon_project_id:
        description: Neon project id
        required: false
        default: 'summer-leaf-18448271'
      neon_branch_id_or_name:
        description: Preview branch id or name (empty = auto-detect preview/vercel/dev non-primary)
        required: false
        default: ''
      database_name:
        description: Database name on the Preview branch
        required: false
        default: 'opscore_acceptance'
      role_name:
        description: Admin role used only to write opscore_security.context_hmac_keys
        required: false
        default: 'neondb_owner'
      key_ttl_days:
        description: Key validity window in days
        required: false
        default: '30'

permissions:
  contents: read

concurrency:
  group: rotate-preview-tenant-hmac
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Preconditions
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || { echo "NEON_API_KEY_MISSING"; exit 1; }
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN_MISSING"; exit 1; }
          test -n "${VERCEL_PROJECT_ID:-}" || { echo "VERCEL_PROJECT_ID_MISSING"; exit 1; }

      - name: Resolve Preview branch and connection URI
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ inputs.neon_project_id }}
          BRANCH_INPUT: ${{ inputs.neon_branch_id_or_name }}
          DATABASE_NAME: ${{ inputs.database_name }}
          ROLE_NAME: ${{ inputs.role_name }}
        run: |
          set -euo pipefail
          AUTH_H=(-H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json")
          curl -fsS "${AUTH_H[@]}" \
            "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/branches" \
            > "$RUNNER_TEMP/branches.json"

          BRANCH_INPUT="$BRANCH_INPUT" python3 - <<'PY'
          import json, os, pathlib
          data = json.load(open(pathlib.Path(os.environ["RUNNER_TEMP"]) / "branches.json", encoding="utf-8"))
          branches = data.get("branches") or []
          branch_input = (os.environ.get("BRANCH_INPUT") or "").strip()
          chosen = None
          if branch_input:
              for b in branches:
                  if b.get("id") == branch_input or b.get("name") == branch_input:
                      chosen = b
                      break
              if not chosen:
                  raise SystemExit("PREVIEW_BRANCH_NOT_FOUND:" + branch_input)
          else:
              ranked = []
              for b in branches:
                  name = str(b.get("name") or "")
                  primary = bool(b.get("primary") or b.get("default"))
                  if primary:
                      continue
                  score = 0
                  lname = name.lower()
                  if "preview" in lname or "vercel" in lname or "dev" in lname:
                      score += 10
                  if str(b.get("current_state") or b.get("state") or "").lower() == "ready":
                      score += 1
                  ranked.append((score, name, b))
              ranked.sort(key=lambda x: x[0], reverse=True)
              if not ranked or ranked[0][0] < 10:
                  raise SystemExit("PREVIEW_BRANCH_AUTODETECT_FAILED")
              chosen = ranked[0][2]
          if bool(chosen.get("primary") or chosen.get("default")):
              raise SystemExit("REFUSING_PRIMARY_BRANCH")
          out = {
              "id": chosen.get("id"),
              "name": chosen.get("name"),
              "primary": bool(chosen.get("primary") or chosen.get("default")),
          }
          pathlib.Path(os.environ["RUNNER_TEMP"], "branch.json").write_text(json.dumps(out), encoding="utf-8")
          print("resolved", out["name"], out["id"])
          PY

          BRANCH_ID=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/branch.json"))["id"])')
          BRANCH_NAME=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/branch.json"))["name"])')
          echo "branch_id=${BRANCH_ID}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

          curl -fsS "${AUTH_H[@]}" \
            "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/connection_uri?branch_id=${BRANCH_ID}&database_name=${DATABASE_NAME}&role_name=${ROLE_NAME}&pooled=false" \
            > "$RUNNER_TEMP/uri.json"
          python3 -c 'import json,os;u=json.load(open(os.environ["RUNNER_TEMP"]+"/uri.json"))["uri"];assert u.startswith("postgres");open(os.environ["RUNNER_TEMP"]+"/preview.uri","w").write(u)'
          chmod 600 "$RUNNER_TEMP/preview.uri"
          echo "connection_uri_resolved=true"

      - name: Generate and install Preview HMAC key
        id: key
        env:
          KEY_TTL_DAYS: ${{ inputs.key_ttl_days }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
          KEY_ID="preview-$(date -u +%Y%m%d)-$(openssl rand -hex 3)"
          openssl rand -hex 32 > "$RUNNER_TEMP/key.hex"
          chmod 600 "$RUNNER_TEMP/key.hex"
          test "$(wc -c < "$RUNNER_TEMP/key.hex" | tr -d ' ')" -eq 64
          echo "key_id=${KEY_ID}" >> "$GITHUB_OUTPUT"

          URI=$(cat "$RUNNER_TEMP/preview.uri")
          KEY_HEX=$(cat "$RUNNER_TEMP/key.hex")
          # Use env vars for psql; do not print KEY_HEX
          export KEY_ID KEY_HEX KEY_TTL_DAYS
          psql "$URI" -v ON_ERROR_STOP=1 <<SQL
          BEGIN;
          SELECT 1 FROM opscore_security.context_hmac_keys LIMIT 1;
          UPDATE opscore_security.context_hmac_keys
             SET enabled = false
           WHERE enabled = true;
          INSERT INTO opscore_security.context_hmac_keys (
            key_id, secret, enabled, not_before, not_after
          ) VALUES (
            '${KEY_ID}',
            decode('${KEY_HEX}', 'hex'),
            true,
            now(),
            now() + make_interval(days => ${KEY_TTL_DAYS}::int)
          );
          DO \$\$
          DECLARE
            enabled_count integer;
            octet_len integer;
            kid text;
          BEGIN
            SELECT count(*) INTO enabled_count
            FROM opscore_security.context_hmac_keys WHERE enabled;
            IF enabled_count <> 1 THEN
              RAISE EXCEPTION 'OPSC_PREVIEW_HMAC_ENABLED_COUNT_INVALID:%', enabled_count;
            END IF;
            SELECT key_id, octet_length(secret) INTO kid, octet_len
            FROM opscore_security.context_hmac_keys WHERE enabled;
            IF octet_len <> 32 THEN
              RAISE EXCEPTION 'OPSC_PREVIEW_HMAC_SECRET_LENGTH_INVALID:%', octet_len;
            END IF;
            IF kid IS DISTINCT FROM '${KEY_ID}' THEN
              RAISE EXCEPTION 'OPSC_PREVIEW_HMAC_KEY_ID_MISMATCH';
            END IF;
            RAISE NOTICE 'preview_hmac_key_installed kid=% len=%', kid, octet_len;
          END
          \$\$;
          COMMIT;
          SQL
          echo "HMAC key row installed on Preview (secret not logged)"

      - name: Sync Vercel Preview env only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          KEY_ID: ${{ steps.key.outputs.key_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ["VERCEL_TOKEN"]
          project = os.environ["VERCEL_PROJECT_ID"]
          key_id = os.environ["KEY_ID"]
          key_hex = open(os.environ["RUNNER_TEMP"] + "/key.hex", "r", encoding="utf-8").read().strip()
          assert len(key_hex) == 64

          def req(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
              })
              with urllib.request.urlopen(request) as resp:
                  return json.load(resp)

          envs = req("GET", f"https://api.vercel.com/v9/projects/{project}/env").get("envs", [])

          def upsert(key, value):
              existing = [
                  e for e in envs
                  if e.get("key") == key and set(e.get("target") or []) == {"preview"}
              ]
              if existing:
                  eid = existing[0]["id"]
                  req("PATCH", f"https://api.vercel.com/v9/projects/{project}/env/{eid}", {
                      "value": value,
                      "type": "encrypted",
                      "target": ["preview"],
                  })
                  print(f"updated {key} preview")
              else:
                  req("POST", f"https://api.vercel.com/v10/projects/{project}/env", {
                      "key": key,
                      "value": value,
                      "type": "encrypted",
                      "target": ["preview"],
                  })
                  print(f"created {key} preview")

          upsert("OPSC_TENANT_CONTEXT_HMAC_KEY", key_hex)
          upsert("OPSC_TENANT_CONTEXT_KEY_ID", key_id)
          upsert("OPSC_REQUIRE_SIGNED_TENANT_CONTEXT", "false")
          print("vercel_preview_env_synced")
          PY

      - name: Summary (no secrets)
        run: |
          set -euo pipefail
          echo "Preview branch: ${{ steps.neon.outputs.branch_name }} (${{ steps.neon.outputs.branch_id }})"
          echo "Installed key_id: ${{ steps.key.outputs.key_id }}"
          echo "Vercel Preview env synced for OPSC_TENANT_CONTEXT_*"
          echo "Production env and Production Neon were not modified."
