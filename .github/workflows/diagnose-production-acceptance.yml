name: diagnose-production-acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Install
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Run acceptance against production (read-only) and print failDetail
        working-directory: backend
        env:
          OPSC_PRODUCTION_RUNTIME_URL: ${{ secrets.OPSC_DATABASE_URL }}
          OPSC_OWNER_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Minimal matrix/restore envelopes so generator reaches production DB checks when possible
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const commit = String(process.env.GITHUB_SHA).toLowerCase();
          const pipeline = String(process.env.GITHUB_RUN_ID);
          // Intentionally invalid matrix to see DB-side fields? Better: inspect ledger only via SQL
          NODE
          node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const owner = new Client({ connectionString: process.env.OPSC_OWNER_DATABASE_URL, ssl: { rejectUnauthorized: true } });
            await owner.connect();
            const info = await owner.query("SELECT current_database() d, current_user u");
            console.log('owner', info.rows[0]);
            const ledger = await owner.query("SELECT filename FROM schema_migrations ORDER BY filename");
            console.log('ledger_last10', ledger.rows.slice(-10).map(r => r.filename));
            const files = require('fs').readdirSync('sql/postgres').filter(f => /^\\d{3}_/.test(f)).sort();
            const set = new Set(ledger.rows.map(r => r.filename));
            const pending = files.filter(f => !set.has(f));
            console.log('pending_files', pending);
            const rls = await owner.query(`SELECT count(*)::int AS total,
              count(*) FILTER (WHERE c.relrowsecurity)::int AS rls,
              count(*) FILTER (WHERE c.relforcerowsecurity)::int AS force_rls
              FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind='r'`);
            console.log('public_tables', rls.rows[0]);
            const role = await owner.query("SELECT rolname, rolcanlogin, rolsuper, rolbypassrls FROM pg_roles WHERE rolname IN ('opscore_runtime','opscore_app') ORDER BY 1");
            console.log('roles', role.rows);
            await owner.end();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

  neon-inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: List Neon branches and snapshots
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: summer-leaf-18448271
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json"             "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" -o branches.json
          python3 -c 'import json;d=json.load(open("branches.json"));bs=d.get("branches")or[];print("count",len(bs));
[print("---\nid",b.get("id"),"\nname",b.get("name"),"\nprimary",b.get("primary"),"\nprotected",b.get("protected"),"\nparent_id",b.get("parent_id"),"\ncreated",b.get("created_at"),"\nlogical_size",b.get("logical_size"),"\nstate",b.get("current_state")) for b in bs]'
          curl --fail --silent --show-error --retry 3 --retry-all-errors -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json"             "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/snapshots" -o snaps.json
          python3 -c 'import json;d=json.load(open("snaps.json"));ss=d.get("snapshots")or[];print("snapshots",len(ss));
[print("---\nid",s.get("id"),"\nname",s.get("name"),"\nsource",s.get("source_branch_id")or s.get("branch_id"),"\ncreated",s.get("created_at")) for s in ss]'

