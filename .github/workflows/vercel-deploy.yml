name: vercel-deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel@65.14.0
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Self-asserted release identity for CLI deploys (deployment-proof + release-proof).
          OPSC_RELEASE_DEPLOYMENT_SOURCE: cli
          OPSC_RELEASE_CI_COMMIT: ${{ github.sha }}
          OPSC_RELEASE_CI_PIPELINE_ID: ${{ github.run_id }}
          OPSC_SOURCE_COMMIT_SHA: ${{ github.sha }}
          OPSC_RELEASE_CI_REF: ${{ github.ref_name }}
          OPSC_PRODUCTION_ISOLATION_CERTIFICATION: NOT_CERTIFIED
      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          OPSC_RELEASE_DEPLOYMENT_SOURCE: cli
          OPSC_RELEASE_CI_COMMIT: ${{ github.sha }}
          OPSC_RELEASE_CI_PIPELINE_ID: ${{ github.run_id }}
          OPSC_SOURCE_COMMIT_SHA: ${{ github.sha }}
          OPSC_RELEASE_CI_REF: ${{ github.ref_name }}
          OPSC_PRODUCTION_ISOLATION_CERTIFICATION: NOT_CERTIFIED
