name: vercel-deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  verify:
    name: vercel-contract-verify
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: |
          node --check backend/src/config.js
          node --check backend/src/security.js
          node --check backend/src/store.js
          node --check backend/src/server.js
          node --check backend/src/production-database-identity-route.js
          node --check scripts/production-runtime-diagnostic.js
          node --check scripts/request-vercel-trusted-oidc.js
          node --check backend/scripts/postgres-logical-restore-drill.js
      - name: Production runtime diagnostic contract tests
        run: node --test backend/test/production-database-identity-route.test.js scripts/production-runtime-diagnostic.test.js
      - name: OIDC and logical restore safety contract tests
        run: node --test backend/test/request-vercel-trusted-oidc.test.js backend/test/postgres-logical-restore-drill.test.js
      - name: Hardened metadata gate
        working-directory: backend
        run: npm run verify:hardened
      - name: Backend release regression suite
        working-directory: backend
        run: OPSC_RELEASE_TEST_CONCURRENCY=4 node scripts/release-test-runner.js
      - name: Verify recorded release evidence and provenance
        working-directory: backend
        env:
          OPSC_VERIFY_RECORDED_TEST_EVIDENCE: 'true'
        run: npm run verify
      - name: Security dependency audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Mobile dependency audit
        working-directory: mobile
        run: npm audit --omit=dev --audit-level=high

  postgres-acceptance:
    name: deploy-bound-postgres-18-acceptance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/digital-twin-postgres-live.yml

  deploy:
    needs: [verify, postgres-acceptance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert production ref
        run: test "$GITHUB_REF" = "refs/heads/main"

      # The reusable PostgreSQL 18 workflow ran against a disposable local database.
      # Import only its validated, caller-run-bound evidence; never connect deploy to a shared Neon test database.
      - name: Materialize validated isolated PostgreSQL acceptance evidence
        env:
          ACCEPTANCE_EVIDENCE_B64: ${{ needs.postgres-acceptance.outputs.acceptance_evidence_b64 }}
        run: |
          set -euo pipefail
          test -n "${ACCEPTANCE_EVIDENCE_B64:-}" || { echo "POSTGRES_ACCEPTANCE_EVIDENCE_MISSING" >&2; exit 1; }
          printf '%s' "$ACCEPTANCE_EVIDENCE_B64" | base64 --decode > "$GITHUB_WORKSPACE/POSTGRES_HTTP_ACCEPTANCE_RESULT.json"
          test -s "$GITHUB_WORKSPACE/POSTGRES_HTTP_ACCEPTANCE_RESULT.json"
          node -e '
            const fs = require("node:fs");
            const p = process.env.GITHUB_WORKSPACE + "/POSTGRES_HTTP_ACCEPTANCE_RESULT.json";
            const d = JSON.parse(fs.readFileSync(p, "utf8"));
            if (d.status !== "PASS" || d.productionCertification !== false) throw new Error("POSTGRES_ACCEPTANCE_EVIDENCE_INVALID");
            if (String(d.commit).toLowerCase() !== process.env.GITHUB_SHA.toLowerCase()) throw new Error("POSTGRES_ACCEPTANCE_COMMIT_MISMATCH");
            if (Number(d.pipelineId) !== Number(process.env.GITHUB_RUN_ID)) throw new Error("POSTGRES_ACCEPTANCE_PIPELINE_MISMATCH");
            if (d.cleanup?.status !== "PASS") throw new Error("POSTGRES_ACCEPTANCE_CLEANUP_NOT_PASS");
            console.log("DEPLOY_BOUND_ISOLATED_POSTGRES_ACCEPTANCE=PASS");
          '
      - name: Promote acceptance evidence into deploy workspace
        run: |
          set -euo pipefail
          src="${GITHUB_WORKSPACE}/POSTGRES_HTTP_ACCEPTANCE_RESULT.json"
          dest="backend/docs/verification/POSTGRES_HTTP_ACCEPTANCE_RESULT.json"
          test -f "$src"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          src = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'POSTGRES_HTTP_ACCEPTANCE_RESULT.json'
          dest = pathlib.Path('backend/docs/verification/POSTGRES_HTTP_ACCEPTANCE_RESULT.json')
          data = json.loads(src.read_text(encoding='utf-8'))
          if str(data.get('status') or '') != 'PASS':
              raise SystemExit(f"acceptance_status_not_pass:{data.get('status')}")
          if data.get('productionCertification') is not False:
              raise SystemExit("acceptance_must_not_claim_production_certification")
          cleanup = data.get('cleanup') or {}
          if cleanup.get('status') != 'PASS':
              raise SystemExit("acceptance_cleanup_not_pass")
          runtime = data.get('environment') or {}
          if runtime.get('database') != 'opscore_http_acceptance' or runtime.get('connectedRole') != 'opscore_runtime':
              raise SystemExit("acceptance_runtime_identity_invalid")
          if runtime.get('roleIsSuperuser') is not False or runtime.get('roleBypassesRls') is not False:
              raise SystemExit("acceptance_runtime_role_elevated")
          checks = data.get('checks') or []
          if not checks or any(check.get('status') != 'PASS' for check in checks):
              raise SystemExit("acceptance_checks_not_all_pass")
          required = {
              'member-role-privilege-boundary',
              'safe-mode-tenant-scoped',
              'recovery-bundle-verify-is-dry-run',
              'recovery-bundle-tamper-detected',
              'operational-autopilot-postgres-parity-and-tenant-boundary'
          }
          missing = required - {str(check.get('id') or '') for check in checks}
          if missing:
              raise SystemExit("acceptance_required_checks_missing:" + ",".join(sorted(missing)))
          commit = str(data.get('commit') or '').strip().lower()
          pipeline = str(data.get('pipelineId') or '').strip()
          expected_commit = os.environ['GITHUB_SHA'].strip().lower()
          expected_pipeline = str(os.environ['GITHUB_RUN_ID']).strip()
          if commit != expected_commit:
              raise SystemExit(f"acceptance_commit_mismatch:{commit}!={expected_commit}")
          if pipeline != expected_pipeline:
              raise SystemExit(f"acceptance_pipeline_mismatch:{pipeline}!={expected_pipeline}")
          # Deploy-workspace metadata only. Does not rewrite git. Does not certify production.
          data['evidenceClass'] = 'DEPLOY_PIPELINE_ACCEPTANCE'
          data['currentHeadAcceptance'] = 'PASS'
          data['productionCertification'] = False
          data['binding'] = {
              'kind': 'deploy-pipeline',
              'commit': expected_commit,
              'pipelineId': expected_pipeline,
              'scope': 'disposable PostgreSQL HTTP surface; not productionIsolationCertification'
          }
          text = json.dumps(data, indent=2, ensure_ascii=False) + '\n'
          dest.write_text(text, encoding='utf-8')
          digest = hashlib.sha256(text.encode('utf-8')).hexdigest()
          sidecar = f"{digest}  POSTGRES_HTTP_ACCEPTANCE_RESULT.json\n"
          dest.with_suffix(dest.suffix + '.sha256').write_text(sidecar, encoding='utf-8')
          pathlib.Path('backend/docs/verification/POSTGRES_HTTP_ACCEPTANCE_RESULT.sha256').write_text(sidecar, encoding='utf-8')
          print('promoted_evidence_sha256', digest)
          print('promoted_commit', expected_commit)
          print('promoted_pipeline', expected_pipeline)
          PY

      - name: Install Vercel CLI
        run: npm install -g vercel@65.14.0
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Compute package fingerprint for this commit
        id: package_fp
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opscore-source-${GITHUB_SHA}.zip"
          git archive --format=zip --output="$archive" HEAD
          sha="$(sha256sum "$archive" | awk '{print $1}')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_SHA256=$sha"
      - name: Embed current GitHub Actions release identity
        run: node scripts/write-vercel-release-identity.js
        env:
          OPSC_RELEASE_PACKAGE_SHA256: ${{ steps.package_fp.outputs.sha }}
          OPSC_RELEASE_PACKAGE_COMMIT: ${{ github.sha }}
      - name: Generate production acceptance v1 evidence (fail-closed)
        id: generate_acceptance
        working-directory: backend
        env:
          # Runtime/owner URLs from deploy secrets. The secret name OPSC_PG_ACCEPTANCE_URL is
          # intentionally unused as a GitHub secret binding in this workflow (enforced by release-documentation-consistency).
          OPSC_PG_ACCEPTANCE_URL: ${{ secrets.OPSC_DATABASE_URL }}
          OPSC_OWNER_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: summer-leaf-18448271
          NEON_BRANCH_ID: br-wispy-term-bcrqqj84
          OPSC_HTTP_BASE: https://opscore-platform.vercel.app
          OPSC_ACCEPTANCE_ENVIRONMENT: production
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${NEON_API_KEY:-}" ] || [ -z "${OPSC_PG_ACCEPTANCE_URL:-}" ] || [ -z "${OPSC_OWNER_DATABASE_URL:-}" ]; then
            echo "PRODUCTION_ACCEPTANCE_GENERATOR_SKIPPED_MISSING_SECRETS"
            echo "evidence_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -d node_modules/pg ]; then
            npm ci --ignore-scripts
          fi
          node scripts/generate-production-acceptance-v1.js | tee "$RUNNER_TEMP/production-acceptance-summary.json"
          test -f docs/verification/PRODUCTION_ACCEPTANCE_RESULT.json
          HASH="$(sha256sum docs/verification/PRODUCTION_ACCEPTANCE_RESULT.json | awk '{print $1}')"
          echo "evidence_sha=$HASH" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_ACCEPTANCE_EVIDENCE_SHA256=$HASH"

      - name: Publish acceptance evidence hash to Vercel production env
        if: ${{ steps.generate_acceptance.outputs.evidence_sha != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EVIDENCE_SHA: ${{ steps.generate_acceptance.outputs.evidence_sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const https = require('https');
          const token = process.env.VERCEL_TOKEN;
          const hash = process.env.EVIDENCE_SHA;
          const projectId = process.env.VERCEL_PROJECT_ID;
          function req(method, path, body) {
            return new Promise((resolve, reject) => {
              const data = body ? JSON.stringify(body) : null;
              const r = https.request({
                hostname: 'api.vercel.com', method, path,
                headers: {
                  Authorization: 'Bearer ' + token,
                  'Content-Type': 'application/json',
                  ...(data ? { 'Content-Length': Buffer.byteLength(data) } : {})
                }
              }, res => {
                let b=''; res.on('data', d => b+=d); res.on('end', () => {
                  if (res.statusCode >= 300) reject(new Error(method+' '+path+' '+res.statusCode+' '+b.slice(0,200)));
                  else resolve(b ? JSON.parse(b) : {});
                });
              });
              r.on('error', reject);
              if (data) r.write(data);
              r.end();
            });
          }
          (async () => {
            const envs = await req('GET', '/v9/projects/' + projectId + '/env');
            const want = {
              OPSC_PRODUCTION_ACCEPTANCE_EVIDENCE_SHA256: hash,
              OPSC_PRODUCTION_ISOLATION_CERTIFICATION: 'CERTIFIED',
              OPSC_RELEASE_VERIFIED: 'true'
            };
            for (const [key, value] of Object.entries(want)) {
              const hit = (envs.envs||[]).find(e => e.key===key && (e.target||[]).includes('production'));
              if (hit) await req('PATCH', '/v9/projects/' + projectId + '/env/' + hit.id, { value, type: 'encrypted', target: ['production'] });
              else await req('POST', '/v10/projects/' + projectId + '/env', { key, value, type: 'encrypted', target: ['production'] });
              console.log('ENV_OK', key);
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Build Vercel output
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # CI-asserted release identity for CLI deploys (deployment-proof + release-proof).
          OPSC_RELEASE_DEPLOYMENT_SOURCE: github-actions-cli
          OPSC_RELEASE_CI_COMMIT: ${{ github.sha }}
          OPSC_RELEASE_CI_PIPELINE_ID: ${{ github.run_id }}
          OPSC_SOURCE_COMMIT_SHA: ${{ github.sha }}
          OPSC_RELEASE_CI_REF: ${{ github.ref_name }}
          OPSC_RELEASE_PACKAGE_SHA256: ${{ steps.package_fp.outputs.sha }}
          OPSC_RELEASE_PACKAGE_COMMIT: ${{ github.sha }}
          OPSC_PRODUCTION_ISOLATION_CERTIFICATION: ${{ steps.generate_acceptance.outputs.evidence_sha != '' && 'CERTIFIED' || 'NOT_CERTIFIED' }}
          OPSC_RELEASE_VERIFIED: ${{ steps.generate_acceptance.outputs.evidence_sha != '' && 'true' || 'false' }}
          OPSC_PRODUCTION_ACCEPTANCE_EVIDENCE_SHA256: ${{ steps.generate_acceptance.outputs.evidence_sha }}
      - name: Verify Vercel output contains the current release identity
        run: |
          set -euo pipefail
          identity_file="$(find .vercel/output -type f -name 'opscore-vercel-release-identity.json' 2>/dev/null | head -n 1 || true)"
          if [ -z "${identity_file}" ]; then
            identity_file="backend/src/opscore-vercel-release-identity.json"
          fi
          test -f "$identity_file"
          echo "IDENTITY_FILE=$identity_file"
          IDENTITY_FILE="$identity_file" node -e '
            const fs = require("node:fs");
            const identity = JSON.parse(fs.readFileSync(process.env.IDENTITY_FILE, "utf8"));
            const expected = {
              commitSha: process.env.GITHUB_SHA.toLowerCase(),
              pipelineId: String(process.env.GITHUB_RUN_ID),
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              ref: "main",
              repository: process.env.GITHUB_REPOSITORY
            };
            for (const [key, value] of Object.entries(expected)) {
              if (String(identity[key]) !== String(value)) {
                throw new Error(`VERCEL_RELEASE_IDENTITY_MISMATCH:${key}:got=${identity[key]}:expected=${value}`);
              }
            }
            console.log("VERCEL_RELEASE_IDENTITY_VERIFY=PASS");
          '
      - name: Verify deploy-workspace acceptance evidence matches release identity
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const evidencePath = path.join("backend", "docs", "verification", "POSTGRES_HTTP_ACCEPTANCE_RESULT.json");
            const evidence = JSON.parse(fs.readFileSync(evidencePath, "utf8"));
            const commit = String(evidence.commit || "").toLowerCase();
            const pipelineId = String(evidence.pipelineId || "");
            const expectedCommit = String(process.env.GITHUB_SHA || "").toLowerCase();
            const expectedPipeline = String(process.env.GITHUB_RUN_ID || "");
            if (evidence.status !== "PASS") throw new Error("acceptance_not_pass");
            if (commit !== expectedCommit) throw new Error("acceptance_commit_mismatch");
            if (pipelineId !== expectedPipeline) throw new Error("acceptance_pipeline_mismatch");
            if (evidence.productionCertification === true) throw new Error("acceptance_must_not_claim_production_certification");
            console.log("DEPLOY_WORKSPACE_ACCEPTANCE_BIND=PASS");
          '
      - name: Create staged production deployment without changing the live domain
        id: staged_deploy
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/vercel-staged-deployment-url.txt"
          vercel deploy --prebuilt --prod --skip-domain --token=${{ secrets.VERCEL_TOKEN }} > "$output"
          deployment_url="$(cat "$output")"
          test -n "$deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "STAGED_PRODUCTION_DEPLOYMENT_CREATED"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          OPSC_RELEASE_DEPLOYMENT_SOURCE: github-actions-cli
          OPSC_RELEASE_CI_COMMIT: ${{ github.sha }}
          OPSC_RELEASE_CI_PIPELINE_ID: ${{ github.run_id }}
          OPSC_SOURCE_COMMIT_SHA: ${{ github.sha }}
          OPSC_RELEASE_CI_REF: ${{ github.ref_name }}
          OPSC_RELEASE_PACKAGE_SHA256: ${{ steps.package_fp.outputs.sha }}
          OPSC_RELEASE_PACKAGE_COMMIT: ${{ github.sha }}
          OPSC_PRODUCTION_ISOLATION_CERTIFICATION: ${{ steps.generate_acceptance.outputs.evidence_sha != '' && 'CERTIFIED' || 'NOT_CERTIFIED' }}
          OPSC_RELEASE_VERIFIED: ${{ steps.generate_acceptance.outputs.evidence_sha != '' && 'true' || 'false' }}
          OPSC_PRODUCTION_ACCEPTANCE_EVIDENCE_SHA256: ${{ steps.generate_acceptance.outputs.evidence_sha }}
      - name: Request scoped GitHub Actions OIDC identity for Vercel Trusted Sources
        id: vercel_oidc
        run: node scripts/request-vercel-trusted-oidc.js
      - name: Verify staged production runtime identity and all release gates
        id: production_runtime
        run: node scripts/production-runtime-diagnostic.js "${{ steps.staged_deploy.outputs.url }}" "$GITHUB_SHA" "$GITHUB_RUN_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_SCOPE: mosamiryamany-1692
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel_oidc.outputs.token }}
      - name: Verify staged production HTTP, database, security and release proofs
        id: production_smoke
        if: steps.production_runtime.outputs.allowed == 'true'
        run: node scripts/production-deployment-smoke.js "${{ steps.staged_deploy.outputs.url }}" "$GITHUB_SHA"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_SCOPE: mosamiryamany-1692
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel_oidc.outputs.token }}
      - name: Promote only the verified staged deployment
        id: production_promote
        if: steps.production_runtime.outputs.allowed == 'true'
        run: vercel promote "${{ steps.staged_deploy.outputs.url }}" --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Refresh GitHub Actions OIDC identity for public-domain verification
        id: vercel_oidc_domain
        run: node scripts/request-vercel-trusted-oidc.js
      - name: Verify production domain resolves to the exact promoted commit
        id: production_domain_verify
        if: steps.production_runtime.outputs.allowed == 'true'
        run: node scripts/production-deployment-smoke.js "https://opscore-platform.vercel.app" "$GITHUB_SHA"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_SCOPE: mosamiryamany-1692
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel_oidc_domain.outputs.token }}

      - name: Fail unless production promotion and public-domain verification completed
        if: ${{ always() && !cancelled() }}
        env:
          RUNTIME_OUTCOME: ${{ steps.production_runtime.outcome }}
          RUNTIME_ALLOWED: ${{ steps.production_runtime.outputs.allowed }}
          SMOKE_OUTCOME: ${{ steps.production_smoke.outcome }}
          PROMOTE_OUTCOME: ${{ steps.production_promote.outcome }}
          DOMAIN_OUTCOME: ${{ steps.production_domain_verify.outcome }}
        run: |
          set -euo pipefail
          test "$RUNTIME_OUTCOME" = "success"
          test "$RUNTIME_ALLOWED" = "true"
          test "$SMOKE_OUTCOME" = "success"
          test "$PROMOTE_OUTCOME" = "success"
          test "$DOMAIN_OUTCOME" = "success"
          echo "PRODUCTION_PROMOTION_AND_PUBLIC_DOMAIN_VERIFICATION=PASS"
