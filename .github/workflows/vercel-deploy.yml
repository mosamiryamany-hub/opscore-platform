name: vercel-deploy
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: |
          node --check backend/src/config.js
          node --check backend/src/security.js
          node --check backend/src/store.js
          node --check backend/src/server.js
      - name: Hardened metadata gate
        working-directory: backend
        run: npm run verify:hardened
      - name: Backend release regression suite
        working-directory: backend
        run: OPSC_RELEASE_TEST_CONCURRENCY=4 node scripts/release-test-runner.js
      - name: Security dependency audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Mobile dependency audit
        working-directory: mobile
        run: npm audit --omit=dev --audit-level=high

  deploy:
    needs: [verify]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert production ref
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Install Vercel CLI
        run: npm install -g vercel@65.14.0
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Embed current GitHub Actions release identity
        run: node scripts/write-vercel-release-identity.js
      - name: Compute package fingerprint for this commit
        id: package_fp
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opscore-source-${GITHUB_SHA}.zip"
          git archive --format=zip --output="$archive" HEAD
          sha="$(sha256sum "$archive" | awk '{print $1}')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_SHA256=$sha"
          echo "PACKAGE_COMMIT=$GITHUB_SHA"
      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # CI-asserted release identity for CLI deploys (deployment-proof + release-proof).
          OPSC_RELEASE_DEPLOYMENT_SOURCE: github-actions-cli
          OPSC_RELEASE_CI_COMMIT: ${{ github.sha }}
          OPSC_RELEASE_CI_PIPELINE_ID: ${{ github.run_id }}
          OPSC_SOURCE_COMMIT_SHA: ${{ github.sha }}
          OPSC_RELEASE_CI_REF: ${{ github.ref_name }}
          OPSC_RELEASE_PACKAGE_SHA256: ${{ steps.package_fp.outputs.sha }}
          OPSC_RELEASE_PACKAGE_COMMIT: ${{ github.sha }}
          OPSC_PRODUCTION_ISOLATION_CERTIFICATION: NOT_CERTIFIED
      - name: Verify Vercel output contains the current release identity
        run: |
          set -euo pipefail
          # Prefer the file embedded in the build output; fall back to the source path
          # written by write-vercel-release-identity.js (includeFiles: backend/**).
          identity_file="$(find .vercel/output -type f -name 'opscore-vercel-release-identity.json' 2>/dev/null | head -n 1 || true)"
          if [ -z "${identity_file}" ]; then
            identity_file="backend/src/opscore-vercel-release-identity.json"
          fi
          test -f "$identity_file"
          echo "IDENTITY_FILE=$identity_file"
          IDENTITY_FILE="$identity_file" node -e '
            const fs = require("node:fs");
            const identity = JSON.parse(fs.readFileSync(process.env.IDENTITY_FILE, "utf8"));
            const expected = {
              commitSha: process.env.GITHUB_SHA.toLowerCase(),
              pipelineId: String(process.env.GITHUB_RUN_ID),
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              ref: "main",
              repository: process.env.GITHUB_REPOSITORY
            };
            for (const [key, value] of Object.entries(expected)) {
              if (String(identity[key]) !== String(value)) {
                throw new Error(`VERCEL_RELEASE_IDENTITY_MISMATCH:${key}:got=${identity[key]}:expected=${value}`);
              }
            }
            console.log("VERCEL_RELEASE_IDENTITY_VERIFY=PASS");
          '
      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          OPSC_RELEASE_DEPLOYMENT_SOURCE: github-actions-cli
          OPSC_RELEASE_CI_COMMIT: ${{ github.sha }}
          OPSC_RELEASE_CI_PIPELINE_ID: ${{ github.run_id }}
          OPSC_SOURCE_COMMIT_SHA: ${{ github.sha }}
          OPSC_RELEASE_CI_REF: ${{ github.ref_name }}
          OPSC_RELEASE_PACKAGE_SHA256: ${{ steps.package_fp.outputs.sha }}
          OPSC_RELEASE_PACKAGE_COMMIT: ${{ github.sha }}
          OPSC_PRODUCTION_ISOLATION_CERTIFICATION: NOT_CERTIFIED
