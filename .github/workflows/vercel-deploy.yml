name: vercel-deploy
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: |
          node --check backend/src/config.js
          node --check backend/src/security.js
          node --check backend/src/store.js
          node --check backend/src/server.js
      - name: Hardened metadata gate
        working-directory: backend
        run: npm run verify:hardened
      - name: Backend release regression suite
        working-directory: backend
        run: OPSC_RELEASE_TEST_CONCURRENCY=12 node scripts/release-test-runner.js
      - name: Security dependency audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  deploy:
    needs: [verify]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Vercel CLI
        run: npm install -g vercel@65.14.0
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # CI-asserted release identity for CLI deploys (deployment-proof + release-proof).
          OPSC_RELEASE_DEPLOYMENT_SOURCE: cli
          OPSC_RELEASE_CI_COMMIT: ${{ github.sha }}
          OPSC_RELEASE_CI_PIPELINE_ID: ${{ github.run_id }}
          OPSC_SOURCE_COMMIT_SHA: ${{ github.sha }}
          OPSC_RELEASE_CI_REF: ${{ github.ref_name }}
          OPSC_PRODUCTION_ISOLATION_CERTIFICATION: NOT_CERTIFIED
      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          OPSC_RELEASE_DEPLOYMENT_SOURCE: cli
          OPSC_RELEASE_CI_COMMIT: ${{ github.sha }}
          OPSC_RELEASE_CI_PIPELINE_ID: ${{ github.run_id }}
          OPSC_SOURCE_COMMIT_SHA: ${{ github.sha }}
          OPSC_RELEASE_CI_REF: ${{ github.ref_name }}
          OPSC_PRODUCTION_ISOLATION_CERTIFICATION: NOT_CERTIFIED
