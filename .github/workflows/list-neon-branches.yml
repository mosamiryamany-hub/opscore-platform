name: list-neon-branches
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-24.04
    steps:
      - name: List branches and endpoints
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: summer-leaf-18448271
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" -o /tmp/branches.json
          python3 - <<'PY'
import json
d=json.load(open("/tmp/branches.json"))
branches=d.get("branches") or d.get("items") or []
print("count", len(branches))
for b in branches:
  print("---")
  print("id", b.get("id"))
  print("name", b.get("name"))
  print("primary", b.get("primary") or b.get("default"))
  print("protected", b.get("protected"))
  print("parent", b.get("parent_id") or b.get("parent_lsn"))
  print("created", b.get("created_at"))
  print("updated", b.get("updated_at"))
  print("state", b.get("current_state") or b.get("state"))
  print("logical_size", b.get("logical_size"))
  print("cpu", b.get("cpu_used_sec"))
PY
          curl -sS -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/snapshots" -o /tmp/snaps.json || true
          python3 - <<'PY'
import json
try:
  d=json.load(open("/tmp/snaps.json"))
except Exception as e:
  print("snaps_err", e); raise
snaps=d.get("snapshots") or d.get("items") or []
print("snapshots", len(snaps))
for s in snaps:
  print("---")
  print("id", s.get("id")); print("name", s.get("name")); print("branch", s.get("source_branch_id") or s.get("branch_id")); print("created", s.get("created_at")); print("expires", s.get("expires_at"))
PY
