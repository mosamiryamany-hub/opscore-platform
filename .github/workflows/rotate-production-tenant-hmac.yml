name: Rotate Production tenant HMAC key

# Manual, typed-confirmation key rotation only. GitHub Environment reviewer protection must be verified separately. This workflow does not deploy,
# open the Production traffic hold, or enable signed routes.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ROTATE_PRODUCTION_TENANT_HMAC to prepare and install a new Production key
        required: true
        type: string
      key_ttl_days:
        description: New key validity window (the previous keys remain enabled during overlap)
        required: true
        default: '30'
        type: string

permissions:
  contents: read

concurrency:
  group: production-tenant-hmac-rotation
  cancel-in-progress: false

jobs:
  rotate:
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'ROTATE_PRODUCTION_TENANT_HMAC' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate exact Production targets and inputs
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          KEY_TTL_DAYS: ${{ inputs.key_ttl_days }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "${NEON_API_KEY:-}" || { echo "NEON_API_KEY_MISSING"; exit 1; }
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN_MISSING"; exit 1; }
          test "$VERCEL_PROJECT_ID" = "prj_uOWgtujJcukgtkqR4RawQbiyiEKz" || { echo "UNAPPROVED_VERCEL_PROJECT"; exit 1; }
          python3 - <<'PY'
          import os
          raw = os.environ["KEY_TTL_DAYS"]
          if not raw.isdecimal() or not 1 <= int(raw) <= 30:
              raise SystemExit("KEY_TTL_DAYS_MUST_BE_1_TO_30")
          PY

      - name: Resolve and verify the exact Neon Production primary and direct endpoint
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          export PROJECT_ID="summer-leaf-18448271"
          export PRIMARY_BRANCH_ID="br-proud-salad-bcshhdap"
          export DATABASE_NAME="opscore_acceptance"
          export ROLE_NAME="neondb_owner"
          AUTH=(-H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json")
          curl -fsS "${AUTH[@]}" "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/branches?limit=100" > "$RUNNER_TEMP/branches.json"
          python3 - <<'PY'
          import json, os, pathlib
          data = json.load(open(pathlib.Path(os.environ["RUNNER_TEMP"]) / "branches.json", encoding="utf-8"))
          branches = data.get("branches") or []
          matches = [b for b in branches if b.get("id") == os.environ["PRIMARY_BRANCH_ID"]]
          if len(matches) != 1:
              raise SystemExit("PRODUCTION_PRIMARY_BRANCH_NOT_UNIQUE")
          b = matches[0]
          if not b.get("primary") or not b.get("default") or str(b.get("current_state") or "").lower() != "ready":
              raise SystemExit("PRODUCTION_PRIMARY_BRANCH_IDENTITY_INVALID")
          pathlib.Path(os.environ["RUNNER_TEMP"], "production-branch.json").write_text(
              json.dumps({"id": b["id"], "name": b.get("name"), "primary": True, "default": True}),
              encoding="utf-8"
          )
          print("production_primary_identity=PASS")
          PY

          curl -fsS -G "${AUTH[@]}"             --data-urlencode "branch_id=${PRIMARY_BRANCH_ID}"             --data-urlencode "database_name=${DATABASE_NAME}"             --data-urlencode "role_name=${ROLE_NAME}"             --data-urlencode "pooled=false"             "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/connection_uri" > "$RUNNER_TEMP/production-uri.json"
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse
          data = json.load(open(pathlib.Path(os.environ["RUNNER_TEMP"]) / "production-uri.json", encoding="utf-8"))
          uri = str(data.get("uri") or "")
          parsed = urllib.parse.urlparse(uri)
          host = str(parsed.hostname or "").lower()
          database = parsed.path.lstrip("/").split("/", 1)[0]
          if parsed.scheme not in ("postgres", "postgresql") or not host or "-pooler" in host:
              raise SystemExit("PRODUCTION_DIRECT_ENDPOINT_REQUIRED")
          if database != os.environ["DATABASE_NAME"]:
              raise SystemExit("PRODUCTION_DATABASE_IDENTITY_MISMATCH")
          pathlib.Path(os.environ["RUNNER_TEMP"], "production.uri").write_text(uri, encoding="utf-8")
          pathlib.Path(os.environ["RUNNER_TEMP"], "production.host").write_text(host, encoding="utf-8")
          print("production_direct_endpoint=PASS")
          PY
          chmod 600 "$RUNNER_TEMP/production.uri"

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client

      - name: Generate key and install a new overlapping Production key
        id: key
        env:
          KEY_TTL_DAYS: ${{ inputs.key_ttl_days }}
        run: |
          set -euo pipefail
          KEY_ID="prod-$(date -u +%Y%m%d)-$(openssl rand -hex 4)"
          openssl rand -hex 32 | tr -d '\n' > "$RUNNER_TEMP/key.hex"
          chmod 600 "$RUNNER_TEMP/key.hex"
          KEY_HEX="$(cat "$RUNNER_TEMP/key.hex")"
          echo "::add-mask::$KEY_HEX"
          test "${#KEY_HEX}" -eq 64
          case "$KEY_ID" in prod-[0-9a-f-]*) ;; *) echo "KEY_ID_INVALID"; exit 1 ;; esac
          TTL="$KEY_TTL_DAYS"
          URI="$(cat "$RUNNER_TEMP/production.uri")"
          # First verify the Primary target and fail closed if migrations 063+
          # have not installed the signed-context key table yet.
          psql "$URI" -X -v ON_ERROR_STOP=1 -qAt -c             "SELECT CASE WHEN current_database()='opscore_acceptance' AND current_user='neondb_owner' AND to_regclass('opscore_security.context_hmac_keys') IS NOT NULL THEN 'PRODUCTION_KEY_TABLE_READY' ELSE 'PRODUCTION_KEY_TABLE_OR_IDENTITY_INVALID' END"             | grep -Fx "PRODUCTION_KEY_TABLE_READY"
          # The new row is enabled; existing rows are never disabled, deleted,
          # or assigned an earlier expiry. This allows old deployment rollback.
          printf "%s\n"             "INSERT INTO opscore_security.context_hmac_keys (key_id, secret, enabled, not_before, not_after)"             "VALUES ('$KEY_ID', decode('$KEY_HEX','hex'), true, now(), now() + make_interval(days => $TTL));"             "SELECT key_id || ':' || enabled::text || ':' || octet_length(secret)::text FROM opscore_security.context_hmac_keys WHERE key_id='$KEY_ID';"             | psql "$URI" -X -v ON_ERROR_STOP=1 -qAt | grep -Fx "$KEY_ID:true:32"
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          echo "new_key_created_and_verified=true"
          echo "previous_key_rows_changed=false"

      - name: Synchronize only Production HMAC environment entries
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          KEY_ID: ${{ steps.key.outputs.key_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request

          token = os.environ["VERCEL_TOKEN"]
          project = os.environ["VERCEL_PROJECT_ID"]
          key_id = os.environ["KEY_ID"]
          key_hex = pathlib.Path(os.environ["RUNNER_TEMP"], "key.hex").read_text(encoding="utf-8").strip()
          if len(key_hex) != 64 or any(c not in "0123456789abcdef" for c in key_hex):
              raise SystemExit("GENERATED_HMAC_KEY_INVALID")
          key_json = json.dumps({"key_id": key_id, "secret_hex": key_hex}, separators=(",", ":"))
          print("::add-mask::" + key_json)

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read().decode("utf-8")
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"VERCEL_ENV_API_{method}_{error.code}:{detail[:500]}") from None

          def get_envs():
              return request("GET", f"https://api.vercel.com/v9/projects/{project}/env?limit=100").get("envs", [])

          values = {
              # These two variables contain signing-key material and must be
              # write-only (Vercel API type "sensitive" / UI visibility "secret").
              "OPSC_TENANT_CONTEXT_KEY_JSON": {"value": key_json, "type": "sensitive"},
              "OPSC_TENANT_CONTEXT_HMAC_KEY": {"value": key_hex, "type": "sensitive"},
              # A key identifier is metadata, not key material.
              "OPSC_TENANT_CONTEXT_KEY_ID": {"value": key_id, "type": "encrypted"},
          }
          for key, spec in values.items():
              value = spec["value"]
              env_type = spec["type"]
              rows = [e for e in get_envs() if e.get("key") == key and set(e.get("target") or []) == {"production"}]
              if len(rows) > 1:
                  raise SystemExit("PRODUCTION_ENV_ENTRY_NOT_UNIQUE:" + key)
              if rows:
                  # Vercel accepts a type update on this endpoint. The API must
                  # return the Secret visibility for signing material; fail closed
                  # if the platform refuses the conversion.
                  request("PATCH", f"https://api.vercel.com/v9/projects/{project}/env/{rows[0]['id']}", {
                      "value": value,
                      "target": ["production"],
                      "type": env_type,
                  })
                  print("updated Production env entry and type:", key, env_type)
              else:
                  request("POST", f"https://api.vercel.com/v10/projects/{project}/env", {
                      "key": key,
                      "value": value,
                      "type": env_type,
                      "target": ["production"],
                  })
                  print("created Production env entry and type:", key, env_type)

          verify = get_envs()
          for key, spec in values.items():
              rows = [e for e in verify if e.get("key") == key and set(e.get("target") or []) == {"production"}]
              if len(rows) != 1:
                  raise SystemExit("PRODUCTION_ENV_VERIFICATION_FAILED:" + key)
              if rows[0].get("type") != spec["type"]:
                  raise SystemExit("PRODUCTION_ENV_TYPE_VERIFICATION_FAILED:" + key)
              if spec["type"] == "sensitive" and rows[0].get("visibility") not in ("secret", "sensitive"):
                  raise SystemExit("PRODUCTION_ENV_SECRET_VISIBILITY_FAILED:" + key)
          print("production_hmac_env_sync=PASS")
          print("previous_key_rows_untouched=true")
          print("signed_route_enable_flags_unchanged=true")
          PY

      - name: Final safety summary
        env:
          KEY_ID: ${{ steps.key.outputs.key_id }}
        run: |
          set -euo pipefail
          echo "Production key_id installed: $KEY_ID"
          echo "Old HMAC keys remain enabled for overlap and rollback."
          echo "No Production deployment was started."
          echo "No signed-route enablement or traffic-hold flag was changed."
          echo "Retire old keys only in a separately approved post-soak operation."
