name: apply-preview-migration-068

on:
  workflow_dispatch:
    inputs:
      branch:
        default: "br-fragrant-king-bcr9928f"
      database:
        default: "opscore_acceptance"

permissions:
  contents: read

jobs:
  apply-068:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Preview URI
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          INPUT_DB: ${{ github.event.inputs.database }}
        run: |
          set -euo pipefail
          PROJECT_ID="summer-leaf-18448271"
          AUTH_H=(-H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json")
          BRANCH_ID="$INPUT_BRANCH"
          curl -fsS -G "${AUTH_H[@]}" \
            --data-urlencode "branch_id=${BRANCH_ID}" \
            --data-urlencode "database_name=${INPUT_DB}" \
            --data-urlencode "role_name=neondb_owner" \
            --data-urlencode "pooled=false" \
            "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/connection_uri" \
            > "$RUNNER_TEMP/uri.json"
          python3 -c 'import json,os;u=json.load(open(os.environ["RUNNER_TEMP"]+"/uri.json"))["uri"];assert u.startswith("postgres");open(os.environ["RUNNER_TEMP"]+"/preview.uri","w").write(u)'
          chmod 600 "$RUNNER_TEMP/preview.uri"
          sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client >/dev/null
          URI=$(cat "$RUNNER_TEMP/preview.uri")
          echo "=== role preflight ==="
          psql "$URI" -v ON_ERROR_STOP=1 -c "
            SELECT rolname, rolcanlogin, rolsuper, rolbypassrls, rolcreaterole, rolcreatedb, rolinherit
            FROM pg_roles WHERE rolname IN ('opscore_app','opscore_runtime','neondb_owner')
            ORDER BY rolname;"
          psql "$URI" -c "
            SELECT filename FROM schema_migrations
            WHERE filename LIKE '066%' OR filename LIKE '067%' OR filename LIKE '068%'
            ORDER BY 1;"
          echo "=== apply 068 via psql ==="
          set +e
          psql "$URI" -v ON_ERROR_STOP=1 -f backend/sql/postgres/068_opscore_app_role_privilege_lockdown.sql
          RC=$?
          set -e
          echo "psql_rc=$RC"
          if [ "$RC" -ne 0 ]; then
            echo "068_FAILED_CAPTURING_STATE"
            psql "$URI" -c "
              SELECT rolname, rolcanlogin, rolsuper, rolbypassrls, rolcreaterole, rolcreatedb, rolinherit
              FROM pg_roles WHERE rolname='opscore_app';" || true
            exit 1
          fi
          # Record in ledger if not present
          SHA=$(sha256sum backend/sql/postgres/068_opscore_app_role_privilege_lockdown.sql | awk '{print $1}')
          psql "$URI" -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.schema_migrations(filename, sha256, applied_at)
            SELECT '068_opscore_app_role_privilege_lockdown.sql', '$SHA', clock_timestamp()
            WHERE NOT EXISTS (
              SELECT 1 FROM public.schema_migrations
              WHERE filename='068_opscore_app_role_privilege_lockdown.sql'
            );"
          psql "$URI" -c "
            SELECT filename, left(sha256,12), applied_at FROM schema_migrations
            WHERE filename LIKE '06%' ORDER BY filename;"
          echo "PREVIEW_068_APPLIED=PASS"
