name: apply-preview-migrations

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Preview branch id or name (empty = auto-detect non-primary)
        required: false
        default: "br-fragrant-king-bcr9928f"
      database:
        description: Target database name
        required: false
        default: "neondb"

permissions:
  contents: read

concurrency:
  group: apply-preview-migrations
  cancel-in-progress: false

jobs:
  apply-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci --omit=dev

      - name: Resolve Preview connection (Neon API)
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          INPUT_DB: ${{ github.event.inputs.database }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || { echo "NEON_API_KEY_MISSING"; exit 1; }
          PROJECT_ID="summer-leaf-18448271"
          AUTH_H=(-H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json")
          BRANCHES=$(curl -fsS "${AUTH_H[@]}" "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/branches")
          echo "$BRANCHES" | python3 -c '
          import json,os,sys
          data=json.load(sys.stdin)
          branches=data.get("branches") or data
          want=(os.environ.get("INPUT_BRANCH") or "").strip()
          project_id="summer-leaf-18448271"
          chosen=None
          for b in branches:
            bid=str(b.get("id") or "")
            name=str(b.get("name") or "")
            lname=name.lower()
            primary=bool(b.get("primary") or b.get("default"))
            if want:
              if want in (bid, name):
                chosen=b; break
            else:
              if primary: continue
              if any(k in lname for k in ("preview","vercel","dev","fragrant","signed","accept")):
                chosen=b
                if "preview" in lname or "fragrant" in lname: break
          if not chosen:
            print("PREVIEW_BRANCH_NOT_FOUND", file=sys.stderr); sys.exit(1)
          if chosen.get("primary") or chosen.get("default"):
            print("REFUSING_PRIMARY_BRANCH", file=sys.stderr); sys.exit(1)
          open(os.environ["RUNNER_TEMP"]+"/branch.json","w").write(json.dumps({
            "id": chosen["id"], "name": chosen.get("name"), "project_id": project_id
          }))
          print("branch", chosen.get("name"), chosen["id"])
          '
          BRANCH_ID=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/branch.json"))["id"])')
          BRANCH_NAME=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/branch.json"))["name"])')
          echo "branch_id=$BRANCH_ID" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved Preview branch: $BRANCH_NAME ($BRANCH_ID)"
          curl -fsS -G "${AUTH_H[@]}" \
            --data-urlencode "branch_id=${BRANCH_ID}" \
            --data-urlencode "database_name=${INPUT_DB}" \
            --data-urlencode "role_name=neondb_owner" \
            --data-urlencode "pooled=false" \
            "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/connection_uri" \
            > "$RUNNER_TEMP/uri.json"
          python3 -c 'import json,os;u=json.load(open(os.environ["RUNNER_TEMP"]+"/uri.json"))["uri"]; assert u.startswith("postgres"); assert "-pooler" not in u; open(os.environ["RUNNER_TEMP"]+"/preview.uri","w").write(u)'
          chmod 600 "$RUNNER_TEMP/preview.uri"
          HOST=$(python3 -c 'from urllib.parse import urlparse; print(urlparse(open("'"$RUNNER_TEMP"'/preview.uri").read()).hostname)')
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "database=${INPUT_DB}" >> "$GITHUB_OUTPUT"
          echo "project_id=${PROJECT_ID}" >> "$GITHUB_OUTPUT"
          echo "endpoint host=$HOST db=$INPUT_DB"

      - name: Dry-run migrations on Preview
        env:
          OPSC_MIGRATION_TARGET_CLASS: preview
          OPSC_MIGRATION_EXPECTED_DATABASE: ${{ steps.neon.outputs.database }}
          OPSC_MIGRATION_EXPECTED_HOST: ${{ steps.neon.outputs.host }}
          OPSC_MIGRATION_EXPECTED_PROJECT_ID: ${{ steps.neon.outputs.project_id }}
          OPSC_MIGRATION_EXPECTED_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        working-directory: backend
        run: |
          set -euo pipefail
          export OPSC_MIGRATION_DATABASE_URL="$(cat "$RUNNER_TEMP/preview.uri")"
          node scripts/apply-postgres-migrations.js | tee "$RUNNER_TEMP/dry-run.json" || true
          python3 - <<'PY'
          import json,os,sys,re
          raw=open(os.environ["RUNNER_TEMP"]+"/dry-run.json").read()
          obj=None
          for m in re.finditer(r"\{[\s\S]*\}", raw):
            try: obj=json.loads(m.group(0))
            except: pass
          if not obj:
            print(raw[-2000:]); print("DRY_RUN_PARSE_FAIL"); sys.exit(1)
          print("dry_status", obj.get("status"))
          pending=obj.get("pending") or []
          print("pending_count", len(pending))
          for p in pending: print(" pending", p.get("filename"))
          if obj.get("status") != "DRY_RUN_PASS":
            print(json.dumps(obj, indent=2)[:2500]); sys.exit(1)
          PY

      - name: Apply migrations on Preview only
        env:
          OPSC_MIGRATION_TARGET_CLASS: preview
          OPSC_MIGRATION_EXPECTED_DATABASE: ${{ steps.neon.outputs.database }}
          OPSC_MIGRATION_EXPECTED_HOST: ${{ steps.neon.outputs.host }}
          OPSC_MIGRATION_EXPECTED_PROJECT_ID: ${{ steps.neon.outputs.project_id }}
          OPSC_MIGRATION_EXPECTED_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          OPSC_MIGRATION_CONFIRM_DATABASE: ${{ steps.neon.outputs.database }}
          OPSC_MIGRATION_CONFIRM_HOST: ${{ steps.neon.outputs.host }}
          OPSC_MIGRATION_CONFIRM_PROJECT_ID: ${{ steps.neon.outputs.project_id }}
          OPSC_MIGRATION_CONFIRM_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        working-directory: backend
        run: |
          set -euo pipefail
          export OPSC_MIGRATION_DATABASE_URL="$(cat "$RUNNER_TEMP/preview.uri")"
          unset OPSC_MIGRATION_ALLOW_PRODUCTION || true
          node scripts/apply-postgres-migrations.js --apply | tee "$RUNNER_TEMP/apply.json"
          python3 - <<'PY'
          import json,os,sys,re
          raw=open(os.environ["RUNNER_TEMP"]+"/apply.json").read()
          obj=None
          for m in re.finditer(r"\{[\s\S]*\}", raw):
            try: obj=json.loads(m.group(0))
            except: pass
          if not obj:
            print(raw[-2500:]); print("APPLY_PARSE_FAIL"); sys.exit(1)
          print(json.dumps({k:obj.get(k) for k in ("status","applied","target","neonIdentity","serverVersion")}, indent=2, default=str)[:4000])
          st=str(obj.get("status") or "")
          if "FAIL" in st.upper() or st in ("ERROR",):
            sys.exit(1)
          PY

      - name: Verify schema_migrations includes 066-068
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          URI="$(cat "$RUNNER_TEMP/preview.uri")"
          psql "$URI" -v ON_ERROR_STOP=1 -c \
            "SELECT filename, left(sha256,12) AS sha12, applied_at
             FROM public.schema_migrations
             WHERE filename LIKE '066%' OR filename LIKE '067%' OR filename LIKE '068%'
             ORDER BY filename;"
          COUNT=$(psql "$URI" -Atc \
            "SELECT count(*) FROM public.schema_migrations
             WHERE filename IN (
               '066_signed_tenant_context_verifier_search_path_hardening.sql',
               '067_signed_tenant_context_rls_policy_accessor_alignment.sql',
               '068_opscore_app_role_privilege_lockdown.sql'
             );")
          test "$COUNT" = "3" || { echo "MIGRATION_VERIFY_COUNT=$COUNT"; exit 1; }
          echo "PREVIEW_MIGRATIONS_066_068_VERIFIED=PASS"
