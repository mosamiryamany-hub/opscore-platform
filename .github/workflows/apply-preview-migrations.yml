name: apply-preview-migrations

on:
  workflow_call:
    inputs:
      branch:
        description: Exact non-default Neon acceptance branch ID
        required: false
        type: string
        default: "br-muddy-pine-bbrexgxx"
      database:
        description: Exact isolated application database
        required: false
        type: string
        default: "opscore_acceptance"
  push:
    branches:
      - ops/acceptance-neon-target-2026-11-19
    paths:
      - '.github/workflows/apply-preview-migrations.yml'
      - 'backend/sql/postgres/**'
      - 'backend/scripts/apply-postgres-migrations.js'
      - 'backend/scripts/validate-postgres-acceptance-target.js'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-preview-migrations.yml'
      - 'backend/sql/postgres/**'
      - 'backend/scripts/apply-postgres-migrations.js'
      - 'backend/scripts/validate-postgres-acceptance-target.js'
  workflow_dispatch:
    inputs:
      branch:
        description: Exact Neon Preview branch ID (primary, default, and protected branches are rejected)
        required: true
        default: "br-muddy-pine-bbrexgxx"
      database:
        description: Application database name (fixed to opscore_acceptance)
        required: true
        default: "opscore_acceptance"

permissions:
  contents: read

concurrency:
  group: apply-preview-migrations
  cancel-in-progress: false

jobs:
  apply-preview-only:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'ops/acceptance-neon-target-2026-11-19' || github.head_ref == 'fix/neon-preview-sequence-acl-check-2026-11-22'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci --omit=dev

      - name: Bind exact isolated Neon acceptance branch
        id: neon
        env:
          INPUT_BRANCH: ${{ inputs.branch || github.event.inputs.branch || 'br-muddy-pine-bbrexgxx' }}
          INPUT_DB: ${{ inputs.database || github.event.inputs.database || 'opscore_acceptance' }}
        run: |
          set -euo pipefail
          PROJECT_ID='sweet-union-58466913'
          PRIMARY_BRANCH_ID='br-weathered-tree-bbha3dx4'
          BRANCH_ID='br-muddy-pine-bbrexgxx'
          HOST='ep-green-frog-bbyayuh5.c-15.us-east-1.aws.neon.tech'
          test "$INPUT_BRANCH" = "$BRANCH_ID" || { echo 'EXACT_ACCEPTANCE_BRANCH_REQUIRED'; exit 1; }
          test "$INPUT_DB" = 'opscore_acceptance' || { echo 'EXACT_ACCEPTANCE_DATABASE_REQUIRED'; exit 1; }
          test "$BRANCH_ID" != "$PRIMARY_BRANCH_ID" || { echo 'REFUSING_NEON_PRIMARY_BRANCH'; exit 1; }
          echo "branch_id=$BRANCH_ID" >> "$GITHUB_OUTPUT"
          echo "branch_name=acceptance-clean-security-2026-11-22" >> "$GITHUB_OUTPUT"
          echo "database=$INPUT_DB" >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "NEON_ACCEPTANCE_TARGET=PASS project=$PROJECT_ID branch=$BRANCH_ID database=$INPUT_DB host=$HOST"
          # STATIC_EXACT_PREVIEW_TARGET guard: exactly one pinned non-primary branch.
          case "${BRANCH_ID}" in ""|*,*) echo "STATIC_EXACT_PREVIEW_TARGET_VIOLATION branch=$BRANCH_ID" >&2; exit 1 ;; esac

      - name: Resolve isolated Neon owner and runtime connections from Vercel Development secrets
        id: connections
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: team_xysgxd2E3CsVIYklf0nxOKop
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'VERCEL_TOKEN_MISSING'; exit 1; }
          test "$VERCEL_PROJECT_ID" = 'prj_8jMqBt0l6OALicWSwQ3ECQTn8yPe' || { echo 'UNAPPROVED_VERCEL_PROJECT'; exit 1; }
          python3 - <<'PY'
          import json,os,subprocess
          envs={
            "OPSC_MIGRATION_DATABASE_URL":"NaIbwIDagdogTmWE",
            "OPSC_ACCEPTANCE_RUNTIME_DATABASE_URL":"2ACxh1Oi5TWMDn5v",
            "OPSC_PREVIEW_BOOTSTRAP_DATABASE_URL":"mF7e7nmzY2h6uaT0"
          }
          for key,env_id in envs.items():
            url="https://api.vercel.com/v1/projects/"+os.environ["VERCEL_PROJECT_ID"]+"/env/"+env_id+"?teamId="+os.environ["VERCEL_TEAM_ID"]
            out=os.environ["RUNNER_TEMP"]+"/"+key+".json"
            with open(out,"w") as f:
              subprocess.run(["curl","-fsS","-H","Authorization: Bearer "+os.environ["VERCEL_TOKEN"],"-H","Accept: application/json",url],stdout=f,check=True)
            item=json.load(open(out))
            value=str(item.get("value") or "")
            if not value.startswith("postgresql://"):
              raise SystemExit("VERCEL_DEVELOPMENT_SECRET_NOT_DECRYPTED:"+key)
            open(os.environ["RUNNER_TEMP"]+"/"+key+".uri","w").write(value)
          PY
          python3 - <<'PY'
          import os,sys
          from urllib.parse import urlsplit,parse_qs
          root=os.environ['RUNNER_TEMP']+'/'
          expected_host='ep-green-frog-bbyayuh5.c-15.us-east-1.aws.neon.tech'
          expected_db='opscore_acceptance'
          checks=[
            ('OPSC_MIGRATION_DATABASE_URL','neondb_owner','owner.uri'),
            ('OPSC_ACCEPTANCE_RUNTIME_DATABASE_URL','opscore_runtime','runtime.uri'),
            ('OPSC_PREVIEW_BOOTSTRAP_DATABASE_URL','opscore_owner','bootstrap.uri')
          ]
          for key,role,target_name in checks:
            value=open(root+key+'.uri').read().strip()
            u=urlsplit(value)
            q=parse_qs(u.query)
            if u.scheme!='postgresql' or u.username!=role or u.hostname!=expected_host or u.path.lstrip('/')!=expected_db or q.get('sslmode')!=['verify-full'] or q.get('channel_binding')!=['require']:
              raise SystemExit('VERCEL_NEON_CONNECTION_IDENTITY_MISMATCH:'+key)
            print('::add-mask::'+value)
            target=root+target_name
            open(target,'w').write(value)
          PY
          chmod 600 "$RUNNER_TEMP/owner.uri" "$RUNNER_TEMP/runtime.uri" "$RUNNER_TEMP/bootstrap.uri"
          echo 'NEON_MIGRATION_BOOTSTRAP_AND_RUNTIME_CONNECTIONS=PASS roles=neondb_owner,opscore_owner,opscore_runtime TLS=verify-full'

      - name: Bootstrap Neon Preview migration privileges from the dedicated admin connection
        run: |
          set -euo pipefail
          PGURI="$(cat "$RUNNER_TEMP/bootstrap.uri")"
          case "$PGURI" in *"?"*) PGURI="$PGURI&sslrootcert=system";; *) PGURI="$PGURI?sslrootcert=system";; esac
          test -n "$PGURI" || { echo "PREVIEW_BOOTSTRAP_URI_MISSING" >&2; exit 1; }
          psql "$PGURI" -v ON_ERROR_STOP=1 -q <<'SQL'
          DO $$
          DECLARE
            bootstrap_role record;
          BEGIN
            IF current_user <> 'opscore_owner' THEN
              RAISE EXCEPTION 'PREVIEW_BOOTSTRAP_LOGIN_ROLE_MUST_BE_OPSCORE_OWNER';
            END IF;
            SELECT rolcanlogin, rolsuper, rolbypassrls, rolcreatedb, rolcreaterole
            INTO bootstrap_role
            FROM pg_catalog.pg_roles
            WHERE rolname = current_user;
            IF NOT FOUND
               OR bootstrap_role.rolcanlogin IS NOT TRUE
               OR bootstrap_role.rolsuper IS NOT FALSE
               OR bootstrap_role.rolbypassrls IS NOT TRUE
               OR bootstrap_role.rolcreatedb IS NOT TRUE
               OR bootstrap_role.rolcreaterole IS NOT TRUE THEN
              RAISE EXCEPTION 'PREVIEW_BOOTSTRAP_ROLE_CAPABILITIES_INVALID';
            END IF;
          END $$;
          GRANT CREATE ON DATABASE opscore_acceptance TO neondb_owner;
          GRANT CREATE, USAGE ON SCHEMA public TO neondb_owner;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO neondb_owner;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO neondb_owner;
          DO $$
          DECLARE
            migration_role record;
          BEGIN
            SELECT rolcanlogin, rolsuper, rolbypassrls, rolcreatedb, rolcreaterole
            INTO migration_role
            FROM pg_catalog.pg_roles
            WHERE rolname = 'neondb_owner';
            IF NOT FOUND
               OR migration_role.rolcanlogin IS NOT TRUE
               OR migration_role.rolsuper IS NOT FALSE
               OR migration_role.rolbypassrls IS NOT TRUE
               OR migration_role.rolcreatedb IS NOT TRUE
               OR migration_role.rolcreaterole IS NOT TRUE
               OR NOT has_schema_privilege('neondb_owner','public','CREATE')
               OR NOT has_schema_privilege('neondb_owner','public','USAGE')
               OR NOT has_database_privilege('neondb_owner',current_database(),'CREATE')
               OR EXISTS (
                 SELECT 1
                 FROM pg_catalog.pg_class c
                 JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace
                 WHERE n.nspname='public'
                   AND c.relkind IN ('r','p')
                   AND NOT has_table_privilege('neondb_owner',c.oid,'SELECT')
               )
            THEN
              RAISE EXCEPTION 'PREVIEW_MIGRATION_OWNER_PRIVILEGES_INVALID';
            END IF;
          END $$;
          SQL
          MIGRATION_URI="$(cat "$RUNNER_TEMP/owner.uri")"
          case "$MIGRATION_URI" in *"?"*) MIGRATION_URI="$MIGRATION_URI&sslrootcert=system";; *) MIGRATION_URI="$MIGRATION_URI?sslrootcert=system";; esac
          psql "$MIGRATION_URI" -v ON_ERROR_STOP=1 -q <<'SQL'
          DO $$
          DECLARE
            migration_role record;
          BEGIN
            IF current_user <> 'neondb_owner' THEN
              RAISE EXCEPTION 'PREVIEW_MIGRATION_LOGIN_ROLE_MUST_BE_NEONDB_OWNER';
            END IF;
            SELECT rolcanlogin, rolsuper, rolbypassrls
            INTO migration_role
            FROM pg_catalog.pg_roles
            WHERE rolname = current_user;
            IF NOT FOUND
               OR migration_role.rolcanlogin IS NOT TRUE
               OR migration_role.rolsuper IS NOT FALSE
               OR migration_role.rolbypassrls IS NOT TRUE
               OR NOT has_schema_privilege(current_user,'public','CREATE')
               OR NOT has_schema_privilege(current_user,'public','USAGE') THEN
              RAISE EXCEPTION 'PREVIEW_MIGRATION_OWNER_PRIVILEGES_INVALID';
            END IF;
          END $$;
          SQL
          echo "NEON_MIGRATION_OWNER_ROLE=PASS"
          echo "PREVIEW_MIGRATION_BOOTSTRAP_PRIVILEGES=PASS"

      - name: Clear unintended opscore_app memberships on isolated Preview
        run: |
          set -euo pipefail
          # Membership was granted to opscore_owner with ADMIN OPTION; neondb_owner
          # is the migration executor and is not the membership grantor/admin.
          # Use the already pinned, verified Preview bootstrap identity for this
          # narrowly scoped role-membership repair.
          export PGURI="$(cat "$RUNNER_TEMP/bootstrap.uri")"; case "$PGURI" in *"?"*) PGURI="$PGURI&sslrootcert=system";; *) PGURI="$PGURI?sslrootcert=system";; esac; export PGURI
          # opscore_app must not have members before 068 repair preflight. Preview
          # acceptance DBs can accumulate GRANT opscore_app TO <role> from older tests.
          # Revoke only membership *into* opscore_app; never touch production project.
          psql "$PGURI" -v ON_ERROR_STOP=1 -q <<'SQL'
          DO $$
          DECLARE
            member_name text;
            revoked integer := 0;
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'opscore_app') THEN
              RAISE NOTICE 'OPSC_APP_ROLE_ABSENT_NO_MEMBERSHIP_CLEANUP';
              RETURN;
            END IF;
            FOR member_name IN
              SELECT m.rolname
              FROM pg_auth_members am
              JOIN pg_roles r ON r.oid = am.roleid AND r.rolname = 'opscore_app'
              JOIN pg_roles m ON m.oid = am.member
            LOOP
              EXECUTE format('REVOKE opscore_app FROM %I', member_name);
              revoked := revoked + 1;
            END LOOP;
            RAISE NOTICE 'OPSC_APP_ROLE_INCOMING_MEMBERSHIPS_REVOKED=%', revoked;
          END $$;
          SQL
          remaining="$(psql "$PGURI" -Atc "SELECT count(*) FROM pg_auth_members am JOIN pg_roles r ON r.oid=am.roleid AND r.rolname='opscore_app'")"
          echo "OPSC_APP_INCOMING_MEMBERSHIPS_REMAINING=${remaining}"
          if [ "${remaining}" = "0" ]; then
            echo "PREVIEW_APP_ROLE_MEMBERSHIP_CLEANUP=PASS"
          else
            echo "PREVIEW_APP_ROLE_MEMBERSHIP_CLEANUP=PARTIAL_UNREVOCABLE"
          fi

      - name: Dry-run migrations on Preview
        env:
          OPSC_MIGRATION_TARGET_CLASS: preview
          OPSC_MIGRATION_EXPECTED_OWNER_ROLE: neondb_owner
          OPSC_MIGRATION_PINNED_NEON_IDENTITY: '1'
          OPSC_MIGRATION_EXPECTED_DATABASE: ${{ steps.neon.outputs.database }}
          OPSC_MIGRATION_EXPECTED_HOST: ${{ steps.neon.outputs.host }}
          OPSC_MIGRATION_EXPECTED_PROJECT_ID: ${{ steps.neon.outputs.project_id }}
          OPSC_MIGRATION_EXPECTED_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        working-directory: backend
        run: |
          set -euo pipefail
          export OPSC_MIGRATION_DATABASE_URL="$(cat "$RUNNER_TEMP/owner.uri")"; case "$OPSC_MIGRATION_DATABASE_URL" in *"?"*) OPSC_MIGRATION_DATABASE_URL="$OPSC_MIGRATION_DATABASE_URL&sslrootcert=system";; *) OPSC_MIGRATION_DATABASE_URL="$OPSC_MIGRATION_DATABASE_URL?sslrootcert=system";; esac; export OPSC_MIGRATION_DATABASE_URL
          node scripts/apply-postgres-migrations.js | tee "$RUNNER_TEMP/dry-run.json"
          python3 - <<'PY'
          import json,os,sys,re
          raw=open(os.environ["RUNNER_TEMP"]+"/dry-run.json").read()
          obj=None
          for m in re.finditer(r"\{[\s\S]*\}", raw):
            try: obj=json.loads(m.group(0))
            except: pass
          if not obj:
            print(raw[-2000:]); print("DRY_RUN_PARSE_FAIL"); sys.exit(1)
          print("dry_status", obj.get("status"))
          pending=obj.get("pending") or []
          print("pending_count", len(pending))
          for p in pending: print(" pending", p.get("filename"))
          identity=obj.get("neonIdentity") or {}
          if identity.get("pinned") is not True or identity.get("projectId") != "sweet-union-58466913" or identity.get("branchId") != "br-muddy-pine-bbrexgxx" or identity.get("host") != "ep-green-frog-bbyayuh5.c-15.us-east-1.aws.neon.tech":
            print("DRY_RUN_NEON_PINNED_IDENTITY_MISMATCH"); sys.exit(1)
          if obj.get("status") != "DRY_RUN_PASS":
            print(json.dumps(obj, indent=2)[:2500]); sys.exit(1)
          PY

      - name: Apply migrations on Preview only
        id: preview_apply
        continue-on-error: true
        env:
          OPSC_MIGRATION_TARGET_CLASS: preview
          OPSC_MIGRATION_EXPECTED_OWNER_ROLE: neondb_owner
          OPSC_MIGRATION_PINNED_NEON_IDENTITY: '1'
          OPSC_MIGRATION_EXPECTED_DATABASE: ${{ steps.neon.outputs.database }}
          OPSC_MIGRATION_EXPECTED_HOST: ${{ steps.neon.outputs.host }}
          OPSC_MIGRATION_EXPECTED_PROJECT_ID: ${{ steps.neon.outputs.project_id }}
          OPSC_MIGRATION_EXPECTED_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          OPSC_MIGRATION_CONFIRM_DATABASE: ${{ steps.neon.outputs.database }}
          OPSC_MIGRATION_CONFIRM_HOST: ${{ steps.neon.outputs.host }}
          OPSC_MIGRATION_CONFIRM_PROJECT_ID: ${{ steps.neon.outputs.project_id }}
          OPSC_MIGRATION_CONFIRM_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        working-directory: backend
        run: |
          set -euo pipefail
          export OPSC_MIGRATION_DATABASE_URL="$(cat "$RUNNER_TEMP/owner.uri")"; case "$OPSC_MIGRATION_DATABASE_URL" in *"?"*) OPSC_MIGRATION_DATABASE_URL="$OPSC_MIGRATION_DATABASE_URL&sslrootcert=system";; *) OPSC_MIGRATION_DATABASE_URL="$OPSC_MIGRATION_DATABASE_URL?sslrootcert=system";; esac; export OPSC_MIGRATION_DATABASE_URL
          unset OPSC_MIGRATION_ALLOW_PRODUCTION || true
          node scripts/apply-postgres-migrations.js --apply | tee "$RUNNER_TEMP/apply.json"
          python3 - <<'PY'
          import json,os,sys,re
          raw=open(os.environ["RUNNER_TEMP"]+"/apply.json").read()
          obj=None
          for m in re.finditer(r"\{[\s\S]*\}", raw):
            try: obj=json.loads(m.group(0))
            except: pass
          if not obj:
            print(raw[-2500:]); print("APPLY_PARSE_FAIL"); sys.exit(1)
          print(json.dumps({k:obj.get(k) for k in ("status","applied","target","neonIdentity","serverVersion")}, indent=2, default=str)[:4000])
          identity=obj.get("neonIdentity") or {}
          if identity.get("pinned") is not True or identity.get("projectId") != "sweet-union-58466913" or identity.get("branchId") != "br-muddy-pine-bbrexgxx" or identity.get("host") != "ep-green-frog-bbyayuh5.c-15.us-east-1.aws.neon.tech":
            print("APPLY_NEON_PINNED_IDENTITY_MISMATCH"); sys.exit(1)
          st=str(obj.get("status") or "")
          if st != "APPLIED_AND_VERIFIED":
            print("APPLY_STATUS_NOT_VERIFIED:"+st)
            sys.exit(1)
          PY

      - name: Verify exact Preview migration hashes for 057, 065, and 070
        id: preview_ledger_verify
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          URI="$(cat "$RUNNER_TEMP/owner.uri")"; case "$URI" in *"?"*) URI="$URI&sslrootcert=system";; *) URI="$URI?sslrootcert=system";; esac; export URI
          for migration in \
            057_read_only_runtime_migration_ledger_attestation.sql \
            065_signed_tenant_context_evidence_upload_chunks.sql \
            070_evidence_upload_postgres_blob_storage.sql; do
            expected="$(sha256sum "backend/sql/postgres/$migration" | awk '{print $1}')"
            actual="$(psql "$URI" -v ON_ERROR_STOP=1 -AtXc "SELECT lower(sha256) FROM public.schema_migrations WHERE filename = '$migration'")"
            test -n "$actual" || { echo "PREVIEW_MIGRATION_LEDGER_ENTRY_MISSING=$migration"; exit 1; }
            test "$actual" = "$expected" || { echo "PREVIEW_MIGRATION_LEDGER_HASH_MISMATCH=$migration"; exit 1; }
            echo "PREVIEW_MIGRATION_LEDGER_HASH_MATCH=PASS $migration"
          done
          echo "PREVIEW_MIGRATION_HASHES_057_065_070=PASS"

      - name: Require Preview migration application and ledger verification
        run: |
          set -euo pipefail
          apply_outcome="${{ steps.preview_apply.outcome }}"
          ledger_outcome="${{ steps.preview_ledger_verify.outcome }}"
          echo "PREVIEW_APPLY_OUTCOME=${apply_outcome}"
          echo "PREVIEW_LEDGER_VERIFY_OUTCOME=${ledger_outcome}"
          test "$apply_outcome" = "success" || { echo "PREVIEW_MIGRATION_APPLY_NOT_PASS:$apply_outcome" >&2; exit 1; }
          test "$ledger_outcome" = "success" || { echo "PREVIEW_MIGRATION_LEDGER_NOT_PASS:$ledger_outcome" >&2; exit 1; }
          echo "PREVIEW_MIGRATION_APPLY=PASS"

      - name: Run PostgreSQL HTTP commercial acceptance against isolated Neon
        id: preview_http
        continue-on-error: true
        working-directory: backend
        run: |
          set -euo pipefail
          export OPSC_PG_ACCEPTANCE_URL="$(cat "$RUNNER_TEMP/runtime.uri")"
          export OPSC_PG_ACCEPTANCE_HOST='ep-green-frog-bbyayuh5.c-15.us-east-1.aws.neon.tech'
          export OPSC_PG_ACCEPTANCE_STRICT='true'
          export OPSC_PG_ACCEPTANCE_RESULT_FILE="${GITHUB_WORKSPACE}/POSTGRES_HTTP_ACCEPTANCE_RESULT.json"
          export OPSC_WRITE_EVIDENCE='1'
          export CI_COMMIT_SHA="${GITHUB_SHA}"
          export CI_PIPELINE_ID="${GITHUB_RUN_ID}"
          node --test test/postgres-commercial-acceptance-http.test.js

      - name: Finalize Preview acceptance gate
        run: |
          set -euo pipefail
          apply_outcome="${{ steps.preview_apply.outcome }}"
          ledger_outcome="${{ steps.preview_ledger_verify.outcome }}"
          http_outcome="${{ steps.preview_http.outcome }}"
          echo "PREVIEW_APPLY_OUTCOME=${apply_outcome}"
          echo "PREVIEW_LEDGER_VERIFY_OUTCOME=${ledger_outcome}"
          echo "PREVIEW_HTTP_OUTCOME=${http_outcome}"
          test "$apply_outcome" = "success" || { echo "PREVIEW_MIGRATION_APPLY_NOT_PASS:$apply_outcome" >&2; exit 1; }
          test "$ledger_outcome" = "success" || { echo "PREVIEW_MIGRATION_LEDGER_NOT_PASS:$ledger_outcome" >&2; exit 1; }
          test "$http_outcome" = "success" || { echo "PREVIEW_HTTP_ACCEPTANCE_NOT_PASS:$http_outcome" >&2; exit 1; }
          echo "PREVIEW_ACCEPTANCE=PASS"
