name: apply-preview-migrations

on:
  workflow_call:
    inputs:
      branch:
        description: Exact non-default Neon acceptance branch ID
        required: false
        type: string
        default: "br-solitary-band-bbczy982"
      database:
        description: Exact isolated application database
        required: false
        type: string
        default: "opscore_acceptance"
  push:
    branches:
      - ops/acceptance-neon-target-2026-11-19
    paths:
      - '.github/workflows/apply-preview-migrations.yml'
      - 'backend/sql/postgres/**'
      - 'backend/scripts/apply-postgres-migrations.js'
      - 'backend/scripts/validate-postgres-acceptance-target.js'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-preview-migrations.yml'
      - 'backend/sql/postgres/**'
      - 'backend/scripts/apply-postgres-migrations.js'
      - 'backend/scripts/validate-postgres-acceptance-target.js'
  workflow_dispatch:
    inputs:
      branch:
        description: Exact Neon Preview branch ID (primary, default, and protected branches are rejected)
        required: true
        default: "br-solitary-band-bbczy982"
      database:
        description: Application database name (fixed to opscore_acceptance)
        required: true
        default: "opscore_acceptance"

permissions:
  contents: read

concurrency:
  group: apply-preview-migrations
  cancel-in-progress: false

jobs:
  apply-preview-only:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'ops/acceptance-neon-target-2026-11-19'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci --omit=dev

      - name: Resolve Preview connection (Neon API)
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          INPUT_BRANCH: ${{ inputs.branch || github.event.inputs.branch || 'br-solitary-band-bbczy982' }}
          INPUT_DB: ${{ inputs.database || github.event.inputs.database || 'opscore_acceptance' }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || { echo "NEON_API_KEY_MISSING"; exit 1; }
          PROJECT_ID="sweet-union-58466913"
          AUTH_H=(-H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json")
          BRANCHES=$(curl -fsS "${AUTH_H[@]}" "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/branches")
          echo "$BRANCHES" | python3 -c '
          import json,os,sys
          data=json.load(sys.stdin)
          branches=data.get("branches") or data
          want=(os.environ.get("INPUT_BRANCH") or "").strip()
          project_id="sweet-union-58466913"
          if not want.startswith("br-"):
            print("EXACT_PREVIEW_BRANCH_ID_REQUIRED", file=sys.stderr); sys.exit(1)
          matches=[b for b in branches if str(b.get("id") or "") == want]
          if len(matches) != 1:
            print("PREVIEW_BRANCH_NOT_UNIQUELY_RESOLVED", file=sys.stderr); sys.exit(1)
          chosen=matches[0]
          if chosen.get("primary") or chosen.get("default") or chosen.get("protected"):
            print("REFUSING_PRIMARY_DEFAULT_OR_PROTECTED_BRANCH", file=sys.stderr); sys.exit(1)
          if str(chosen.get("current_state") or "").lower() != "ready":
            print("PREVIEW_BRANCH_NOT_READY", file=sys.stderr); sys.exit(1)
          if os.environ.get("INPUT_DB") != "opscore_acceptance":
            print("PREVIEW_APPLICATION_DATABASE_REQUIRED", file=sys.stderr); sys.exit(1)
          open(os.environ["RUNNER_TEMP"]+"/branch.json","w").write(json.dumps({
            "id": chosen["id"], "name": chosen.get("name"), "project_id": project_id
          }))
          print("branch", chosen.get("name"), chosen["id"])
          '
          BRANCH_ID=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/branch.json"))["id"])')
          BRANCH_NAME=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/branch.json"))["name"])')
          echo "branch_id=$BRANCH_ID" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved Preview branch: $BRANCH_NAME ($BRANCH_ID)"
          URI_HTTP_STATUS="$(curl -sS -G "${AUTH_H[@]}" -o "$RUNNER_TEMP/uri-response.json" -w "%{http_code}" \
            --data-urlencode "branch_id=${BRANCH_ID}" \
            --data-urlencode "database_name=${INPUT_DB}" \
            --data-urlencode "role_name=opscore_owner" \
            --data-urlencode "endpoint_id=ep-dry-mouse-bbf5ozwy" \
            --data-urlencode "pooled=false" \
            "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/connection_uri")"
          if [[ "${URI_HTTP_STATUS}" != "200" ]]; then
            python3 - <<'PY'
          import json,os
          p=os.environ["RUNNER_TEMP"]+"/uri-response.json"
          try:
            d=json.load(open(p))
            print("NEON_CONNECTION_URI_HTTP_FAILURE", d.get("code"), d.get("message") or d.get("error"))
          except Exception:
            print("NEON_CONNECTION_URI_HTTP_FAILURE status="+os.environ.get("URI_HTTP_STATUS","unknown"))
          PY
            exit 1
          fi
          cp "$RUNNER_TEMP/uri-response.json" "$RUNNER_TEMP/uri.json"
          python3 - <<'PY'
          import json,os,sys
          from urllib.parse import urlsplit,urlunsplit,parse_qsl,urlencode
          u=json.load(open(os.environ["RUNNER_TEMP"]+"/uri.json"))["uri"]
          p=urlsplit(u)
          if p.scheme not in ("postgres","postgresql") or not p.hostname or "-pooler" in p.hostname:
            print("PREVIEW_DIRECT_POSTGRES_ENDPOINT_REQUIRED", file=sys.stderr); sys.exit(1)
          q=dict(parse_qsl(p.query, keep_blank_values=True))
          q["sslmode"]="verify-full"
          u=urlunsplit((p.scheme,p.netloc,p.path,urlencode(q),p.fragment))
          open(os.environ["RUNNER_TEMP"]+"/preview.uri","w").write(u)
          PY
          chmod 600 "$RUNNER_TEMP/preview.uri"
          HOST=$(python3 -c 'from urllib.parse import urlparse; print(urlparse(open("'"$RUNNER_TEMP"'/preview.uri").read()).hostname)')
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "database=${INPUT_DB}" >> "$GITHUB_OUTPUT"
          echo "project_id=${PROJECT_ID}" >> "$GITHUB_OUTPUT"
          echo "endpoint host=$HOST db=$INPUT_DB"

      - name: Dry-run migrations on Preview
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          OPSC_MIGRATION_TARGET_CLASS: preview
          OPSC_MIGRATION_EXPECTED_DATABASE: ${{ steps.neon.outputs.database }}
          OPSC_MIGRATION_EXPECTED_HOST: ${{ steps.neon.outputs.host }}
          OPSC_MIGRATION_EXPECTED_PROJECT_ID: ${{ steps.neon.outputs.project_id }}
          OPSC_MIGRATION_EXPECTED_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        working-directory: backend
        run: |
          set -euo pipefail
          export OPSC_MIGRATION_DATABASE_URL="$(cat "$RUNNER_TEMP/preview.uri")"
          node scripts/apply-postgres-migrations.js | tee "$RUNNER_TEMP/dry-run.json"
          python3 - <<'PY'
          import json,os,sys,re
          raw=open(os.environ["RUNNER_TEMP"]+"/dry-run.json").read()
          obj=None
          for m in re.finditer(r"\{[\s\S]*\}", raw):
            try: obj=json.loads(m.group(0))
            except: pass
          if not obj:
            print(raw[-2000:]); print("DRY_RUN_PARSE_FAIL"); sys.exit(1)
          print("dry_status", obj.get("status"))
          pending=obj.get("pending") or []
          print("pending_count", len(pending))
          for p in pending: print(" pending", p.get("filename"))
          if obj.get("status") != "DRY_RUN_PASS":
            print(json.dumps(obj, indent=2)[:2500]); sys.exit(1)
          PY

      - name: Apply migrations on Preview only
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          OPSC_MIGRATION_TARGET_CLASS: preview
          OPSC_MIGRATION_EXPECTED_DATABASE: ${{ steps.neon.outputs.database }}
          OPSC_MIGRATION_EXPECTED_HOST: ${{ steps.neon.outputs.host }}
          OPSC_MIGRATION_EXPECTED_PROJECT_ID: ${{ steps.neon.outputs.project_id }}
          OPSC_MIGRATION_EXPECTED_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          OPSC_MIGRATION_CONFIRM_DATABASE: ${{ steps.neon.outputs.database }}
          OPSC_MIGRATION_CONFIRM_HOST: ${{ steps.neon.outputs.host }}
          OPSC_MIGRATION_CONFIRM_PROJECT_ID: ${{ steps.neon.outputs.project_id }}
          OPSC_MIGRATION_CONFIRM_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        working-directory: backend
        run: |
          set -euo pipefail
          export OPSC_MIGRATION_DATABASE_URL="$(cat "$RUNNER_TEMP/preview.uri")"
          unset OPSC_MIGRATION_ALLOW_PRODUCTION || true
          node scripts/apply-postgres-migrations.js --apply | tee "$RUNNER_TEMP/apply.json"
          python3 - <<'PY'
          import json,os,sys,re
          raw=open(os.environ["RUNNER_TEMP"]+"/apply.json").read()
          obj=None
          for m in re.finditer(r"\{[\s\S]*\}", raw):
            try: obj=json.loads(m.group(0))
            except: pass
          if not obj:
            print(raw[-2500:]); print("APPLY_PARSE_FAIL"); sys.exit(1)
          print(json.dumps({k:obj.get(k) for k in ("status","applied","target","neonIdentity","serverVersion")}, indent=2, default=str)[:4000])
          st=str(obj.get("status") or "")
          if "FAIL" in st.upper() or st in ("ERROR",):
            sys.exit(1)
          PY

      - name: Verify schema_migrations includes 066-068
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          URI="$(cat "$RUNNER_TEMP/preview.uri")"
          psql "$URI" -v ON_ERROR_STOP=1 -c \
            "SELECT filename, left(sha256,12) AS sha12, applied_at
             FROM public.schema_migrations
             WHERE filename IN (
               '063_signed_tenant_context_verifier.sql',
               '064_signed_tenant_context_work_orders_routing.sql',
               '065_signed_tenant_context_evidence_upload_chunks.sql',
               '066_signed_tenant_context_verifier_search_path_hardening.sql',
               '067_signed_tenant_context_rls_policy_accessor_alignment.sql',
               '068_opscore_app_role_privilege_lockdown.sql'
             )
             ORDER BY filename;"
          COUNT=$(psql "$URI" -Atc \
            "SELECT count(*) FROM public.schema_migrations
             WHERE filename IN (
               '063_signed_tenant_context_verifier.sql',
               '064_signed_tenant_context_work_orders_routing.sql',
               '065_signed_tenant_context_evidence_upload_chunks.sql',
               '066_signed_tenant_context_verifier_search_path_hardening.sql',
               '067_signed_tenant_context_rls_policy_accessor_alignment.sql',
               '068_opscore_app_role_privilege_lockdown.sql'
             );")
          test "$COUNT" = "6" || { echo "MIGRATION_VERIFY_COUNT=$COUNT"; exit 1; }
          echo "PREVIEW_MIGRATIONS_066_068_VERIFIED=PASS"

      - name: Resolve least-privilege runtime connection for HTTP acceptance
        id: acceptance
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          INPUT_BRANCH: ${{ steps.neon.outputs.branch_id }}
          INPUT_DB: ${{ steps.neon.outputs.database }}
          PROJECT_ID: ${{ steps.neon.outputs.project_id }}
          EXPECTED_HOST: ${{ steps.neon.outputs.host }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}"
          AUTH_H=(-H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json")
          curl -fsS -G "${AUTH_H[@]}" \
            --data-urlencode "branch_id=${INPUT_BRANCH}" \
            --data-urlencode "database_name=${INPUT_DB}" \
            --data-urlencode "role_name=opscore_runtime" \
            --data-urlencode "endpoint_id=ep-dry-mouse-bbf5ozwy" \
            --data-urlencode "pooled=false" \
            "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/connection_uri" \
            > "$RUNNER_TEMP/runtime-uri.json"
          python3 - <<'PY'
          import json,os,sys
          from urllib.parse import urlsplit,urlunsplit,parse_qsl,urlencode
          raw=json.load(open(os.environ["RUNNER_TEMP"]+"/runtime-uri.json"))["uri"]
          p=urlsplit(raw)
          if p.scheme not in ("postgres","postgresql") or not p.hostname or "-pooler" in p.hostname:
            print("ACCEPTANCE_RUNTIME_DIRECT_POSTGRES_REQUIRED", file=sys.stderr); sys.exit(1)
          if p.hostname != os.environ["EXPECTED_HOST"]:
            print("ACCEPTANCE_RUNTIME_HOST_MISMATCH", file=sys.stderr); sys.exit(1)
          if p.path.lstrip("/") != os.environ["INPUT_DB"]:
            print("ACCEPTANCE_RUNTIME_DATABASE_MISMATCH", file=sys.stderr); sys.exit(1)
          q=dict(parse_qsl(p.query, keep_blank_values=True))
          q["sslmode"]="verify-full"
          uri=urlunsplit((p.scheme,p.netloc,p.path,urlencode(q),p.fragment))
          open(os.environ["RUNNER_TEMP"]+"/runtime.uri","w").write(uri)
          print("ACCEPTANCE_RUNTIME_IDENTITY=PASS role=opscore_runtime host="+p.hostname+" database="+os.environ["INPUT_DB"])
          PY
          chmod 600 "$RUNNER_TEMP/runtime.uri"
          URI="$(cat "$RUNNER_TEMP/runtime.uri")"
          echo "::add-mask::$URI"
          echo "url=$URI" >> "$GITHUB_OUTPUT"
          echo "host=${EXPECTED_HOST}" >> "$GITHUB_OUTPUT"

      - name: Run PostgreSQL HTTP commercial acceptance against isolated Neon
        working-directory: backend
        env:
          OPSC_PG_ACCEPTANCE_URL: ${{ steps.acceptance.outputs.url }}
          OPSC_PG_ACCEPTANCE_HOST: ${{ steps.acceptance.outputs.host }}
          OPSC_PG_ACCEPTANCE_STRICT: 'true'
          OPSC_PG_ACCEPTANCE_RESULT_FILE: ${{ github.workspace }}/POSTGRES_HTTP_ACCEPTANCE_RESULT.json
          OPSC_WRITE_EVIDENCE: '1'
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_PIPELINE_ID: ${{ github.run_id }}
        run: node --test test/postgres-commercial-acceptance-http.test.js
