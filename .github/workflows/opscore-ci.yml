name: OpsCore CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: opscore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Generate and verify CycloneDX 1.7 SBOM
        run: |
          node scripts/generate-sbom.js
          node scripts/verify-sbom.js
      - name: Syntax check
        run: |
          node --check backend/src/config.js
          node --check backend/src/security.js
          node --check backend/src/store.js
          node --check backend/src/server.js
          node --check backend/scripts/bootstrap.js
          node --check backend/src/bootstrap-policy.js
          node --check backend/src/firewall.js
          node --check backend/src/release-proof.js
          node --check backend/src/database-security-proof.js
          node --check scripts/production-deployment-smoke.js
          node --check scripts/verify-production-environment.js
          node --check scripts/generate-sbom.js
          node --check scripts/verify-sbom.js
      - name: Production deployment smoke contract tests
        run: node --test backend/test/production-deployment-smoke.test.js
      - name: Production environment preflight contract tests
        run: node --test backend/test/production-environment-preflight.test.js
      - name: Hardened metadata gate
        working-directory: backend
        run: npm run verify:hardened
      - name: Backend release regression suite
        working-directory: backend
        run: OPSC_RELEASE_TEST_CONCURRENCY=4 node scripts/release-test-runner.js
      - name: Verify recorded release evidence and provenance
        working-directory: backend
        env:
          OPSC_VERIFY_RECORDED_TEST_EVIDENCE: 'true'
        run: npm run verify
      - name: Security dependency audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Mobile dependency audit
        working-directory: mobile
        run: npm audit --omit=dev --audit-level=high
