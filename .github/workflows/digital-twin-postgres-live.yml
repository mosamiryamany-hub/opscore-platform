name: Digital Twin PostgreSQL 18 Isolated RLS and HTTP Acceptance

on:
  workflow_call:
    outputs:
      acceptance_evidence_b64:
        description: "Validated PostgreSQL HTTP acceptance evidence bound to the caller commit and run"
        value: ${{ jobs.live-rls.outputs.acceptance_evidence_b64 }}
      tenant_matrix_evidence_b64:
        description: "Validated tenant route isolation evidence, bound to the caller commit and run"
        value: ${{ jobs.live-rls.outputs.tenant_matrix_evidence_b64 }}
      restore_drill_evidence_b64:
        description: "Validated disposable PostgreSQL logical restore evidence, bound to the caller commit and run"
        value: ${{ jobs.live-rls.outputs.restore_drill_evidence_b64 }}
  pull_request:
    paths:
      - '.github/workflows/digital-twin-postgres-live.yml'
      - '.github/workflows/vercel-deploy.yml'
      - 'scripts/performance-regression-gate.js'
      - 'scripts/production-runtime-diagnostic.js'
      - 'scripts/production-runtime-diagnostic.test.js'
      - 'backend/src/config.js'
      - 'backend/src/firewall.js'
      - 'backend/src/server.js'
      - 'backend/src/db.js'
      - 'backend/scripts/test-runtime-migration-ledger-attestation.js'
      - 'backend/test/hardening_regressions_1161.test.js'
      - 'backend/test/firewall-rate-limit.test.js'
      - 'backend/test/firewall-rate-limit-postgres.test.js'
      - 'backend/src/adapters/postgres.js'
      - 'backend/src/store.js'
      - 'backend/test/postgres-auth-helper-fail-closed.test.js'
      - 'backend/src/database-security-proof.js'
      - 'backend/test/database-security-proof.test.js'
      - 'backend/test/postgres-runtime-policy-grants.test.js'
      - 'backend/scripts/postgres-live-rls-gate.js'
      - 'backend/scripts/apply-postgres-migrations.js'
      - 'backend/scripts/validate-postgres-acceptance-target.js'
      - 'backend/scripts/postgres-logical-restore-drill.js'
      - 'backend/test/postgres-logical-restore-drill.test.js'
      - 'backend/test/neon-native-pitr-evidence.test.js'
      - 'backend/scripts/postgres-tenant-composite-fk-gate.js'
      - 'backend/scripts/api-inventory.js'
      - 'backend/sql/postgres/**'
      - 'backend/test/geomap.test.js'
      - 'backend/test/postgres-commercial-acceptance-http.test.js'
      - 'backend/web/map-config.js'
      - 'backend/test/api-route-acceptance.test.js'
      - 'backend/test/release-proof.test.js'
      - 'backend/scripts/generate-production-acceptance-v1.js'
      - 'scripts/production-deployment-smoke.js'
      - 'backend/test/production-deployment-smoke.test.js'
      - 'backend/test/release-proof-ui.test.js'
      - 'backend/web/verify/release.html'
      - 'backend/web/verify/release-proof.js'
      - 'backend/test/tenant-isolation-matrix.test.js'
      - 'backend/test/postgres-tenant-composite-fk.test.js'
      - 'backend/test/postgres_rls_context_contract.test.js'
      - 'backend/test/postgres_rls_static_hardening.test.js'
      - 'backend/test/postgres-runtime-policy-grants.test.js'
      - 'backend/test/postgres-control-plane-rls.test.js'
      - 'backend/test/request-vercel-trusted-oidc.test.js'
      - 'scripts/request-vercel-trusted-oidc.js'
      - 'backend/docs/API_INVENTORY.json'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/SALES_PACKAGE_MANIFEST.json'
      - 'backend/RELEASE_FILE_SHA256SUMS.txt'
      - 'backend/RELEASE_COMPONENT_SHA256SUMS.txt'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  schedule:
    # Nightly CI-only logical restore drill on disposable PostgreSQL; not a production backup or RPO guarantee.
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  live-rls:
    name: isolated-postgres-rls-and-http-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      acceptance_evidence_b64: ${{ steps.publish_acceptance.outputs.evidence_b64 }}
      tenant_matrix_evidence_b64: ${{ steps.publish_scope_evidence.outputs.tenant_matrix_evidence_b64 }}
      restore_drill_evidence_b64: ${{ steps.publish_scope_evidence.outputs.restore_drill_evidence_b64 }}
    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opscore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opscore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    env:
      # Kept as the isolated DDL-owner endpoint for the migration/RLS gates.
      OPSC_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/opscore_test
      OPSC_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/opscore_test
      OPSC_PG_SSL_MODE: disable
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install pgvector into the PostgreSQL 18 service
        run: |
          set -euo pipefail
          cid="$(docker ps --filter 'ancestor=postgis/postgis:18-3.7' --format '{{.ID}}' | head -n1)"
          test -n "${cid}" || { echo "PostGIS PostgreSQL 18 service container not found" >&2; exit 1; }
          docker exec -u root "${cid}" sh -ec '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql-18-pgvector
            rm -rf /var/lib/apt/lists/*
          '
          # APT may upgrade the PostgreSQL server packages as a dependency of
          # pgvector. The already-running service process would otherwise keep
          # the previous 18.x executable loaded while new shared libraries are
          # on disk (observed as plpgsql.so undefined-symbol failures). Restart
          # the disposable CI service before loading any extension libraries.
          docker restart --time=60 "${cid}" >/dev/null
          ready=0
          for attempt in $(seq 1 45); do
            if docker exec "${cid}" pg_isready -U postgres -d opscore_test >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "${ready}" = "1" || { echo "PostgreSQL 18 service did not become ready after package upgrade" >&2; exit 1; }
          package_version="$(docker exec "${cid}" dpkg-query -W -f='${Version}' postgresql-18)"
          server_version_num="$(docker exec -e PGPASSWORD=postgres "${cid}" psql -U postgres -d opscore_test -AtXc 'SHOW server_version_num')"
          if [[ "${package_version}" =~ ^([0-9]+)\.([0-9]+) ]]; then
            package_major="${BASH_REMATCH[1]}"
            package_minor="${BASH_REMATCH[2]}"
          else
            echo "Unable to parse installed PostgreSQL package version" >&2
            exit 1
          fi
          expected_version_num="$((package_major * 10000 + package_minor))"
          echo "PostgreSQL package version: ${package_version}"
          echo "PostgreSQL live server_version_num: ${server_version_num}"
          test "${server_version_num}" = "${expected_version_num}" || {
            echo "PostgreSQL server/library version mismatch after restart" >&2
            exit 1
          }
          docker exec -e PGPASSWORD=postgres "${cid}"             psql -U postgres -d opscore_test -Atc             "SELECT name||'='||default_version FROM pg_available_extensions WHERE name IN ('postgis','vector','pgcrypto') ORDER BY name"
      - name: Create least-privilege runtime and migration roles plus isolated databases
        run: |
          set -euo pipefail
          cid="$(docker ps --filter 'ancestor=postgis/postgis:18-3.7' --format '{{.ID}}' | head -n1)"
          test -n "${cid}" || { echo "PostgreSQL service container not found" >&2; exit 1; }
          owner_password="$(openssl rand -hex 32)"
          runtime_password="$(openssl rand -hex 32)"
          echo "::add-mask::${owner_password}"
          echo "::add-mask::${runtime_password}"
          sql=$(cat <<'SQL'
          DROP ROLE IF EXISTS opscore_runtime;
          DROP ROLE IF EXISTS opscore_app;
          DROP ROLE IF EXISTS neondb_owner;
          CREATE ROLE neondb_owner LOGIN PASSWORD :'owner_password'
            NOSUPERUSER CREATEDB CREATEROLE INHERIT BYPASSRLS;
          CREATE ROLE opscore_app LOGIN PASSWORD 'app_test_pw'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE opscore_runtime NOLOGIN
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          ALTER ROLE opscore_runtime WITH LOGIN PASSWORD :'runtime_password' INHERIT;
          GRANT CONNECT ON DATABASE opscore_test TO opscore_app, opscore_runtime;
          GRANT USAGE ON SCHEMA public TO opscore_app, opscore_runtime;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO opscore_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO opscore_app;
          CREATE DATABASE opscore_http_acceptance OWNER neondb_owner;
          CREATE DATABASE opscore_matrix_test OWNER neondb_owner;
          CREATE DATABASE opscore_restore_target OWNER postgres;
          GRANT CONNECT ON DATABASE opscore_http_acceptance TO opscore_app, opscore_runtime;
          GRANT CONNECT ON DATABASE opscore_matrix_test TO opscore_app, opscore_runtime;
          GRANT CONNECT ON DATABASE opscore_restore_target TO opscore_app, opscore_runtime;
          SQL
          )
          echo "$sql" | docker exec -i -e PGPASSWORD=postgres "${cid}"             psql -U postgres -d opscore_test -v ON_ERROR_STOP=1             -v owner_password="${owner_password}"             -v runtime_password="${runtime_password}"
          {
            echo "OPSC_CI_MIGRATION_OWNER_PASSWORD=${owner_password}"
            echo "OPSC_PG_ACCEPTANCE_URL=postgresql://opscore_runtime:${runtime_password}@127.0.0.1:5432/opscore_http_acceptance"
            echo "OPSC_PG_ACCEPTANCE_HOST=127.0.0.1"
            echo "OPSC_TENANT_MATRIX_DATABASE_URL=postgresql://opscore_runtime:${runtime_password}@127.0.0.1:5432/opscore_matrix_test"
          } >> "$GITHUB_ENV"
          docker exec -e PGPASSWORD=postgres "${cid}"             psql -U postgres -d opscore_test -Atc             "SELECT rolname||' login='||rolcanlogin||' super='||rolsuper||' bypass='||rolbypassrls||' inherit='||rolinherit FROM pg_roles WHERE rolname IN ('neondb_owner','opscore_app','opscore_runtime') ORDER BY rolname"
      - name: Initialize extension set on both disposable acceptance databases
        run: |
          set -euo pipefail
          cid="$(docker ps --filter 'ancestor=postgis/postgis:18-3.7' --format '{{.ID}}' | head -n1)"
          test -n "${cid}"
          for db in opscore_http_acceptance opscore_matrix_test; do
            docker exec -e PGPASSWORD=postgres "${cid}"               psql -U postgres -d "${db}" -v ON_ERROR_STOP=1               -c "CREATE EXTENSION IF NOT EXISTS pgcrypto"               -c "CREATE EXTENSION IF NOT EXISTS postgis"               -c "CREATE EXTENSION IF NOT EXISTS vector"               -c "ALTER SCHEMA public OWNER TO neondb_owner"               -c "SELECT current_setting('server_version') AS postgres, (SELECT extversion FROM pg_extension WHERE extname='postgis') AS postgis, (SELECT extversion FROM pg_extension WHERE extname='vector') AS vector, (SELECT extversion FROM pg_extension WHERE extname='pgcrypto') AS pgcrypto"
          done
      - name: Install root-pinned PostgreSQL runtime dependency
        run: npm ci --ignore-scripts
      - name: Install backend package
        working-directory: backend
        run: npm ci --ignore-scripts --omit=peer
      - name: Apply full migrations to disposable acceptance databases
        working-directory: backend
        run: |
          set -euo pipefail
          for db in opscore_http_acceptance opscore_matrix_test; do
            migration_url="postgresql://neondb_owner:${OPSC_CI_MIGRATION_OWNER_PASSWORD}@127.0.0.1:5432/${db}"
            OPSC_MIGRATION_DATABASE_URL="${migration_url}"             OPSC_MIGRATION_CONFIRM_DATABASE="${db}"             OPSC_PG_SSL_MODE=disable               npm run db:migrate:postgres -- --apply
          done
      - name: Verify logical restore drill safety contracts
        working-directory: backend
        run: node --test test/postgres-logical-restore-drill.test.js

      - name: Run real PostgreSQL logical dump and restore drill
        working-directory: backend
        env:
          OPSC_RESTORE_DRILL_REPORT_PATH: ${{ runner.temp }}/POSTGRES_LOGICAL_RESTORE_DRILL_RESULT.json
        run: |
          set -euo pipefail
          cid="$(docker ps --filter 'ancestor=postgis/postgis:18-3.7' --format '{{.ID}}' | head -n1)"
          test -n "$cid"
          export OPSC_RESTORE_DRILL_SOURCE_URL="postgresql://neondb_owner:${OPSC_CI_MIGRATION_OWNER_PASSWORD}@127.0.0.1:5432/opscore_http_acceptance"
          export OPSC_RESTORE_DRILL_TARGET_URL="postgresql://postgres:postgres@127.0.0.1:5432/opscore_restore_target"
          export OPSC_RESTORE_DRILL_DOCKER_CONTAINER="$cid"
          node scripts/postgres-logical-restore-drill.js
      - name: Verify runtime-only migration ledger attestation
        working-directory: backend
        run: node scripts/test-runtime-migration-ledger-attestation.js
      - name: Check live gate syntax
        run: |
          node --check backend/scripts/postgres-live-rls-gate.js
          node --check backend/scripts/apply-postgres-migrations.js
          node --check backend/scripts/postgres-tenant-composite-fk-gate.js
          node --check backend/scripts/postgres-logical-restore-drill.js
          node --check backend/src/adapters/postgres.js
      - name: Run isolated PostgreSQL 18 tenant-isolation gate
        working-directory: backend
        run: |
          set -euo pipefail
          # Exercise the same fully migrated, disposable acceptance database as
          # the runtime migration-attestation check. The gate still uses an
          # owner connection for transactional DDL and SET ROLE for runtime tests.
          OPSC_PG_TEST_URL="${OPSC_PG_ACCEPTANCE_URL}" \
          OPSC_MIGRATION_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/opscore_http_acceptance" \
          OPSC_MIGRATION_CONFIRM_DATABASE="opscore_http_acceptance" \
          OPSC_PG_SSL_MODE=disable \
            npm run db:postgres-live-rls
      - name: Run tenant composite foreign-key integrity gate
        working-directory: backend
        run: node scripts/postgres-tenant-composite-fk-gate.js
      - name: Run real PostgreSQL HTTP commercial acceptance as opscore_runtime
        working-directory: backend
        env:
          OPSC_PG_ACCEPTANCE_STRICT: 'true'
          OPSC_WRITE_EVIDENCE: '1'
          OPSC_PG_ACCEPTANCE_RESULT_FILE: ${{ github.workspace }}/POSTGRES_HTTP_ACCEPTANCE_RESULT.json
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_PIPELINE_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node --test test/postgres-commercial-acceptance-http.test.js
          cat "${OPSC_PG_ACCEPTANCE_RESULT_FILE}"
      - name: Verify atomic shared login throttling across PostgreSQL runtime processes
        working-directory: backend
        env:
          OPSC_EXPECTED_INSTANCES: '1'
          OPSC_SHARED_STATE_CONFIRMED: 'true'
          OPSC_PG_SSL_MODE: disable
        run: |
          set -euo pipefail
          test -n "${OPSC_PG_ACCEPTANCE_URL:-}" || { echo "OPSC_PG_ACCEPTANCE_URL is required" >&2; exit 1; }
          node --test test/firewall-rate-limit-postgres.test.js

      - name: Validate and export caller-bound PostgreSQL acceptance evidence
        id: publish_acceptance
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          EXPECTED_PIPELINE_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'POSTGRES_HTTP_ACCEPTANCE_RESULT.json');
          const stat = fs.statSync(reportPath);
          if (stat.size < 1 || stat.size > 100_000) {
            throw new Error('POSTGRES_ACCEPTANCE_EVIDENCE_SIZE_INVALID');
          }
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const requiredCheckIds = [
            'member-role-privilege-boundary',
            'safe-mode-tenant-scoped',
            'recovery-bundle-verify-is-dry-run',
            'recovery-bundle-tamper-detected',
            'operational-autopilot-postgres-parity-and-tenant-boundary'
          ];
          if (report.schemaVersion !== 'opscore.postgres-http-acceptance.v1') {
            throw new Error('POSTGRES_ACCEPTANCE_SCHEMA_INVALID');
          }
          if (report.status !== 'PASS' || report.productionCertification !== false) {
            throw new Error('POSTGRES_ACCEPTANCE_NOT_PASS_OR_FALSE_CERTIFICATION');
          }
          if (String(report.commit || '').toLowerCase() !== process.env.EXPECTED_COMMIT_SHA.toLowerCase()) {
            throw new Error('POSTGRES_ACCEPTANCE_COMMIT_MISMATCH');
          }
          if (Number(report.pipelineId) !== Number(process.env.EXPECTED_PIPELINE_ID)) {
            throw new Error('POSTGRES_ACCEPTANCE_PIPELINE_MISMATCH');
          }
          if (report.environment?.database !== 'opscore_http_acceptance'
              || report.environment?.connectedRole !== 'opscore_runtime'
              || report.environment?.roleIsSuperuser !== false
              || report.environment?.roleBypassesRls !== false) {
            throw new Error('POSTGRES_ACCEPTANCE_RUNTIME_IDENTITY_INVALID');
          }
          if (report.cleanup?.status !== 'PASS') {
            throw new Error('POSTGRES_ACCEPTANCE_CLEANUP_NOT_PASS');
          }
          if (!Array.isArray(report.checks) || report.checks.length === 0
              || report.checks.some(check => check.status !== 'PASS')) {
            throw new Error('POSTGRES_ACCEPTANCE_CHECKS_INVALID');
          }
          const completedIds = new Set(report.checks.map(check => check.id));
          for (const requiredId of requiredCheckIds) {
            if (!completedIds.has(requiredId)) {
              throw new Error('POSTGRES_ACCEPTANCE_REQUIRED_CHECK_MISSING:' + requiredId);
            }
          }
          const encoded = fs.readFileSync(reportPath).toString('base64');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'evidence_b64=' + encoded + String.fromCharCode(10));
          console.log('POSTGRES_ACCEPTANCE_EVIDENCE_VALIDATED');
          console.log('POSTGRES_ACCEPTANCE_COMMIT=' + report.commit);
          console.log('POSTGRES_ACCEPTANCE_PIPELINE=' + report.pipelineId);
          console.log('POSTGRES_ACCEPTANCE_CHECKS=' + report.checks.length);
          NODE

      - name: Run source-derived tenant route isolation matrix as opscore_runtime
        working-directory: backend
        env:
          OPSC_WRITE_EVIDENCE: '1'
        run: |
          set -euo pipefail
          OPSC_PG_ACCEPTANCE_URL=           OPSC_PG_TEST_URL="${OPSC_TENANT_MATRIX_DATABASE_URL}"             node --test test/tenant-isolation-matrix.test.js
          cat docs/verification/TENANT_ISOLATION_MATRIX.json

      - name: Validate and publish caller-bound tenant and logical restore evidence
        id: publish_scope_evidence
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          EXPECTED_PIPELINE_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const root = process.env.GITHUB_WORKSPACE;
          const commit = String(process.env.EXPECTED_COMMIT_SHA || '').toLowerCase();
          const pipelineId = String(process.env.EXPECTED_PIPELINE_ID || '');
          const matrixPath = path.join(root, 'backend/docs/verification/TENANT_ISOLATION_MATRIX.json');
          const restorePath = path.join(process.env.RUNNER_TEMP, 'POSTGRES_LOGICAL_RESTORE_DRILL_RESULT.json');
          const matrixRaw = fs.readFileSync(matrixPath, 'utf8');
          const restoreRaw = fs.readFileSync(restorePath, 'utf8');
          const matrix = JSON.parse(matrixRaw);
          const restore = JSON.parse(restoreRaw);
          const digest = raw => crypto.createHash('sha256').update(raw, 'utf8').digest('hex');
          const m = matrix.tested || {};
          const ua = m.unauthenticated || {};
          const foreign = m.foreignIdProbe || {};
          const cross = m.crossTenantFixture || {};
          const tenantRouteCount = Number(matrix.discovered && matrix.discovered.tenantDataRoutes);
          const foreignIdRouteCount = Number(matrix.discovered && matrix.discovered.foreignIdRoutes);
          if (matrix.schemaVersion !== 'opscore.tenant-isolation-matrix.v1' ||
              matrix.status !== 'PASS' ||
              String(matrix.sourceCommit || '').toLowerCase() !== commit ||
              matrix.productionCertification !== false ||
              matrix.isolationCertification !== 'NOT_CERTIFIED' ||
              !Number.isSafeInteger(tenantRouteCount) || tenantRouteCount < 1 ||
              Number(ua.checks) !== tenantRouteCount || Number(ua.pass) !== tenantRouteCount || Number(ua.fail) !== 0 ||
              (!Number.isSafeInteger(foreignIdRouteCount) || foreignIdRouteCount < 0) || Number(foreign.checks) !== foreignIdRouteCount || Number(foreign.pass) !== foreignIdRouteCount || Number(foreign.fail) !== 0 ||
              Number(cross.checks) < 1 || Number(cross.pass) !== Number(cross.checks) || Number(cross.fail) !== 0 ||
              (matrix.skipped || []).length !== 0 || (matrix.cleanupErrors || []).length !== 0) {
            throw new Error('TENANT_MATRIX_EVIDENCE_INCOMPLETE_OR_NOT_CLEAN');
          }
          if (restore.schemaVersion !== 'opscore.postgres-logical-restore-drill.v1' ||
              restore.status !== 'PASS' ||
              restore.evidenceClass !== 'CI_DISPOSABLE_DATABASE_LOGICAL_RESTORE' ||
              restore.productionCertification !== false ||
              restore.ownershipAndAclRestored !== false ||
              restore.verificationScope !== 'DATA_SCHEMA_CATALOG_RLS_AND_TABLE_CONTENT' ||
              restore.cleanup?.status !== 'PASS' ||
              !Array.isArray(restore.checks) || restore.checks.length < 1 ||
              restore.checks.some(check => check.status !== 'PASS') ||
              !Number.isSafeInteger(Number(restore.archive?.bytes)) || Number(restore.archive.bytes) < 1024 ||
              !/^[a-f0-9]{64}$/i.test(String(restore.archive?.sha256 || '')) ||
              !Number.isSafeInteger(Number(restore.tableCount)) || Number(restore.tableCount) < 1 ||
              !(restore.limitations || []).some(item => /Neon point-in-time restore/i.test(String(item)))) {
            throw new Error('LOGICAL_RESTORE_EVIDENCE_INCOMPLETE_OR_SCOPE_MISMATCH');
          }
          const wrap = (evidenceType, scope, evidence) => ({
            schemaVersion: 'opscore.caller-bound-ci-evidence.v1',
            evidenceType,
            binding: { commit, pipelineId, scope },
            evidence
          });
          const matrixEnvelope = wrap('tenant-matrix', 'DISPOSABLE_POSTGRESQL_18_CI', {
            schemaVersion: matrix.schemaVersion,
            sourceCommit: matrix.sourceCommit,
            status: matrix.status,
            productionCertification: matrix.productionCertification,
            isolationCertification: matrix.isolationCertification,
            fullEvidenceSha256: digest(matrixRaw),
            discovered: matrix.discovered,
            tested: matrix.tested,
            skippedCount: (matrix.skipped || []).length,
            cleanupErrorsCount: (matrix.cleanupErrors || []).length
          });
          const restoreEnvelope = wrap('postgres-logical-restore', 'DISPOSABLE_POSTGRESQL_18_LOGICAL_RESTORE_CI', {
            schemaVersion: restore.schemaVersion,
            status: restore.status,
            evidenceClass: restore.evidenceClass,
            productionCertification: restore.productionCertification,
            ownershipAndAclRestored: restore.ownershipAndAclRestored,
            verificationScope: restore.verificationScope,
            fullEvidenceSha256: digest(restoreRaw),
            checks: restore.checks.map(check => ({ name: check.name, status: check.status })),
            cleanup: restore.cleanup,
            archive: restore.archive,
            tableCount: restore.tableCount,
            limitations: restore.limitations
          });
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'tenant_matrix_evidence_b64=' + Buffer.from(JSON.stringify(matrixEnvelope)).toString('base64') + '\n' +
            'restore_drill_evidence_b64=' + Buffer.from(JSON.stringify(restoreEnvelope)).toString('base64') + '\n');
          console.log('CALLER_BOUND_TENANT_MATRIX=PASS routes=' + tenantRouteCount);
          console.log('CALLER_BOUND_LOGICAL_RESTORE=PASS tables=' + restore.tableCount);
          console.log('PRODUCTION_TENANT_AND_NEON_PITR_CERTIFICATION=false');
          NODE
