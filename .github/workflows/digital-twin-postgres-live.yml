name: Digital Twin PostgreSQL Live RLS

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - '.github/workflows/digital-twin-postgres-live.yml'
      - 'backend/src/adapters/postgres.js'
      - 'backend/scripts/postgres-live-rls-gate.js'
      - 'backend/sql/postgres/031_digital_twin_chain_hardening.sql'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/test/postgres_rls_context_contract.test.js'
      - 'backend/test/postgres_rls_static_hardening.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opscore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opscore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      OPSC_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/opscore_test
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install root-pinned PostgreSQL runtime dependency
        run: npm ci --ignore-scripts
      - name: Install backend package
        working-directory: backend
        run: npm ci --ignore-scripts --omit=peer
      - name: Check live gate syntax
        run: |
          node --check backend/scripts/postgres-live-rls-gate.js
          node --check backend/src/adapters/postgres.js
      - name: Run real PostgreSQL 18 tenant-isolation gate
        working-directory: backend
        run: npm run db:postgres-live-rls
