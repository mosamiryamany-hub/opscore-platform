name: Digital Twin PostgreSQL 18 Isolated RLS and HTTP Acceptance

on:
  # PRs are invoked by vercel-deploy.yml so the existing protected contract
  # check is gated by this reusable PostgreSQL 18 acceptance workflow once.
  workflow_call:
    outputs:
      acceptance_evidence_b64:
        description: "Validated PostgreSQL HTTP acceptance evidence bound to the caller commit and run"
        value: ${{ jobs.live-rls.outputs.acceptance_evidence_b64 }}
      tenant_matrix_evidence_b64:
        description: "Validated tenant route isolation evidence, bound to the caller commit and run"
        value: ${{ jobs.live-rls.outputs.tenant_matrix_evidence_b64 }}
      restore_drill_evidence_b64:
        description: "Validated disposable PostgreSQL logical restore evidence, bound to the caller commit and run"
        value: ${{ jobs.live-rls.outputs.restore_drill_evidence_b64 }}
  workflow_dispatch:
  schedule:
    # Nightly CI-only logical restore drill on disposable PostgreSQL; not a production backup or RPO guarantee.
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  neon-preview-acceptance:
    name: Isolated Neon Preview migration and HTTP acceptance
    if: (github.event_name == 'pull_request' && github.head_ref == 'ops/acceptance-neon-target-2026-11-19' || github.head_ref == 'test/dispatcher-map-postgres-browser-e2e-20261127') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: live-rls
    uses: ./.github/workflows/apply-preview-migrations.yml
    # Omit branch intentionally: the reusable workflow's workflow_call input
    # owns the single default; its runtime Neon API guard validates project,
    # parent, primary/default flags, and readiness before any DB work.
    with:
      database: "opscore_acceptance"
    secrets: inherit

  live-rls:
    name: isolated-postgres-rls-and-http-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      acceptance_evidence_b64: ${{ steps.publish_acceptance.outputs.evidence_b64 }}
      tenant_matrix_evidence_b64: ${{ steps.publish_scope_evidence.outputs.tenant_matrix_evidence_b64 }}
      restore_drill_evidence_b64: ${{ steps.publish_scope_evidence.outputs.restore_drill_evidence_b64 }}
    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opscore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opscore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    env:
      # Kept as the isolated DDL-owner endpoint for the migration/RLS gates.
      OPSC_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/opscore_test
      OPSC_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/opscore_test
      OPSC_PG_SSL_MODE: disable
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install pgvector into the PostgreSQL 18 service
        run: |
          set -euo pipefail
          cid="$(docker ps --filter 'ancestor=postgis/postgis:18-3.7' --format '{{.ID}}' | head -n1)"
          test -n "${cid}" || { echo "PostGIS PostgreSQL 18 service container not found" >&2; exit 1; }
          docker exec -u root "${cid}" sh -ec '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql-18-pgvector
            rm -rf /var/lib/apt/lists/*
          '
          # APT may upgrade the PostgreSQL server packages as a dependency of
          # pgvector. The already-running service process would otherwise keep
          # the previous 18.x executable loaded while new shared libraries are
          # on disk (observed as plpgsql.so undefined-symbol failures). Restart
          # the disposable CI service before loading any extension libraries.
          docker restart --time=60 "${cid}" >/dev/null
          ready=0
          for attempt in $(seq 1 45); do
            if docker exec "${cid}" pg_isready -U postgres -d opscore_test >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "${ready}" = "1" || { echo "PostgreSQL 18 service did not become ready after package upgrade" >&2; exit 1; }
          package_version="$(docker exec "${cid}" dpkg-query -W -f='${Version}' postgresql-18)"
          server_version_num="$(docker exec -e PGPASSWORD=postgres "${cid}" psql -U postgres -d opscore_test -AtXc 'SHOW server_version_num')"
          if [[ "${package_version}" =~ ^([0-9]+)\.([0-9]+) ]]; then
            package_major="${BASH_REMATCH[1]}"
            package_minor="${BASH_REMATCH[2]}"
          else
            echo "Unable to parse installed PostgreSQL package version" >&2
            exit 1
          fi
          expected_version_num="$((package_major * 10000 + package_minor))"
          echo "PostgreSQL package version: ${package_version}"
          echo "PostgreSQL live server_version_num: ${server_version_num}"
          test "${server_version_num}" = "${expected_version_num}" || {
            echo "PostgreSQL server/library version mismatch after restart" >&2
            exit 1
          }
          docker exec -e PGPASSWORD=postgres "${cid}"             psql -U postgres -d opscore_test -Atc             "SELECT name||'='||default_version FROM pg_available_extensions WHERE name IN ('postgis','vector','pgcrypto') ORDER BY name"
      - name: Create least-privilege runtime and migration roles plus isolated databases
        run: |
          set -euo pipefail
          cid="$(docker ps --filter 'ancestor=postgis/postgis:18-3.7' --format '{{.ID}}' | head -n1)"
          test -n "${cid}" || { echo "PostgreSQL service container not found" >&2; exit 1; }
          owner_password="$(openssl rand -hex 32)"
          runtime_password="$(openssl rand -hex 32)"
          echo "::add-mask::${owner_password}"
          echo "::add-mask::${runtime_password}"
          sql=$(cat <<'SQL'
          DROP ROLE IF EXISTS opscore_runtime;
          DROP ROLE IF EXISTS opscore_app;
          DROP ROLE IF EXISTS neon_superuser;
          DROP ROLE IF EXISTS neondb_owner;
          CREATE ROLE neondb_owner LOGIN PASSWORD :'owner_password'
            NOSUPERUSER CREATEDB CREATEROLE INHERIT BYPASSRLS;
          -- This disposable acceptance cluster uses a clean, non-login RLS probe.
          -- The real Neon Preview legacy role is separately fail-closed by the
          -- migration runner unless the current role has ADMIN OPTION on it.
          CREATE ROLE opscore_app NOLOGIN
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE opscore_runtime NOLOGIN
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          ALTER ROLE opscore_runtime WITH LOGIN PASSWORD :'runtime_password' INHERIT;
          GRANT CONNECT ON DATABASE opscore_test TO opscore_app, opscore_runtime;
          GRANT USAGE ON SCHEMA public TO opscore_app, opscore_runtime;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO opscore_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO opscore_app;
          CREATE DATABASE opscore_http_acceptance OWNER neondb_owner;
          CREATE DATABASE opscore_matrix_test OWNER neondb_owner;
          CREATE DATABASE opscore_restore_target OWNER postgres;
          GRANT CONNECT ON DATABASE opscore_http_acceptance TO opscore_app, opscore_runtime;
          GRANT CONNECT ON DATABASE opscore_matrix_test TO opscore_app, opscore_runtime;
          GRANT CONNECT ON DATABASE opscore_restore_target TO opscore_app, opscore_runtime;
          SQL
          )
          echo "$sql" | docker exec -i -e PGPASSWORD=postgres "${cid}"             psql -U postgres -d opscore_test -v ON_ERROR_STOP=1             -v owner_password="${owner_password}"             -v runtime_password="${runtime_password}"
          {
            echo "OPSC_CI_MIGRATION_OWNER_PASSWORD=${owner_password}"
            echo "OPSC_PG_ACCEPTANCE_URL=postgresql://opscore_runtime:${runtime_password}@127.0.0.1:5432/opscore_http_acceptance"
            echo "OPSC_PG_ACCEPTANCE_CLEANUP_URL=postgresql://neondb_owner:${owner_password}@127.0.0.1:5432/opscore_http_acceptance"
            echo "OPSC_PG_ACCEPTANCE_CLEANUP_HOST=127.0.0.1"
            echo "OPSC_PG_ACCEPTANCE_CLEANUP_ROLE=neondb_owner"
            echo "OPSC_PG_ACCEPTANCE_HOST=127.0.0.1"
            echo "OPSC_TENANT_MATRIX_DATABASE_URL=postgresql://opscore_runtime:${runtime_password}@127.0.0.1:5432/opscore_matrix_test"
          } >> "$GITHUB_ENV"
          docker exec -e PGPASSWORD=postgres "${cid}"             psql -U postgres -d opscore_test -Atc             "SELECT rolname||' login='||rolcanlogin||' super='||rolsuper||' bypass='||rolbypassrls||' inherit='||rolinherit FROM pg_roles WHERE rolname IN ('neondb_owner','opscore_app','opscore_runtime') ORDER BY rolname"
      - name: Initialize extension set on both disposable acceptance databases
        run: |
          set -euo pipefail
          cid="$(docker ps --filter 'ancestor=postgis/postgis:18-3.7' --format '{{.ID}}' | head -n1)"
          test -n "${cid}"
          for db in opscore_http_acceptance opscore_matrix_test; do
            docker exec -e PGPASSWORD=postgres "${cid}"               psql -U postgres -d "${db}" -v ON_ERROR_STOP=1               -c "CREATE EXTENSION IF NOT EXISTS pgcrypto"               -c "CREATE EXTENSION IF NOT EXISTS postgis"               -c "CREATE EXTENSION IF NOT EXISTS vector"               -c "ALTER SCHEMA public OWNER TO neondb_owner"               -c "SELECT current_setting('server_version') AS postgres, (SELECT extversion FROM pg_extension WHERE extname='postgis') AS postgis, (SELECT extversion FROM pg_extension WHERE extname='vector') AS vector, (SELECT extversion FROM pg_extension WHERE extname='pgcrypto') AS pgcrypto"
          done
      - name: Install root-pinned PostgreSQL runtime dependency
        run: npm ci --ignore-scripts
      - name: Install backend package
        working-directory: backend
        run: npm ci --ignore-scripts --omit=peer
      - name: Install Chromium for authenticated Dispatcher Map acceptance
        working-directory: backend
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install chromium
      - name: Apply full migrations to disposable acceptance databases
        working-directory: backend
        run: |
          set -euo pipefail
          for db in opscore_http_acceptance opscore_matrix_test; do
            migration_url="postgresql://neondb_owner:${OPSC_CI_MIGRATION_OWNER_PASSWORD}@127.0.0.1:5432/${db}"
            OPSC_MIGRATION_DATABASE_URL="${migration_url}" OPSC_MIGRATION_TARGET_CLASS=test OPSC_MIGRATION_EXPECTED_DATABASE="${db}" OPSC_MIGRATION_CONFIRM_DATABASE="${db}" OPSC_PG_SSL_MODE=disable npm run db:migrate:postgres -- --apply
          done
      - name: Provision disposable HMAC signing key for signed RLS session purposes
        working-directory: backend
        run: |
          set -euo pipefail
          cid="$(docker ps --filter 'ancestor=postgis/postgis:18-3.7' --format '{{.ID}}' | head -n1)"
          test -n "${cid}" || { echo "PostgreSQL service container not found" >&2; exit 1; }
          key_hex="$(openssl rand -hex 32)"
          key_id="ci-rls-${GITHUB_RUN_ID}"
          [[ "${key_hex}" =~ ^[a-f0-9]{64}$ ]]
          [[ "${key_id}" =~ ^ci-rls-[0-9]+$ ]]
          echo "::add-mask::${key_hex}"
          for db in opscore_http_acceptance opscore_matrix_test; do
            sql="INSERT INTO opscore_security.context_hmac_keys(key_id,secret,enabled,not_before,not_after) VALUES ('${key_id}',decode('${key_hex}','hex'),true,now()-interval '1 minute',now()+interval '1 hour') ON CONFLICT(key_id) DO UPDATE SET secret=excluded.secret,enabled=true,not_before=excluded.not_before,not_after=excluded.not_after"
            docker exec -e PGPASSWORD="${OPSC_CI_MIGRATION_OWNER_PASSWORD}" "${cid}" \
              psql -h 127.0.0.1 -U neondb_owner -d "${db}" -v ON_ERROR_STOP=1 \
                -c "SET ROLE opscore_auth_definer" \
                -c "${sql}" \
                -c "RESET ROLE"
          done
          {
            echo "OPSC_TENANT_CONTEXT_HMAC_KEY=${key_hex}"
            echo "OPSC_TENANT_CONTEXT_KEY_ID=${key_id}"
          } >> "${GITHUB_ENV}"

      - name: Verify signed tenant context through the real Node PostgreSQL worker
        working-directory: backend
        env:
          OPSC_PG_SSL_MODE: disable
          OPSC_SIGNED_TENANT_CONTEXT_CI_ROUTE_COVERAGE: 'true'
          OPSC_CI_SIGNED_TENANT_ROUTE_COVERAGE_PATH: ${{ runner.temp }}/SIGNED_TENANT_CONTEXT_CI_ROUTE_COVERAGE.json
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          export OPSC_TENANT_CONTEXT_OWNER_URL="postgresql://neondb_owner:${OPSC_CI_MIGRATION_OWNER_PASSWORD}@127.0.0.1:5432/opscore_http_acceptance"
          node scripts/signed-tenant-context-postgres-gate.js

      - name: Prove signed RLS purposes and reject raw-GUC forgery as opscore_runtime
        working-directory: backend
        env:
          OPSC_PG_SSL_MODE: disable
        run: |
          set -euo pipefail
          export OPSC_TENANT_CONTEXT_OWNER_URL="postgresql://neondb_owner:${OPSC_CI_MIGRATION_OWNER_PASSWORD}@127.0.0.1:5432/opscore_http_acceptance"
          node scripts/postgres-signed-rls-purpose-acceptance.js

      - name: Validate exact disposable PostgreSQL 18 signed-tenant 67-route evidence
        env:
          COVERAGE_PATH: ${{ runner.temp }}/SIGNED_TENANT_CONTEXT_CI_ROUTE_COVERAGE.json
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_PIPELINE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const file = process.env.COVERAGE_PATH;
          const raw = fs.readFileSync(file);
          const evidence = JSON.parse(raw.toString('utf8'));
          const manifestPath = path.join(process.env.GITHUB_WORKSPACE,
            'backend/docs/verification/SIGNED_TENANT_CONTEXT_ROUTE_MANIFEST.json');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const key = row => String(row.method || '').toUpperCase() + ' ' + String(row.path || '');
          const actual = Array.isArray(evidence.routes) ? evidence.routes : [];
          const expectedKeys = manifest.routes.map(key).sort();
          const actualKeys = actual.map(key).sort();
          const digest = crypto.createHash('sha256').update(raw).digest('hex');
          const sidecar = fs.readFileSync(file + '.sha256', 'utf8');
          if (evidence.schemaVersion !== 'opscore.signed-tenant-context-ci-route-coverage.v1' ||
              evidence.evidenceClass !== 'DISPOSABLE_POSTGRESQL_18_CI_ROUTE_PROBES' ||
              evidence.environment !== 'ci' ||
              evidence.status !== 'PASS' ||
              evidence.databaseName !== 'opscore_http_acceptance' ||
              evidence.runtimeRole !== 'opscore_runtime' ||
              evidence.expectedRouteCount !== 67 ||
              evidence.coveredRouteCount !== 67 ||
              evidence.failedRouteCount !== 0 ||
              evidence.manifestComplete !== true ||
              evidence.productionCertification !== false ||
              evidence.productionPromotionPerformed !== false ||
              evidence.parentBranchId !== null ||
              evidence.deploymentId !== null ||
              String(evidence.sourceCommitHint || '').toLowerCase() !== String(process.env.EXPECTED_COMMIT || '').toLowerCase() ||
              String(evidence.pipelineId || '') !== String(process.env.EXPECTED_PIPELINE || '') ||
              expectedKeys.length !== 67 || actual.length !== 67 ||
              new Set(actualKeys).size !== 67 ||
              JSON.stringify(actualKeys) !== JSON.stringify(expectedKeys) ||
              actual.some(route => route.status !== 'PASS' ||
                route.signedContextBound !== true || route.sessionBound !== true ||
                route.transactionBound !== true || route.rawGucTamperDenied !== true) ||
              sidecar !== digest + '  ' + path.basename(file) + '\n') {
            throw new Error('DISPOSABLE_PG18_SIGNED_TENANT_67_ROUTE_EVIDENCE_INVALID');
          }
          console.log('DISPOSABLE_POSTGRESQL_18_SIGNED_TENANT_ROUTE_COVERAGE=PASS 67/67');
          console.log('PRODUCTION_CERTIFICATION=false');
          console.log('SIGNED_TENANT_CI_ROUTE_COVERAGE_SHA256=' + digest);
          NODE

      - name: Upload disposable PostgreSQL 18 signed-tenant route evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-tenant-postgres-18-ci-coverage-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/SIGNED_TENANT_CONTEXT_CI_ROUTE_COVERAGE.json
            ${{ runner.temp }}/SIGNED_TENANT_CONTEXT_CI_ROUTE_COVERAGE.json.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Verify logical restore drill safety contracts
        working-directory: backend
        run: node --test test/postgres-logical-restore-drill.test.js

      - name: Run real PostgreSQL logical dump and restore drill
        working-directory: backend
        env:
          OPSC_RESTORE_DRILL_REPORT_PATH: ${{ runner.temp }}/POSTGRES_LOGICAL_RESTORE_DRILL_RESULT.json
        run: |
          set -euo pipefail
          cid="$(docker ps --filter 'ancestor=postgis/postgis:18-3.7' --format '{{.ID}}' | head -n1)"
          test -n "$cid"
          export OPSC_RESTORE_DRILL_SOURCE_URL="postgresql://neondb_owner:${OPSC_CI_MIGRATION_OWNER_PASSWORD}@127.0.0.1:5432/opscore_http_acceptance"
          export OPSC_RESTORE_DRILL_TARGET_URL="postgresql://postgres:postgres@127.0.0.1:5432/opscore_restore_target"
          export OPSC_RESTORE_DRILL_DOCKER_CONTAINER="$cid"
          node scripts/postgres-logical-restore-drill.js
      - name: Verify runtime-only migration ledger attestation
        working-directory: backend
        run: node scripts/test-runtime-migration-ledger-attestation.js
      - name: Check live gate syntax
        run: |
          node --check backend/scripts/postgres-live-rls-gate.js
          node --check backend/scripts/signed-tenant-context-postgres-gate.js
          node --check backend/scripts/apply-postgres-migrations.js
          node --check backend/scripts/postgres-tenant-composite-fk-gate.js
          node --check backend/scripts/postgres-logical-restore-drill.js
          node --check backend/src/adapters/postgres.js
          node --check backend/src/geofencing.js
      - name: Run isolated PostgreSQL 18 tenant-isolation gate
        working-directory: backend
        run: |
          set -euo pipefail
          # Exercise the same fully migrated, disposable acceptance database as
          # the runtime migration-attestation check. The gate still uses an
          # owner connection for transactional DDL and SET ROLE for runtime tests.
          OPSC_PG_TEST_URL="${OPSC_PG_ACCEPTANCE_URL}" \
          OPSC_MIGRATION_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/opscore_http_acceptance" \
          OPSC_MIGRATION_CONFIRM_DATABASE="opscore_http_acceptance" \
          OPSC_PG_SSL_MODE=disable \
            npm run db:postgres-live-rls
      - name: Run tenant composite foreign-key integrity gate
        working-directory: backend
        run: node scripts/postgres-tenant-composite-fk-gate.js
      - name: Run Digital Twin concurrency, RLS, application adapter and PostGIS gates
        working-directory: backend
        env:
          OPSC_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/opscore_test
          OPSC_PG_TWIN_RLS_URL: ${{ env.OPSC_PG_ACCEPTANCE_URL }}
        run: |
          set -euo pipefail
          node --check scripts/twin-concurrency-postgis-gate.js
          node scripts/twin-concurrency-postgis-gate.js
      - name: Run real PostgreSQL HTTP and authenticated Dispatcher Map browser acceptance as opscore_runtime
        working-directory: backend
        env:
          OPSC_PG_ACCEPTANCE_STRICT: 'true'
          OPSC_WRITE_EVIDENCE: '1'
          OPSC_MAP_BROWSER_E2E: 'true'
          OPSC_MAP_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/dispatcher-map-postgres-browser-e2e
          OPSC_PG_ACCEPTANCE_RESULT_FILE: ${{ github.workspace }}/POSTGRES_HTTP_ACCEPTANCE_RESULT.json
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_PIPELINE_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node --test test/postgres-commercial-acceptance-http.test.js
          cat "${OPSC_PG_ACCEPTANCE_RESULT_FILE}"
      - name: Verify atomic shared login throttling across PostgreSQL runtime processes
        working-directory: backend
        env:
          OPSC_EXPECTED_INSTANCES: '1'
          OPSC_SHARED_STATE_CONFIRMED: 'true'
          OPSC_PG_SSL_MODE: disable
        run: |
          set -euo pipefail
          test -n "${OPSC_PG_ACCEPTANCE_URL:-}" || { echo "OPSC_PG_ACCEPTANCE_URL is required" >&2; exit 1; }
          node --test test/firewall-rate-limit-postgres.test.js

      - name: Upload authenticated Dispatcher Map and PostGIS browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opscore-dispatcher-map-authenticated-postgis-e2e
          path: ${{ runner.temp }}/dispatcher-map-postgres-browser-e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Validate and export caller-bound PostgreSQL acceptance evidence
        id: publish_acceptance
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          EXPECTED_PIPELINE_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'POSTGRES_HTTP_ACCEPTANCE_RESULT.json');
          const stat = fs.statSync(reportPath);
          if (stat.size < 1 || stat.size > 100_000) {
            throw new Error('POSTGRES_ACCEPTANCE_EVIDENCE_SIZE_INVALID');
          }
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const requiredCheckIds = [
            'member-role-privilege-boundary',
            'safe-mode-tenant-scoped',
            'recovery-bundle-verify-is-dry-run',
            'recovery-bundle-tamper-detected',
            'operational-autopilot-postgres-parity-and-tenant-boundary'
          ];
          if (report.schemaVersion !== 'opscore.postgres-http-acceptance.v1') {
            throw new Error('POSTGRES_ACCEPTANCE_SCHEMA_INVALID');
          }
          if (report.status !== 'PASS' || report.productionCertification !== false) {
            throw new Error('POSTGRES_ACCEPTANCE_NOT_PASS_OR_FALSE_CERTIFICATION');
          }
          if (String(report.commit || '').toLowerCase() !== process.env.EXPECTED_COMMIT_SHA.toLowerCase()) {
            throw new Error('POSTGRES_ACCEPTANCE_COMMIT_MISMATCH');
          }
          if (Number(report.pipelineId) !== Number(process.env.EXPECTED_PIPELINE_ID)) {
            throw new Error('POSTGRES_ACCEPTANCE_PIPELINE_MISMATCH');
          }
          if (report.environment?.database !== 'opscore_http_acceptance'
              || report.environment?.connectedRole !== 'opscore_runtime'
              || report.environment?.roleIsSuperuser !== false
              || report.environment?.roleBypassesRls !== false) {
            throw new Error('POSTGRES_ACCEPTANCE_RUNTIME_IDENTITY_INVALID');
          }
          if (report.cleanup?.status !== 'PASS') {
            throw new Error('POSTGRES_ACCEPTANCE_CLEANUP_NOT_PASS');
          }
          if (!Array.isArray(report.checks) || report.checks.length === 0
              || report.checks.some(check => check.status !== 'PASS')) {
            throw new Error('POSTGRES_ACCEPTANCE_CHECKS_INVALID');
          }
          const completedIds = new Set(report.checks.map(check => check.id));
          for (const requiredId of requiredCheckIds) {
            if (!completedIds.has(requiredId)) {
              throw new Error('POSTGRES_ACCEPTANCE_REQUIRED_CHECK_MISSING:' + requiredId);
            }
          }
          const encoded = fs.readFileSync(reportPath).toString('base64');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'evidence_b64=' + encoded + String.fromCharCode(10));
          console.log('POSTGRES_ACCEPTANCE_EVIDENCE_VALIDATED');
          console.log('POSTGRES_ACCEPTANCE_COMMIT=' + report.commit);
          console.log('POSTGRES_ACCEPTANCE_PIPELINE=' + report.pipelineId);
          console.log('POSTGRES_ACCEPTANCE_CHECKS=' + report.checks.length);
          NODE

      - name: Run source-derived tenant route isolation matrix as opscore_runtime
        working-directory: backend
        env:
          OPSC_WRITE_EVIDENCE: '1'
        run: |
          set -euo pipefail
          OPSC_PG_ACCEPTANCE_URL=           OPSC_PG_TEST_URL="${OPSC_TENANT_MATRIX_DATABASE_URL}"             node --test test/tenant-isolation-matrix.test.js
          cat docs/verification/TENANT_ISOLATION_MATRIX.json

      - name: Validate and publish caller-bound tenant and logical restore evidence
        id: publish_scope_evidence
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          EXPECTED_PIPELINE_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const root = process.env.GITHUB_WORKSPACE;
          const commit = String(process.env.EXPECTED_COMMIT_SHA || '').toLowerCase();
          const pipelineId = String(process.env.EXPECTED_PIPELINE_ID || '');
          const matrixPath = path.join(root, 'backend/docs/verification/TENANT_ISOLATION_MATRIX.json');
          const restorePath = path.join(process.env.RUNNER_TEMP, 'POSTGRES_LOGICAL_RESTORE_DRILL_RESULT.json');
          const matrixRaw = fs.readFileSync(matrixPath, 'utf8');
          const restoreRaw = fs.readFileSync(restorePath, 'utf8');
          const matrix = JSON.parse(matrixRaw);
          const restore = JSON.parse(restoreRaw);
          const digest = raw => crypto.createHash('sha256').update(raw, 'utf8').digest('hex');
          const m = matrix.tested || {};
          const ua = m.unauthenticated || {};
          const foreign = m.foreignIdProbe || {};
          const cross = m.crossTenantFixture || {};
          const tenantRouteCount = Number(matrix.discovered && matrix.discovered.tenantDataRoutes);
          const foreignIdRouteCount = Number(matrix.discovered && matrix.discovered.foreignIdRoutes);
          if (matrix.schemaVersion !== 'opscore.tenant-isolation-matrix.v1' ||
              matrix.status !== 'PASS' ||
              String(matrix.sourceCommit || '').toLowerCase() !== commit ||
              matrix.productionCertification !== false ||
              matrix.isolationCertification !== 'NOT_CERTIFIED' ||
              !Number.isSafeInteger(tenantRouteCount) || tenantRouteCount < 1 ||
              Number(ua.checks) !== tenantRouteCount || Number(ua.pass) !== tenantRouteCount || Number(ua.fail) !== 0 ||
              (!Number.isSafeInteger(foreignIdRouteCount) || foreignIdRouteCount < 0) || Number(foreign.checks) !== foreignIdRouteCount || Number(foreign.pass) !== foreignIdRouteCount || Number(foreign.fail) !== 0 ||
              Number(cross.checks) < 1 || Number(cross.pass) !== Number(cross.checks) || Number(cross.fail) !== 0 ||
              (matrix.skipped || []).length !== 0 || (matrix.cleanupErrors || []).length !== 0) {
            throw new Error('TENANT_MATRIX_EVIDENCE_INCOMPLETE_OR_NOT_CLEAN');
          }
          if (restore.schemaVersion !== 'opscore.postgres-logical-restore-drill.v1' ||
              restore.status !== 'PASS' ||
              restore.evidenceClass !== 'CI_DISPOSABLE_DATABASE_LOGICAL_RESTORE' ||
              restore.productionCertification !== false ||
              restore.ownershipAndAclRestored !== false ||
              restore.verificationScope !== 'DATA_SCHEMA_CATALOG_RLS_AND_TABLE_CONTENT' ||
              restore.cleanup?.status !== 'PASS' ||
              !Array.isArray(restore.checks) || restore.checks.length < 1 ||
              restore.checks.some(check => check.status !== 'PASS') ||
              !Number.isSafeInteger(Number(restore.archive?.bytes)) || Number(restore.archive.bytes) < 1024 ||
              !/^[a-f0-9]{64}$/i.test(String(restore.archive?.sha256 || '')) ||
              !Number.isSafeInteger(Number(restore.tableCount)) || Number(restore.tableCount) < 1 ||
              !(restore.limitations || []).some(item => /Neon point-in-time restore/i.test(String(item)))) {
            throw new Error('LOGICAL_RESTORE_EVIDENCE_INCOMPLETE_OR_SCOPE_MISMATCH');
          }
          const wrap = (evidenceType, scope, evidence) => ({
            schemaVersion: 'opscore.caller-bound-ci-evidence.v1',
            evidenceType,
            binding: { commit, pipelineId, scope },
            evidence
          });
          const matrixEnvelope = wrap('tenant-matrix', 'DISPOSABLE_POSTGRESQL_18_CI', {
            schemaVersion: matrix.schemaVersion,
            sourceCommit: matrix.sourceCommit,
            status: matrix.status,
            productionCertification: matrix.productionCertification,
            isolationCertification: matrix.isolationCertification,
            fullEvidenceSha256: digest(matrixRaw),
            discovered: matrix.discovered,
            tested: matrix.tested,
            skippedCount: (matrix.skipped || []).length,
            cleanupErrorsCount: (matrix.cleanupErrors || []).length
          });
          const restoreEnvelope = wrap('postgres-logical-restore', 'DISPOSABLE_POSTGRESQL_18_LOGICAL_RESTORE_CI', {
            schemaVersion: restore.schemaVersion,
            status: restore.status,
            evidenceClass: restore.evidenceClass,
            productionCertification: restore.productionCertification,
            ownershipAndAclRestored: restore.ownershipAndAclRestored,
            verificationScope: restore.verificationScope,
            fullEvidenceSha256: digest(restoreRaw),
            checks: restore.checks.map(check => ({ name: check.name, status: check.status })),
            cleanup: restore.cleanup,
            archive: restore.archive,
            tableCount: restore.tableCount,
            limitations: restore.limitations
          });
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'tenant_matrix_evidence_b64=' + Buffer.from(JSON.stringify(matrixEnvelope)).toString('base64') + '\n' +
            'restore_drill_evidence_b64=' + Buffer.from(JSON.stringify(restoreEnvelope)).toString('base64') + '\n');
          console.log('CALLER_BOUND_TENANT_MATRIX=PASS routes=' + tenantRouteCount);
          console.log('CALLER_BOUND_LOGICAL_RESTORE=PASS tables=' + restore.tableCount);
          console.log('PRODUCTION_TENANT_AND_NEON_PITR_CERTIFICATION=false');
          NODE

  production-neon-pitr-history-probe:
    name: Production Neon PITR historical branch probe (read-only)
    if: (github.event_name == 'pull_request' && (github.head_ref == 'fix/vercel-evidence-postgres-storage-2026-11-19' || github.head_ref == 'test/twin-browser-rtl-responsive-20261127' || github.head_ref == 'test/dispatcher-map-postgres-browser-e2e-20261127')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: live-rls
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    # PITR is a required candidate evidence gate on manual main dispatch.
    # Missing credentials or failed historical restore must fail this job, never PASS_WITH_SKIPS.
    steps:
      - name: Create and inspect a disposable historical branch from the Production root timeline
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: summer-leaf-18448271
          ROOT_BRANCH_ID: br-proud-salad-bcshhdap
          DATABASE_NAME: opscore_acceptance
          RUNTIME_ROLE: opscore_runtime
        run: |
          set -euo pipefail
          if [[ -z "${NEON_API_KEY:-}" ]]; then
            echo "PITR_PROBE=FAIL_NEON_API_KEY_MISSING" >&2
            echo "NEON_API_KEY is blank at runtime; historical restore cannot be proven." >&2
            exit 1
          fi
          AUTH=(-H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json")
          API="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}"
          PITR_TIMESTAMP="$(date -u --date='5 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')"
          BRANCH_NAME="opscore-pitr-ci-${GITHUB_RUN_ID}"
          export PITR_TIMESTAMP BRANCH_NAME
          # Catalog read-back guard for the restored branch (strict TLS):
          # the probe connects with sslmode=verify-full and sslrootcert=system,
          # verifies pg_policies and relforcerowsecurity coverage on the restored
          # tenant tables; migration ledger excluded by runtime-role boundary.
          BRANCH_ID=""
          cleanup() {
            if [[ -n "${BRANCH_ID}" ]]; then
              curl -fsS -X DELETE "${AUTH[@]}" "${API}/branches/${BRANCH_ID}" >/dev/null
              echo "PITR_TEST_BRANCH_CLEANUP=PASS"
            fi
          }
          trap cleanup EXIT
          python3 - <<'PY' > "$RUNNER_TEMP/pitr-request.json"
          import json,os
          print(json.dumps({
            "branch": {
              "name": os.environ["BRANCH_NAME"],
              "parent_id": os.environ["ROOT_BRANCH_ID"],
              "parent_timestamp": os.environ["PITR_TIMESTAMP"]
            },
            "endpoints": [{"type":"read_write"}]
          }))
          PY
          CREATE_HTTP_STATUS="$(curl -sS -o "$RUNNER_TEMP/pitr-create-response.json" -w '%{http_code}' -X POST "${AUTH[@]}" -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/pitr-request.json" "${API}/branches")"
          if [[ "$CREATE_HTTP_STATUS" != "201" ]]; then
            echo "PITR_BRANCH_CREATE_HTTP_STATUS=$CREATE_HTTP_STATUS" >&2
            echo "PITR_BRANCH_CREATE_RESPONSE_BEGIN" >&2
            cat "$RUNNER_TEMP/pitr-create-response.json" >&2
            echo >&2
            echo "PITR_BRANCH_CREATE_RESPONSE_END" >&2
            exit 1
          fi
          CREATE="$(cat "$RUNNER_TEMP/pitr-create-response.json")"
          BRANCH_ID="$(printf '%s' "$CREATE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["branch"]["id"])')"
          BRANCH_ENDPOINT_ID="$(printf '%s' "$CREATE" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("endpoints") or [{}])[0].get("id") or "")')"
          test -n "$BRANCH_ENDPOINT_ID" || { echo "PITR_BRANCH_ENDPOINT_MISSING"; exit 1; }
          test "${BRANCH_ID#br-}" != "${BRANCH_ID}" || { echo "PITR_BRANCH_ID_INVALID"; exit 1; }
          echo "PITR_SOURCE_ROOT_BRANCH=${ROOT_BRANCH_ID}"
          echo "PITR_HISTORICAL_BRANCH=${BRANCH_ID}"
          echo "PITR_TARGET_TIMESTAMP=${PITR_TIMESTAMP}"
          ready=0
          for attempt in $(seq 1 45); do
            CURRENT="$(curl -fsS "${AUTH[@]}" "${API}/branches/${BRANCH_ID}")"
            STATE="$(printf '%s' "$CURRENT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["branch"].get("current_state",""))')"
            if [[ "$STATE" == "ready" ]]; then
              PARENT_TS="$(printf '%s' "$CURRENT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["branch"].get("parent_timestamp") or "")')"
              test -n "$PARENT_TS" || { echo "PITR_PARENT_TIMESTAMP_MISSING"; exit 1; }
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1" || { echo "PITR_BRANCH_NOT_READY"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          fetch_uri() {
            local branch="$1"
            local endpoint="$2"
            local file="$3"
            curl -fsS -G "${AUTH[@]}" \
              --data-urlencode "branch_id=${branch}" \
              --data-urlencode "database_name=${DATABASE_NAME}" \
              --data-urlencode "role_name=${RUNTIME_ROLE}" \
              --data-urlencode "endpoint_id=${endpoint}" \
              --data-urlencode "pooled=false" \
              "${API}/connection_uri" > "${file}.json"
            python3 - "${file}.json" "$file" "$DATABASE_NAME" <<'PY'
          import json,sys
          from urllib.parse import urlsplit,urlunsplit,parse_qsl,urlencode
          raw=json.load(open(sys.argv[1]))["uri"]
          p=urlsplit(raw)
          if p.scheme not in ("postgres","postgresql") or not p.hostname or "-pooler" in p.hostname:
            raise SystemExit("PITR_DIRECT_POSTGRES_REQUIRED")
          if p.path.lstrip("/") != sys.argv[3]:
            raise SystemExit("PITR_DATABASE_MISMATCH")
          q=dict(parse_qsl(p.query,keep_blank_values=True)); q["sslmode"]="verify-full"
          q["sslrootcert"]="system"
          open(sys.argv[2],"w").write(urlunsplit((p.scheme,p.netloc,p.path,urlencode(q),p.fragment)))
          PY
            chmod 600 "$file"
          }
          fetch_uri "$BRANCH_ID" "$BRANCH_ENDPOINT_ID" "$RUNNER_TEMP/pitr.uri"
          fetch_uri "$ROOT_BRANCH_ID" "ep-mute-sun-bcahhoei" "$RUNNER_TEMP/head.uri"
          SQL="SELECT concat_ws('|', current_database(), (SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'), (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r' AND c.relforcerowsecurity), (SELECT count(*) FROM pg_policies), (SELECT string_agg(extname||':'||extversion,',' ORDER BY extname) FROM pg_extension));"
          HISTORICAL="$(psql "$(cat "$RUNNER_TEMP/pitr.uri")" -X -v ON_ERROR_STOP=1 -Atc "$SQL")"
          HEAD="$(psql "$(cat "$RUNNER_TEMP/head.uri")" -X -v ON_ERROR_STOP=1 -Atc "$SQL")"
          test -n "$HISTORICAL" && test "$HISTORICAL" = "$HEAD" || {
            echo "PITR_HISTORICAL_SCHEMA_CATALOG_MISMATCH"
            echo "historical=$HISTORICAL"
            echo "head=$HEAD"
            exit 1
          }
          echo "PITR_ROOT_HISTORY_BRANCH=PASS"
          echo "PITR_ROLE=opscore_runtime (non-superuser, no BYPASSRLS)"
          echo "PITR_DATA_ACCESS=aggregate schema, RLS, policy, and extension catalog only; migration ledger excluded by runtime-role boundary"
          echo "PITR_SCHEMA_CATALOG_MATCH=PASS"
          echo "PITR_TEST_SCOPE=historical branch from Production root; source branch unchanged"
          {
            echo "PITR_TARGET_TIMESTAMP=${PITR_TIMESTAMP}"
            echo "PITR_HISTORICAL_BRANCH=${BRANCH_ID}"
            echo "PITR_SOURCE_ROOT_BRANCH=${ROOT_BRANCH_ID}"
          } >> "$GITHUB_ENV"

      - name: Write production-native PITR evidence for release-proof binding
        if: success()
        env:
          ROOT_BRANCH_ID: br-proud-salad-bcshhdap
          DATABASE_NAME: opscore_acceptance
        run: |
          set -euo pipefail
          mkdir -p backend/docs/verification backend/src/embedded-evidence
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = require('node:path');
          const commit = String(process.env.GITHUB_SHA || '').toLowerCase();
          const pipelineId = String(process.env.GITHUB_RUN_ID || '');
          const targetTimestampUtc = String(process.env.PITR_TARGET_TIMESTAMP || '').trim();
          const restoredBranchId = String(process.env.PITR_HISTORICAL_BRANCH || '').trim();
          const sourceBranchId = String(process.env.PITR_SOURCE_ROOT_BRANCH || process.env.ROOT_BRANCH_ID || '').trim();
          if (!/^[a-f0-9]{40}$/.test(commit)) throw new Error('PITR_EVIDENCE_COMMIT_INVALID');
          if (!/^[1-9][0-9]{0,14}$/.test(pipelineId)) throw new Error('PITR_EVIDENCE_PIPELINE_INVALID');
          if (!sourceBranchId.startsWith('br-') || !restoredBranchId.startsWith('br-')) throw new Error('PITR_EVIDENCE_BRANCH_IDS_MISSING');
          if (!/^\d{4}-\d{2}-\d{2}T/.test(targetTimestampUtc)) throw new Error('PITR_EVIDENCE_TIMESTAMP_MISSING');
          const evidence = {
            schemaVersion: 'opscore.production-native-pitr.v1',
            status: 'PASS',
            environment: 'production',
            mechanism: 'NEON_INSTANT_RESTORE_FROM_HISTORY',
            dataIntegrity: 'PASS',
            verificationScope: 'production-root-historical-branch-schema-catalog-match-read-only',
            targetTimestampUtc,
            restoredBranchId,
            sourceBranchId,
            databaseName: process.env.DATABASE_NAME || 'opscore_acceptance',
            sourceCommit: commit,
            pipelineId,
            testedAt: new Date().toISOString(),
            note: 'Native Neon instant restore from production root history to a disposable branch; schema/RLS catalog matched; branch deleted after probe. Not full row-content equality or RPO/RTO certification.'
          };
          const canonical = JSON.stringify(evidence, null, 2) + '\n';
          evidence.evidenceSha256 = crypto.createHash('sha256').update(canonical).digest('hex');
          const out = JSON.stringify(evidence, null, 2) + '\n';
          for (const rel of [
            'backend/docs/verification/PRODUCTION_NATIVE_PITR_EVIDENCE.json',
            'backend/src/embedded-evidence/PRODUCTION_NATIVE_PITR_EVIDENCE.json'
          ]) {
            fs.mkdirSync(path.dirname(rel), { recursive: true });
            fs.writeFileSync(rel, out);
          }
          process.stdout.write('PRODUCTION_NATIVE_PITR_EVIDENCE=PASS sha=' + evidence.evidenceSha256 + '\n');
          NODE
      - name: Upload production-native PITR evidence artifact
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-native-pitr-evidence
          path: |
            backend/docs/verification/PRODUCTION_NATIVE_PITR_EVIDENCE.json
            backend/src/embedded-evidence/PRODUCTION_NATIVE_PITR_EVIDENCE.json
          if-no-files-found: error

# path-trigger: keep the isolated Neon acceptance workflow enabled on infrastructure PRs
