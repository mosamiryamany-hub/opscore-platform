name: Mobile SDK 58 current-main candidate validation

on:
  push:
    branches:
      - fix/mobile-sdk58-current-main-20261117

permissions:
  contents: write

concurrency:
  group: mobile-sdk58-current-main-candidate
  cancel-in-progress: false

jobs:
  resolve-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact current-main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Resolve published Expo SDK 58-compatible graph
        working-directory: mobile
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npx expo install --fix
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const p = require('./package.json');
          const l = require('./package-lock.json');
          const names = ['expo', 'react', 'react-dom', 'react-native', 'expo-image-picker', 'expo-location', 'expo-network', 'expo-secure-store', 'expo-sqlite'];
          for (const n of names) console.log('SDK58_RESOLUTION', n, p.dependencies[n], l.packages['node_modules/' + n]?.version);
          if (!/^\^?58\./.test(p.dependencies.expo)) throw new Error('EXPO_SDK_58_REQUIRED');
          if (!String(l.packages['node_modules/expo']?.version || '').startsWith('58.')) throw new Error('LOCK_EXPO_SDK_58_REQUIRED');
          if (l.packages['node_modules/react-native']?.version !== '0.88.1') throw new Error('REACT_NATIVE_0_88_1_REQUIRED');
          if (l.packages['node_modules/react']?.version !== '19.3.0') throw new Error('REACT_19_3_0_REQUIRED');
          NODE

      - name: Require clean reproducible install and source verification
        working-directory: mobile
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node scripts/dependency-upgrade-gate.js
          node scripts/release-preflight.js
          npm run verify
          npx expo-doctor@latest | tee "$RUNNER_TEMP/expo-doctor.txt"

      - name: Export Android, iOS and web application bundles
        working-directory: mobile
        run: |
          set -euo pipefail
          npx expo export --platform android --output-dir "$RUNNER_TEMP/opscore-mobile-android" 2>&1 | tee "$RUNNER_TEMP/export-android.txt"
          npx expo export --platform ios --output-dir "$RUNNER_TEMP/opscore-mobile-ios" 2>&1 | tee "$RUNNER_TEMP/export-ios.txt"
          npx expo export --platform web --output-dir "$RUNNER_TEMP/opscore-mobile-web" 2>&1 | tee "$RUNNER_TEMP/export-web.txt"

      - name: Verify advisory package signatures are absent from exported client bundles
        run: |
          set -euo pipefail
          for target in android ios web; do
            dir="$RUNNER_TEMP/opscore-mobile-$target"
            if grep -R -n -E 'analyzeRepeatedExtglob|node_modules/picomatch|picomatch/lib/parse' "$dir"; then
              echo "PICOMATCH_SIGNATURE_PRESENT_IN_CLIENT_BUNDLE target=$target"
              exit 1
            fi
            echo "PICOMATCH_SIGNATURE_NOT_FOUND_IN_CLIENT_BUNDLE target=$target"
          done

      - name: Capture complete dependency audit without suppression
        working-directory: mobile
        run: |
          set +e
          npm audit --json > mobile-dependency-audit.json
          full_status=$?
          npm audit --omit=dev --json > mobile-production-dependency-audit.json
          production_status=$?
          set -e
          if [ "$full_status" -gt 1 ] || [ "$production_status" -gt 1 ]; then
            echo "MOBILE_AUDIT_EXECUTION_ERROR full=$full_status production=$production_status"
            exit 2
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          for (const file of ['mobile-dependency-audit.json', 'mobile-production-dependency-audit.json']) {
            const r = JSON.parse(fs.readFileSync(file, 'utf8'));
            const v = r.metadata?.vulnerabilities;
            if (!v || typeof v.total !== 'number') throw new Error('AUDIT_REPORT_INCOMPLETE: ' + file);
            console.log('AUDIT_RESULT', JSON.stringify({file, vulnerabilities:v}));
            for (const [name, issue] of Object.entries(r.vulnerabilities || {})) {
              console.log('AUDIT_FINDING', JSON.stringify({
                name, severity:issue.severity, range:issue.range,
                fixAvailable:issue.fixAvailable,
                via:(issue.via || []).map(x => typeof x === 'string' ? x : {title:x.title,url:x.url,range:x.range})
              }));
            }
          }
          NODE

      - name: Commit regenerated SDK lockfile and audit evidence to candidate branch
        run: |
          set -euo pipefail
          git diff --check
          git add mobile/package.json mobile/package-lock.json mobile/mobile-dependency-audit.json mobile/mobile-production-dependency-audit.json
          if git diff --cached --quiet; then
            echo "NO_REFRESH_CHANGES"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(mobile): refresh current-main SDK 58 lockfile and audit evidence"
            git push origin HEAD:fix/mobile-sdk58-current-main-20261117
          fi

      - name: Fail closed for unresolved High or Critical audit findings
        working-directory: mobile
        run: |
          node - <<'NODE'
          const r = require('./mobile-dependency-audit.json');
          const v = r.metadata?.vulnerabilities;
          if (!v || typeof v.total !== 'number') throw new Error('AUDIT_REPORT_INCOMPLETE');
          console.log('FINAL_MOBILE_AUDIT', JSON.stringify(v));
          if ((v.high || 0) > 0 || (v.critical || 0) > 0) {
            console.error('UNRESOLVED_HIGH_OR_CRITICAL_FINDINGS');
            process.exit(1);
          }
          NODE

      - name: Upload exact candidate dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-sdk58-current-main-evidence-\${{ github.run_id }}
          path: |
            mobile/package.json
            mobile/package-lock.json
            mobile/mobile-dependency-audit.json
            mobile/mobile-production-dependency-audit.json
            \${{ runner.temp }}/expo-doctor.txt
            \${{ runner.temp }}/export-android.txt
            \${{ runner.temp }}/export-ios.txt
            \${{ runner.temp }}/export-web.txt
          if-no-files-found: warn
          retention-days: 14
