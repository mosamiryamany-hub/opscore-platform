name: Dispatcher Map Responsive RTL Acceptance

on:
  pull_request:
    paths:
      - 'backend/web/dispatcher-map.*'
      - 'backend/web/dispatcher-map-geojson.mjs'
      - 'backend/scripts/dispatcher-map-browser-static-acceptance.js'
      - 'backend/test/dispatcher-map-geojson.test.js'
      - '.github/workflows/dispatcher-map-browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatcher-map-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - name: Install pinned Chromium browser runner
        working-directory: backend
        run: npm install --no-save --package-lock=false playwright@1.65.1
      - name: Install Chromium
        working-directory: backend
        run: npx playwright install --with-deps chromium
      - name: Syntax and GeoJSON contract tests
        run: |
          node --check backend/web/dispatcher-map.js
          node --check backend/web/dispatcher-map-geojson.mjs
          node --check backend/scripts/dispatcher-map-browser-static-acceptance.js
          node --test backend/test/dispatcher-map-geojson.test.js
      - name: Start Dispatcher Map static server
        run: |
          python3 -m http.server 4174 --directory backend/web > /tmp/opscore-dispatcher-map.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/dispatcher-map.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/opscore-dispatcher-map.log
          exit 1
      - name: Run Chromium responsive and RTL acceptance
        env:
          OPSC_UI_BASE_URL: http://127.0.0.1:4174
          OPSC_UI_ARTIFACT_DIR: ${{ github.workspace }}/dispatcher-map-browser-artifacts
        working-directory: backend
        run: node scripts/dispatcher-map-browser-static-acceptance.js
      - name: Upload Dispatcher Map screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opscore-dispatcher-map-browser-acceptance
          path: dispatcher-map-browser-artifacts/
          if-no-files-found: warn
          retention-days: 14
