name: OpsCore secure release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: opscore-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    if: >-
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json

      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          expected_tag="v$(node -p "require('./backend/package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected_tag"

      - name: Verify manually dispatched source is main
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Verify source commit is contained in main
        run: git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main

      - name: Install backend dependencies from lockfile
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Install mobile dependencies from lockfile
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Run backend regression suite
        working-directory: backend
        run: OPSC_RELEASE_TEST_CONCURRENCY=4 node scripts/release-test-runner.js

      - name: Regenerate current-head forensic language evidence
        working-directory: backend
        run: npm run contact-center:i18n:forensic

      - name: PostgreSQL schema parity gate
        working-directory: backend
        run: npm run db:postgres-parity

      - name: Migration preflight
        working-directory: backend
        run: node scripts/migration-preflight.js

      - name: Security transaction audit
        working-directory: backend
        run: npm run security:red-team

      - name: Production readiness gate
        working-directory: backend
        run: npm run production:readiness

      - name: Resilience and load gate
        working-directory: backend
        run: npm run resilience:gate

      - name: Recovery gate
        working-directory: backend
        run: npm run recovery:gate

      - name: Buyer self-validation
        working-directory: backend
        run: npm run buyer:self-validation

      - name: Mobile release preflight
        working-directory: mobile
        run: node scripts/release-preflight.js

      - name: Run mobile verification
        working-directory: mobile
        run: npm run verify

      - name: Generate current mobile dependency audit
        working-directory: mobile
        run: |
          set +e
          npm audit --json > mobile-dependency-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            echo "MOBILE_NPM_AUDIT_EXECUTION_FAILED status=$audit_status"
            exit "$audit_status"
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('mobile-dependency-audit.json', 'utf8'));
          const v = report.metadata && report.metadata.vulnerabilities;
          if (!v || typeof v.total !== 'number') throw new Error('MOBILE_AUDIT_REPORT_INCOMPLETE');
          console.log('MOBILE_AUDIT_SUMMARY', JSON.stringify(v));
          if ((v.high || 0) > 0 || (v.critical || 0) > 0) process.exit(1);
          NODE

      - name: Generate current root dependency audit
        run: |
          set +e
          npm audit --json > root-dependency-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            echo "ROOT_NPM_AUDIT_EXECUTION_FAILED status=$audit_status"
            exit "$audit_status"
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('root-dependency-audit.json', 'utf8'));
          const v = report.metadata && report.metadata.vulnerabilities;
          if (!v || typeof v.total !== 'number') throw new Error('ROOT_AUDIT_REPORT_INCOMPLETE');
          console.log('ROOT_AUDIT_SUMMARY', JSON.stringify(v));
          if ((v.high || 0) > 0 || (v.critical || 0) > 0) process.exit(1);
          NODE

      - name: Generate deterministic SBOM
        run: node scripts/generate-sbom.js

      - name: Verify SBOM against manifests and lockfiles
        run: node scripts/verify-sbom.js

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Build buyer release archive
        env:
          CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_PIPELINE_ID: ${{ github.run_id }}
          CI_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
          CI_PROJECT_PATH: ${{ github.repository }}
          CI_JOB_NAME: commercial-closure
        run: node scripts/package-release.js "$RUNNER_TEMP/OpsCore-release.zip"

      - name: Write external commercial archive statement
        env:
          CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_PIPELINE_ID: ${{ github.run_id }}
          CI_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
          CI_PROJECT_PATH: ${{ github.repository }}
          CI_JOB_NAME: commercial-closure
        run: node scripts/write-release-attestation.js "$RUNNER_TEMP/OpsCore-release.zip" "$RUNNER_TEMP/COMMERCIAL_RELEASE_STATEMENT.json"

      - name: Generate release provenance attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "$RUNNER_TEMP/OpsCore-release.zip"
          sbom-path: docs/sbom/opscore-v0.11.62.cyclonedx.json

      - name: Upload release and exact-run evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opscore-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/OpsCore-release.zip
            ${{ runner.temp }}/COMMERCIAL_RELEASE_STATEMENT.json
            mobile/mobile-dependency-audit.json
            root-dependency-audit.json
            backend/docs/verification/I18N_FORENSIC_AUDIT_RESULT.json
            backend/docs/verification/I18N_FORENSIC_AUDIT_RESULT.sha256
          if-no-files-found: error
          retention-days: 14
