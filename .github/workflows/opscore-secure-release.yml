name: OpsCore secure release

on:
  push:
    branches:
      - 'release/secure-builder-provenance-8011bc55'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  OPSC_RELEASE_SOURCE_SHA: "8011bc5550372a318dbf47bf89e6837059987f58"

concurrency:
  group: opscore-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    if: >-
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/release/secure-builder-provenance-8011bc55')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.OPSC_RELEASE_SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json

      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          node - <<'NODE'
          const version = require('./backend/package.json').version;
          const tag = process.env.RELEASE_TAG || '';
          const parts = version.split('.');
          if (parts.length !== 3 || parts.some(part => !/^[0-9]+$/.test(part))) throw new Error('PACKAGE_VERSION_NOT_SEMVER: ' + version);
          const exact = 'v' + version;
          const commercial = new RegExp('^v' + parts.join('[.]') + '[.][0-9]+-[a-z0-9]+([.-][a-z0-9]+)*$');
          if (tag !== exact && !commercial.test(tag)) {
            throw new Error('RELEASE_TAG_VERSION_MISMATCH: expected ' + exact + ' or a numbered commercial closure suffix; received ' + tag);
          }
          console.log('RELEASE_TAG_VERSION_MATCH: ' + tag + ' -> ' + version);
          NODE
      - name: Verify manually dispatched source is main
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Verify source commit is contained in main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OPSC_RELEASE_SOURCE_SHA"
          git merge-base --is-ancestor "$OPSC_RELEASE_SOURCE_SHA" origin/main

      - name: Install backend dependencies from lockfile
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Install mobile dependencies from lockfile
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Run backend regression suite
        working-directory: backend
        run: OPSC_RELEASE_TEST_CONCURRENCY=4 node scripts/release-test-runner.js

      - name: Regenerate current-head forensic language evidence
        working-directory: backend
        run: npm run contact-center:i18n:forensic

      - name: PostgreSQL schema parity gate
        working-directory: backend
        run: npm run db:postgres-parity

      - name: Migration preflight
        working-directory: backend
        run: node scripts/migration-preflight.js

      - name: Security transaction audit
        working-directory: backend
        run: npm run security:red-team

      - name: Production readiness gate
        working-directory: backend
        run: npm run production:readiness

      - name: Resilience and load gate
        working-directory: backend
        run: npm run resilience:gate

      - name: Recovery gate
        working-directory: backend
        run: npm run recovery:gate

      - name: Buyer installation verification (produces real evidence artifact)
        working-directory: backend
        run: npm run verify:installation

      - name: Buyer self-validation
        working-directory: backend
        run: npm run buyer:self-validation

      - name: Mobile release preflight
        working-directory: mobile
        run: node scripts/release-preflight.js

      - name: Run mobile verification
        working-directory: mobile
        run: npm run verify

      - name: Generate current mobile dependency audit
        working-directory: mobile
        run: |
          set +e
          npm audit --json > mobile-dependency-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            echo "MOBILE_NPM_AUDIT_EXECUTION_FAILED status=$audit_status"
            exit "$audit_status"
          fi
          node scripts/audit-gate.js

      - name: Generate current root dependency audit
        run: |
          set +e
          npm audit --json > root-dependency-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            echo "ROOT_NPM_AUDIT_EXECUTION_FAILED status=$audit_status"
            exit "$audit_status"
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('root-dependency-audit.json', 'utf8'));
          const v = report.metadata && report.metadata.vulnerabilities;
          if (!v || typeof v.total !== 'number') throw new Error('ROOT_AUDIT_REPORT_INCOMPLETE');
          console.log('ROOT_AUDIT_SUMMARY', JSON.stringify(v));
          if ((v.high || 0) > 0 || (v.critical || 0) > 0) process.exit(1);
          NODE

      - name: Generate deterministic SBOM
        run: node scripts/generate-sbom.js

      - name: Verify SBOM against manifests and lockfiles
        run: node scripts/verify-sbom.js

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Build buyer release archive
        env:
          CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          CI_COMMIT_SHA: ${{ env.OPSC_RELEASE_SOURCE_SHA }}
          CI_PIPELINE_ID: ${{ github.run_id }}
          CI_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
          CI_PROJECT_PATH: ${{ github.repository }}
          CI_JOB_NAME: commercial-closure
        run: node scripts/package-release.js "$RUNNER_TEMP/OpsCore-release.zip"

      - name: Write external commercial archive statement
        env:
          CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          CI_COMMIT_SHA: ${{ env.OPSC_RELEASE_SOURCE_SHA }}
          CI_PIPELINE_ID: ${{ github.run_id }}
          CI_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
          CI_PROJECT_PATH: ${{ github.repository }}
          CI_JOB_NAME: commercial-closure
        run: node scripts/write-release-attestation.js "$RUNNER_TEMP/OpsCore-release.zip" "$RUNNER_TEMP/COMMERCIAL_RELEASE_STATEMENT.json"

      # The source code is checked out at OPSC_RELEASE_SOURCE_SHA, while this
      # isolated builder workflow is identified by GITHUB_REF/GITHUB_SHA in its attestation.
      - name: Create detached SBOM copy and external SHA-256 manifest
        env:
          RELEASE_ARCHIVE: "${{ runner.temp }}/OpsCore-release.zip"
          RELEASE_SBOM_SOURCE: "docs/sbom/opscore-v0.11.62.cyclonedx.json"
          RELEASE_SBOM: "${{ runner.temp }}/opscore-v0.11.62.cyclonedx.json"
          RELEASE_CHECKSUMS: "${{ runner.temp }}/RELEASE_SHA256SUMS.txt"
        run: |
          set -euo pipefail
          test -s "$RELEASE_ARCHIVE"
          test -s "$RELEASE_SBOM_SOURCE"
          cp "$RELEASE_SBOM_SOURCE" "$RELEASE_SBOM"
          (
            cd "$RUNNER_TEMP"
            sha256sum "OpsCore-release.zip" "opscore-v0.11.62.cyclonedx.json" > "RELEASE_SHA256SUMS.txt"
            sha256sum -c "RELEASE_SHA256SUMS.txt"
          )

      - name: Write source-pinned build provenance predicate
        env:
          SOURCE_SHA: "${{ env.OPSC_RELEASE_SOURCE_SHA }}"
          WORKFLOW_SHA: "${{ github.sha }}"
          WORKFLOW_REF: "${{ github.ref }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RELEASE_ARCHIVE: "${{ runner.temp }}/OpsCore-release.zip"
          OUTPUT: "${{ runner.temp }}/source-pinned-provenance.json"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const sourceSha = process.env.SOURCE_SHA || '';
          const workflowSha = process.env.WORKFLOW_SHA || '';
          const repository = process.env.GITHUB_REPOSITORY || '';
          const archivePath = process.env.RELEASE_ARCHIVE;
          if (!/^[a-f0-9]{40}$/.test(sourceSha) || !/^[a-f0-9]{40}$/.test(workflowSha) || !repository || !fs.existsSync(archivePath)) {
            throw new Error('SOURCE_PINNED_PROVENANCE_INPUT_INVALID');
          }
          const archive = fs.readFileSync(archivePath);
          const predicate = {
            schemaVersion: 'opscore.source-pinned-build.v1',
            source: {
              repository: 'https://github.com/' + repository,
              commit: sourceSha
            },
            builder: {
              workflow: 'https://github.com/' + repository + '/.github/workflows/opscore-secure-release.yml',
              workflowRef: process.env.WORKFLOW_REF,
              workflowCommit: workflowSha,
              runUrl: process.env.RUN_URL,
              runnerImage: 'ubuntu-24.04'
            },
            subject: {
              name: 'OpsCore-release.zip',
              digest: { sha256: crypto.createHash('sha256').update(archive).digest('hex') },
              sizeBytes: archive.length
            }
          };
          fs.writeFileSync(process.env.OUTPUT, JSON.stringify(predicate, null, 2) + '\n');
          NODE

      # Use GitHub's built-in provenance mode so GitHub assigns its accepted
      # SLSA buildType; do not inject a custom SLSA predicate here.
      - name: Attest archive with GitHub-generated SLSA provenance
        id: provenance_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ runner.temp }}/OpsCore-release.zip"

      - name: Attest exact source SHA and archive digest
        id: source_pin_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ runner.temp }}/OpsCore-release.zip"
          predicate-type: "https://github.com/mosamiryamany-hub/opscore-platform/attestations/source-pinned-build/v1"
          predicate-path: "${{ runner.temp }}/source-pinned-provenance.json"

      - name: Attest CycloneDX SBOM against release archive
        id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ runner.temp }}/OpsCore-release.zip"
          sbom-path: "${{ runner.temp }}/opscore-v0.11.62.cyclonedx.json"

      - name: Verify SLSA, source-pinned and SBOM attestations from GitHub
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_ARCHIVE: "${{ runner.temp }}/OpsCore-release.zip"
          SOURCE_SHA: "${{ env.OPSC_RELEASE_SOURCE_SHA }}"
          PROVENANCE_RESULT: "${{ runner.temp }}/provenance-verification.json"
          SOURCE_PIN_RESULT: "${{ runner.temp }}/source-pin-verification.json"
          SBOM_RESULT: "${{ runner.temp }}/sbom-attestation-verification.json"
        run: |
          set -euo pipefail
          gh attestation verify "$RELEASE_ARCHIVE" -R "$GITHUB_REPOSITORY" \
            --predicate-type "https://slsa.dev/provenance/v1" --format json > "$PROVENANCE_RESULT"
          gh attestation verify "$RELEASE_ARCHIVE" -R "$GITHUB_REPOSITORY" \
            --predicate-type "https://github.com/mosamiryamany-hub/opscore-platform/attestations/source-pinned-build/v1" \
            --format json > "$SOURCE_PIN_RESULT"
          gh attestation verify "$RELEASE_ARCHIVE" -R "$GITHUB_REPOSITORY" \
            --predicate-type "https://cyclonedx.org/bom" --format json > "$SBOM_RESULT"
          grep -q "$SOURCE_SHA" "$SOURCE_PIN_RESULT"
          test -s "$PROVENANCE_RESULT"
          test -s "$SBOM_RESULT"
          echo "GITHUB_SLSA_PROVENANCE_VERIFICATION=PASS"
          echo "SOURCE_PINNED_BUILD_ATTESTATION_VERIFICATION=PASS"
          echo "GITHUB_CYCLONEDX_SBOM_ATTESTATION_VERIFICATION=PASS"

      - name: Collect downloadable attestation bundles
        env:
          PROVENANCE_BUNDLE: "${{ steps.provenance_attestation.outputs.bundle-path }}"
          SOURCE_PIN_BUNDLE: "${{ steps.source_pin_attestation.outputs.bundle-path }}"
          SBOM_BUNDLE: "${{ steps.sbom_attestation.outputs.bundle-path }}"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opscore-attestation-bundles"
          test -s "$PROVENANCE_BUNDLE"
          test -s "$SOURCE_PIN_BUNDLE"
          test -s "$SBOM_BUNDLE"
          cp "$PROVENANCE_BUNDLE" "$RUNNER_TEMP/opscore-attestation-bundles/slsa-provenance-attestation.jsonl"
          cp "$SOURCE_PIN_BUNDLE" "$RUNNER_TEMP/opscore-attestation-bundles/source-pinned-build-attestation.jsonl"
          cp "$SBOM_BUNDLE" "$RUNNER_TEMP/opscore-attestation-bundles/sbom-attestation.jsonl"
          test "$(find "$RUNNER_TEMP/opscore-attestation-bundles" -type f | wc -l)" -eq 3

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Sign completed release archive with Sigstore keyless OIDC
        env:
          RELEASE_ARCHIVE: "${{ runner.temp }}/OpsCore-release.zip"
          SIGNATURE_BUNDLE: "${{ runner.temp }}/OpsCore-release.zip.sigstore.json"
        run: |
          set -euo pipefail
          test -s "$RELEASE_ARCHIVE"
          cosign version
          cosign sign-blob --yes "$RELEASE_ARCHIVE" --bundle "$SIGNATURE_BUNDLE"
          test -s "$SIGNATURE_BUNDLE"

      - name: Verify archive signature and reject tampering or wrong signer
        env:
          RELEASE_ARCHIVE: "${{ runner.temp }}/OpsCore-release.zip"
          SIGNATURE_BUNDLE: "${{ runner.temp }}/OpsCore-release.zip.sigstore.json"
          EXPECTED_IDENTITY: "https://github.com/${{ github.repository }}/.github/workflows/opscore-secure-release.yml@${{ github.ref }}"
        run: |
          set -euo pipefail
          cosign verify-blob "$RELEASE_ARCHIVE" \
            --bundle "$SIGNATURE_BUNDLE" \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

          tampered="$RUNNER_TEMP/OpsCore-release.tampered.zip"
          cp "$RELEASE_ARCHIVE" "$tampered"
          printf 'tamper-probe' >> "$tampered"
          if cosign verify-blob "$tampered" \
            --bundle "$SIGNATURE_BUNDLE" \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"; then
            echo "TAMPERED_ARCHIVE_ACCEPTED"
            exit 1
          fi

          if cosign verify-blob "$RELEASE_ARCHIVE" \
            --bundle "$SIGNATURE_BUNDLE" \
            --certificate-identity "https://github.com/untrusted/repository/.github/workflows/opscore-secure-release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"; then
            echo "UNTRUSTED_SIGNER_ACCEPTED"
            exit 1
          fi
          echo "COSIGN_KEYLESS_SIGNATURE_VERIFICATION=PASS"
          echo "TAMPERED_ARCHIVE_REJECTION=PASS"
          echo "WRONG_SIGNER_REJECTION=PASS"

      - name: Upload release and exact-run evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opscore-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/OpsCore-release.zip
            ${{ runner.temp }}/COMMERCIAL_RELEASE_STATEMENT.json
            ${{ runner.temp }}/RELEASE_SHA256SUMS.txt
            ${{ runner.temp }}/opscore-v0.11.62.cyclonedx.json
            ${{ runner.temp }}/source-pinned-provenance.json
            ${{ runner.temp }}/provenance-verification.json
            ${{ runner.temp }}/source-pin-verification.json
            ${{ runner.temp }}/sbom-attestation-verification.json
            ${{ runner.temp }}/opscore-attestation-bundles/
            ${{ runner.temp }}/OpsCore-release.zip.sigstore.json
            mobile/mobile-dependency-audit.json
            mobile/mobile-audit-gate-result.json
            root-dependency-audit.json
            backend/docs/verification/I18N_FORENSIC_AUDIT_RESULT.json
            backend/docs/verification/I18N_FORENSIC_AUDIT_RESULT.sha256
          if-no-files-found: error
          retention-days: 14
