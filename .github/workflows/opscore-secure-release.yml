name: OpsCore secure release

on:
  push:
    branches:
      - 'release/v0.11.62.18-commercial-source-package'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: opscore-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    if: >-
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/release/v0.11.62.18-commercial-source-package') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json

      - name: Verify release control script syntax
        run: |
          node --check scripts/finalize-draft-release.js
          node --check scripts/package-release.js
          node --check scripts/write-release-attestation.js

      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          node - <<'NODE'
          const version = require('./backend/package.json').version;
          const tag = process.env.RELEASE_TAG || '';
          const parts = version.split('.');
          if (parts.length !== 3 || parts.some(part => !/^[0-9]+$/.test(part))) throw new Error('PACKAGE_VERSION_NOT_SEMVER: ' + version);
          const exact = 'v' + version;
          const commercial = new RegExp('^v' + parts.join('[.]') + '[.][0-9]+-[a-z0-9]+([.-][a-z0-9]+)*$');
          if (tag !== exact && !commercial.test(tag)) {
            throw new Error('RELEASE_TAG_VERSION_MISMATCH: expected ' + exact + ' or a numbered commercial closure suffix; received ' + tag);
          }
          console.log('RELEASE_TAG_VERSION_MATCH: ' + tag + ' -> ' + version);
          NODE
      - name: Verify manually dispatched source is main
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Verify source commit belongs to an authorized release line
        env:
          RELEASE_BASE_SHA: deba977db586f19128a1f53377fec183beab44d0
          ISOLATED_RELEASE_TAG: v0.11.62.18-commercial-source-package
          ISOLATED_RELEASE_BRANCH: release/v0.11.62.18-commercial-source-package
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == "$ISOLATED_RELEASE_TAG" ]]; then
            git cat-file -e "${RELEASE_BASE_SHA}^{commit}"
            git merge-base --is-ancestor "$RELEASE_BASE_SHA" "$GITHUB_SHA"
            test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/$ISOLATED_RELEASE_BRANCH" ]]; then
            git cat-file -e "${RELEASE_BASE_SHA}^{commit}"
            git merge-base --is-ancestor "$RELEASE_BASE_SHA" "$GITHUB_SHA"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          else
            git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main
            exit 0
          fi
          actual="$(git diff --name-only "$RELEASE_BASE_SHA" "$GITHUB_SHA" | LC_ALL=C sort)"
          expected="$(cat <<'EXPECTED_FILES'
          .github/workflows/opscore-secure-release.yml
          backend/docs/verification/I18N_FORENSIC_AUDIT_RESULT.sha256
          backend/docs/verification/PRODUCTION_RECOVERY_POINT.json.sha256
          backend/docs/verification/PRODUCTION_SESSION_ISOLATION.json.sha256
          backend/docs/verification/RECOVERY_GATE_RESULT.sha256
          backend/docs/verification/RELEASE_TEST_RUN_RESULT.sha256
          docs/commercial/CLIENT_TRUST_PACK.md
          docs/commercial/CLIENT_TRUST_PACK_v0.11.62.18.md
          docs/commercial/COMMERCIAL_CLOSEOUT_FINAL.md
          docs/commercial/REMAINING_CLOSEOUT_CHECKLIST.md
          docs/ops/REMAINING_CLOSEOUT_GATES.md
          docs/security/OPSC_APP_SECURITY_DISPOSITION.md
          scripts/finalize-draft-release.js
          scripts/package-release.js
          scripts/refresh-evidence-sidecars.js
          scripts/release-artifact-gate.js
          scripts/write-release-attestation.js
          EXPECTED_FILES
          )"
          if [[ "$actual" != "$expected" ]]; then
            printf 'ISOLATED_RELEASE_FILE_ALLOWLIST_MISMATCH\nExpected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          echo "ISOLATED_COMMERCIAL_RELEASE_LINE_VERIFIED: base=$RELEASE_BASE_SHA tag=$ISOLATED_RELEASE_TAG"
      - name: Install backend dependencies from lockfile
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Install mobile dependencies from lockfile
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Run backend regression suite
        working-directory: backend
        run: OPSC_RELEASE_TEST_CONCURRENCY=4 node scripts/release-test-runner.js

      - name: Regenerate current-head forensic language evidence
        working-directory: backend
        run: npm run contact-center:i18n:forensic

      - name: PostgreSQL schema parity gate
        working-directory: backend
        run: npm run db:postgres-parity

      - name: Migration preflight
        working-directory: backend
        run: node scripts/migration-preflight.js

      - name: Security transaction audit
        working-directory: backend
        run: npm run security:red-team

      - name: Production readiness gate
        working-directory: backend
        run: npm run production:readiness

      - name: Resilience and load gate
        working-directory: backend
        run: npm run resilience:gate

      - name: Recovery gate
        working-directory: backend
        run: npm run recovery:gate

      - name: Buyer installation verification (produces real evidence artifact)
        working-directory: backend
        run: npm run verify:installation

      - name: Buyer self-validation
        working-directory: backend
        run: npm run buyer:self-validation

      - name: Mobile release preflight
        working-directory: mobile
        run: node scripts/release-preflight.js

      - name: Run mobile verification
        working-directory: mobile
        run: npm run verify

      - name: Generate current mobile dependency audit
        working-directory: mobile
        run: |
          set +e
          npm audit --json > mobile-dependency-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            echo "MOBILE_NPM_AUDIT_EXECUTION_FAILED status=$audit_status"
            exit "$audit_status"
          fi
          node scripts/audit-gate.js

      - name: Generate current root dependency audit
        run: |
          set +e
          npm audit --json > root-dependency-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            echo "ROOT_NPM_AUDIT_EXECUTION_FAILED status=$audit_status"
            exit "$audit_status"
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('root-dependency-audit.json', 'utf8'));
          const v = report.metadata && report.metadata.vulnerabilities;
          if (!v || typeof v.total !== 'number') throw new Error('ROOT_AUDIT_REPORT_INCOMPLETE');
          console.log('ROOT_AUDIT_SUMMARY', JSON.stringify(v));
          if ((v.high || 0) > 0 || (v.critical || 0) > 0) process.exit(1);
          NODE

      - name: Generate deterministic SBOM
        run: node scripts/generate-sbom.js

      - name: Verify SBOM against manifests and lockfiles
        run: node scripts/verify-sbom.js

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Rebind sidecars for evidence regenerated in this run
        run: |
          node scripts/refresh-evidence-sidecars.js \
            I18N_FORENSIC_AUDIT_RESULT \
            RECOVERY_GATE_RESULT \
            RELEASE_TEST_RUN_RESULT

      - name: Build buyer release archive
        env:
          CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || (github.ref == 'refs/heads/release/v0.11.62.18-commercial-source-package' && 'v0.11.62.18-commercial-source-package') || '' }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_PIPELINE_ID: ${{ github.run_id }}
          CI_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
          CI_PROJECT_PATH: ${{ github.repository }}
          CI_JOB_NAME: commercial-closure
        run: node scripts/package-release.js "$RUNNER_TEMP/OpsCore-release.zip"

      - name: Name archive with exact source and run identity
        env:
          SOURCE_ARCHIVE: ${{ runner.temp }}/OpsCore-release.zip
          RELEASE_ARCHIVE: ${{ runner.temp }}/OpsCore-release-v0.11.62.18-${{ github.sha }}-${{ github.run_id }}.zip
        run: |
          set -euo pipefail
          test -s "$SOURCE_ARCHIVE"
          mv "$SOURCE_ARCHIVE" "$RELEASE_ARCHIVE"
          test -s "$RELEASE_ARCHIVE"

      - name: Write external commercial archive statement
        env:
          CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || (github.ref == 'refs/heads/release/v0.11.62.18-commercial-source-package' && 'v0.11.62.18-commercial-source-package') || '' }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_PIPELINE_ID: ${{ github.run_id }}
          CI_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
          CI_PROJECT_PATH: ${{ github.repository }}
          CI_JOB_NAME: commercial-closure
        run: node scripts/write-release-attestation.js "$RUNNER_TEMP/OpsCore-release.zip" "$RUNNER_TEMP/COMMERCIAL_RELEASE_STATEMENT.json"

      - name: Generate release provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ runner.temp }}/OpsCore-release.zip"
          sbom-path: docs/sbom/opscore-v0.11.62.cyclonedx.json

      - name: Finalize versioned assets on the existing .18 draft release
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/v0.11.62.18-commercial-source-package'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: v0.11.62.18-commercial-source-package
          RELEASE_ARCHIVE_PATH: ${{ runner.temp }}/OpsCore-release-v0.11.62.18-${{ github.sha }}-${{ github.run_id }}.zip
          RELEASE_STATEMENT_PATH: ${{ runner.temp }}/COMMERCIAL_RELEASE_STATEMENT.json
        run: node scripts/finalize-draft-release.js

      - name: Upload release and exact-run evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opscore-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/OpsCore-release-v0.11.62.18-${{ github.sha }}-${{ github.run_id }}.zip
            ${{ runner.temp }}/COMMERCIAL_RELEASE_STATEMENT.json
            mobile/mobile-dependency-audit.json
            mobile/mobile-audit-gate-result.json
            root-dependency-audit.json
            backend/docs/verification/I18N_FORENSIC_AUDIT_RESULT.json
            backend/docs/verification/I18N_FORENSIC_AUDIT_RESULT.sha256
          if-no-files-found: error
          retention-days: 14
