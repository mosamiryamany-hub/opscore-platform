name: ops-neon-hygiene
on:
  workflow_dispatch:
    inputs:
      mode:
        description: list | prune_ephemeral | both
        required: true
        default: both
  repository_dispatch:
    types: [neon-hygiene]
  push:
    paths:
      - "scripts/neon_hygiene.py"
      - ".github/workflows/ops-neon-hygiene.yml"

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run Neon hygiene
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: summer-leaf-18448271
          MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'both' }}
        run: python3 scripts/neon_hygiene.py
