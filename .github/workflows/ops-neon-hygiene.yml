name: ops-neon-hygiene
on:
  workflow_dispatch:
    inputs:
      mode:
        description: list | prune_ephemeral | both
        required: true
        default: both
  repository_dispatch:
    types: [neon-hygiene]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - name: Neon list and optional ephemeral prune
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: summer-leaf-18448271
          MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'both' }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}"
          echo "mode=$MODE"
          curl -sS -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" -o branches.json
          curl -sS -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/snapshots" -o snaps.json || echo '{}' > snaps.json
          python3 <<'PY'
import json, os, urllib.request
key = os.environ["NEON_API_KEY"]
proj = os.environ["NEON_PROJECT_ID"]
mode = (os.environ.get("MODE") or "both").lower()
KEEP = {
  "br-proud-salad-bcshhdap",
  "br-wispy-term-bcrqqj84",
  "br-fragrant-king-bcr9928f",
}
MARKERS = (
  "recovery-point",
  "opscore-prod-recovery",
  "digital-twin",
  "tmp-",
  "test-accept",
  "accept-recovery",
  "ephemeral",
)
branches = json.load(open("branches.json")).get("branches") or []
print("branch_count", len(branches))
for b in branches:
  print(
    "branch",
    b.get("id"),
    b.get("name"),
    "primary=" + str(b.get("primary")),
    "protected=" + str(b.get("protected")),
    "parent=" + str(b.get("parent_id")),
    "size=" + str(b.get("logical_size")),
  )
snaps = json.load(open("snaps.json")).get("snapshots") or []
print("snapshot_count", len(snaps))
for s in snaps:
  print("snapshot", s.get("id"), s.get("name"), s.get("source_branch_id") or s.get("branch_id"), s.get("created_at"))

if mode not in ("prune_ephemeral", "both"):
  print("list_only_done")
  raise SystemExit(0)

deleted = 0
for b in branches:
  bid = b.get("id") or ""
  name = (b.get("name") or "").lower()
  if b.get("primary") or b.get("protected") or bid in KEEP:
    continue
  if not any(m in name for m in MARKERS):
    continue
  req = urllib.request.Request(
    f"https://console.neon.tech/api/v2/projects/{proj}/branches/{bid}",
    method="DELETE",
    headers={"Authorization": f"Bearer {key}", "Accept": "application/json"},
  )
  try:
    with urllib.request.urlopen(req) as resp:
      print("deleted", bid, name, resp.status)
      deleted += 1
  except Exception as e:
    body = e.read().decode()[:240] if hasattr(e, "read") else str(e)
    print("delete_fail", bid, body)
print("deleted_count", deleted)
# recount
req = urllib.request.Request(
  f"https://console.neon.tech/api/v2/projects/{proj}/branches",
  headers={"Authorization": f"Bearer {key}", "Accept": "application/json"},
)
with urllib.request.urlopen(req) as resp:
  after = json.load(resp).get("branches") or []
print("branch_count_after", len(after))
PY
