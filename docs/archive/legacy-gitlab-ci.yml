<!-- Historical archive: Preserve legacy GitLab pipeline as internal history; current automation is GitHub Actions. -->

stages:
  - verify
  - sign
  - deploy
  - postdeploy

root-dependency-audit:
  stage: verify
  image: node:22.23.4-bookworm-slim
  interruptible: true
  timeout: 10m
  script:
    - npm ci --ignore-scripts --no-audit --no-fund
    - |
      if npm audit --json > root-dependency-audit.json; then audit_exit=0; else audit_exit=$?; fi
      echo "ROOT_DEPENDENCY_AUDIT_EXIT=$audit_exit"
      node <<'NODE'
      const fs=require('node:fs');
      let report;
      try { report=JSON.parse(fs.readFileSync('root-dependency-audit.json','utf8')); }
      catch { console.error('ROOT_DEPENDENCY_AUDIT_INCOMPLETE'); process.exit(2); }
      const v=report?.metadata?.vulnerabilities;
      if (report?.error || !v || typeof v.total!=='number') { console.error('ROOT_DEPENDENCY_AUDIT_INCOMPLETE='+JSON.stringify(report?.error||{})); process.exit(2); }
      const summary={total:v.total||0,info:v.info||0,low:v.low||0,moderate:v.moderate||0,high:v.high||0,critical:v.critical||0};
      const findings=Object.entries(report.vulnerabilities||{}).map(([name,x])=>({name,severity:x.severity,range:x.range,fixAvailable:x.fixAvailable}));
      console.log('ROOT_DEPENDENCY_AUDIT_SUMMARY='+JSON.stringify(summary));
      console.log('ROOT_DEPENDENCY_AUDIT_FINDINGS='+JSON.stringify(findings));
      if (summary.high || summary.critical) process.exit(1);
      console.log('ROOT_DEPENDENCY_AUDIT_GATE=PASS');
      NODE
  artifacts:
    when: always
    expire_in: 14 days
    access: maintainer
    paths:
      - root-dependency-audit.json
  allow_failure: false

mobile-source-verification:
  stage: verify
  image: node:22.23.4-bookworm-slim
  interruptible: true
  timeout: 20m
  script:
    - cd mobile
    - npm ci --ignore-scripts --no-audit --no-fund
    - node scripts/release-preflight.js
    - npm run verify
    - npm run dependency:gate

mobile-web-export-verification:
  stage: verify
  image: node:22.23.4-bookworm-slim
  interruptible: true
  timeout: 20m
  variables:
    EXPO_NO_TELEMETRY: "1"
  needs:
    - job: mobile-source-verification
      artifacts: false
  script:
    - cd mobile
    - npm ci --ignore-scripts --no-audit --no-fund
    - npx expo install --check
    - node -e "const fs=require('node:fs'); const p=require('./node_modules/expo-sqlite/package.json'); const f='node_modules/expo-sqlite/web/wa-sqlite/wa-sqlite.wasm'; if (!fs.existsSync(f) || fs.statSync(f).size < 100000) throw new Error('EXPO_SQLITE_WASM_ASSET_MISSING'); console.log('EXPO_SQLITE_WASM_SOURCE_PASS='+p.version+':'+fs.statSync(f).size);"
    - npx expo export --platform web --output-dir /tmp/opscore-mobile-web-export
    - test -d /tmp/opscore-mobile-web-export
    - find /tmp/opscore-mobile-web-export -type f -name '*.wasm' -size +0c -print -quit | grep -q .
    - find /tmp/opscore-mobile-web-export -type f -name '*.js' -size +0c -print -quit | grep -q .
    - echo "MOBILE_WEB_EXPORT_GATE=PASS"
  allow_failure: false

# Mobile dependency audit is a seller-owned release gate. Signed native builds remain a buyer-specific residual.
mobile-dependency-audit:
  stage: verify
  image: node:22.23.4-bookworm-slim
  interruptible: true
  timeout: 15m
  needs:
    - job: mobile-source-verification
      artifacts: false
  script:
    - cd mobile
    - npm ci --ignore-scripts --no-audit --no-fund
    - |
      if npm audit --json > mobile-dependency-audit.json; then
        audit_exit=0
      else
        audit_exit=$?
      fi
      echo "MOBILE_NPM_AUDIT_EXIT=$audit_exit"
      node <<'NODE'
      const fs = require('node:fs');
      let report;
      try {
        report = JSON.parse(fs.readFileSync('mobile-dependency-audit.json', 'utf8'));
      } catch (error) {
        console.error('MOBILE_NPM_AUDIT_INCOMPLETE: audit did not produce valid JSON');
        process.exit(2);
      }
      const v = report?.metadata?.vulnerabilities;
      if (report?.error || !v || typeof v.total !== 'number') {
        console.error('MOBILE_NPM_AUDIT_INCOMPLETE=' + JSON.stringify(report?.error || {reason:'missing vulnerability metadata'}));
        process.exit(2);
      }
      const summary = {
        total: v.total || 0,
        info: v.info || 0,
        low: v.low || 0,
        moderate: v.moderate || 0,
        high: v.high || 0,
        critical: v.critical || 0
      };
      console.log('MOBILE_NPM_AUDIT_SUMMARY=' + JSON.stringify(summary));
      const findings = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({
        name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable,
        via: (item.via || []).map(entry => typeof entry === 'string' ? entry : ({
          name: entry.name, title: entry.title, url: entry.url, range: entry.range, severity: entry.severity
        }))
      }));
      console.log('MOBILE_NPM_AUDIT_FINDINGS=' + JSON.stringify(findings));
      const severe = Object.entries(report.vulnerabilities || {})
        .filter(([, item]) => ['high', 'critical'].includes(item.severity))
        .map(([name, item]) => ({name, severity:item.severity, range:item.range, fixAvailable:item.fixAvailable}));
      if (severe.length) {
        console.error('MOBILE_NPM_AUDIT_BUYER_ACTION_REQUIRED=' + JSON.stringify(severe));
        process.exit(1);
      }
      console.log('MOBILE_NPM_AUDIT_GATE=PASS (no high/critical advisories; low/moderate findings remain recorded in the artifact)');
      NODE
  artifacts:
    when: always
    expire_in: 14 days
    access: maintainer
    paths:
      - mobile/mobile-dependency-audit.json
      - mobile/docs/MOBILE_SECURITY_RESIDUAL.md
  allow_failure: false
mobile-sdk58-audit-probe:
  stage: verify
  image: node:22.23.4-bookworm-slim
  interruptible: false
  timeout: 25m
  rules:
    - if: '$CI_COMMIT_BRANCH == "audit/commercial-evidence-reconciliation-2026-10-26"'
      when: manual
      allow_failure: true
    - when: never
  script:
    - cd mobile
    - npm ci --ignore-scripts --no-audit --no-fund
    - cp package.json /tmp/opscore-mobile-sdk57-package.json
    - cp package-lock.json /tmp/opscore-mobile-sdk57-lock.json
    - npm pkg set 'dependencies.expo=~58.0.19'
    - npm install --ignore-scripts --no-audit --no-fund
    - CI=1 npx expo install --fix
    - npm install --ignore-scripts --no-audit --no-fund
    - npm ci --ignore-scripts --no-audit --no-fund
    - node scripts/verify-mobile.js
    - node scripts/release-preflight.js
    - npx expo install --check
    - |
      if npm audit --json > mobile-sdk58-dependency-audit.json; then
        echo "SDK58_AUDIT_EXIT=0"
      else
        audit_exit=$?
        echo "SDK58_AUDIT_EXIT=$audit_exit"
      fi
      node - <<'NODE'
      const fs=require('node:fs');
      const pkg=require('./package.json');
      const lock=require('./package-lock.json');
      const report=JSON.parse(fs.readFileSync('mobile-sdk58-dependency-audit.json','utf8'));
      const v=report?.metadata?.vulnerabilities||{};
      const severe=Object.entries(report.vulnerabilities||{}).filter(([,x])=>['high','critical'].includes(x.severity)).map(([name,x])=>({
        name,version:x.range,severity:x.severity,fixAvailable:x.fixAvailable,
        via:(x.via||[]).map(a=>typeof a==='string'?a:{name:a.name,title:a.title,url:a.url,range:a.range,severity:a.severity}),
        effects:x.effects
      }));
      console.log('SDK58_RESOLVED_VERSIONS='+JSON.stringify({
        expo:pkg.dependencies.expo,
        react:pkg.dependencies.react,
        reactNative:pkg.dependencies['react-native'],
        lockExpo:lock.packages?.['node_modules/expo']?.version,
        lockReactNative:lock.packages?.['node_modules/react-native']?.version
      }));
      console.log('SDK58_AUDIT_SUMMARY='+JSON.stringify({total:v.total||0,moderate:v.moderate||0,high:v.high||0,critical:v.critical||0,severe}));
      NODE
  artifacts:
    when: always
    expire_in: 7 days
    access: maintainer
    paths:
      - mobile/package.json
      - mobile/package-lock.json
      - mobile/mobile-sdk58-dependency-audit.json

commercial-closure:
  rules:
    # Keep the commercial evidence/package job manually triggerable on the
    # governed closeout branch so its isolated HTTP-acceptance credentials can
    # be injected only for that single job, never stored as project variables.
    - if: '$CI_COMMIT_BRANCH == "security/mobile-dependency-remediation-2026-11-01"'
      when: manual
      allow_failure: false
    - when: on_success
  stage: verify
  # Acceptance writes synthetic fixtures and has a mandatory cleanup finally block.
  # Do not auto-cancel this job mid-write when a newer commit is pushed.
  image: node:22.23.4-bookworm-slim
  interruptible: false
  timeout: 30m
  needs:
    - job: root-dependency-audit
      artifacts: true
    - job: mobile-source-verification
      artifacts: false
    - job: mobile-dependency-audit
      artifacts: true
    - job: mobile-web-export-verification
      artifacts: false
  variables:
    NODE_ENV: test
    OPSC_TEST_SCRYPT_N: "32768"
    COSIGN_YES: "true"
  script:
    - cd backend
    - npm ci --ignore-scripts --omit=peer --no-audit --no-fund
    - npm run db:migrations:preflight
    - cd ..
    - npm ci --ignore-scripts --no-audit --no-fund
    - cd backend
    # PostgreSQL HTTP acceptance writes to a temporary file during npm test. Keep the
    # checked-in historical snapshot immutable while parallel test files are executing.
    - rm -f /tmp/opscore-postgres-http-acceptance-result.json
    # P0: both PostgreSQL gates are release-blocking. OPSC_PG_TEST_URL is provided
    # as a masked CI variable; its value is never printed, and the gates themselves
    # never emit connection data. No allow_failure is attached to this job.
    - test -n "${OPSC_PG_TEST_URL:-}" || { echo 'OPSC_PG_TEST_URL_REQUIRED (masked CI variable)'; exit 2; }
    - export OPSC_PG_TEST_URL
    # When an isolated HTTP acceptance URL is supplied, migrate that disposable database
    # through the production migration runner using the separate owner URL before testing.
    # No Production URL is accepted by the migration runner's target-name guard.
    - |
      if [ -n "${OPSC_PG_ACCEPTANCE_URL:-}" ]; then
        if [ -n "${OPSC_MIGRATION_DATABASE_URL:-}" ]; then
          test -n "${OPSC_MIGRATION_CONFIRM_DATABASE:-}" || { echo 'OPSC_MIGRATION_CONFIRM_DATABASE_REQUIRED'; exit 2; }
          OPSC_MIGRATION_DATABASE_URL="$OPSC_MIGRATION_DATABASE_URL" \
            OPSC_MIGRATION_CONFIRM_DATABASE="$OPSC_MIGRATION_CONFIRM_DATABASE" \
            node scripts/apply-postgres-migrations.js --apply
        else
          echo 'ACCEPTANCE_MIGRATION_NOT_RUN: owner URL absent; strict database preflight and HTTP behavior test will run without schema writes.'
        fi
        export OPSC_PG_ACCEPTANCE_STRICT=true
      fi
    - npm test
    # Promote only a complete PASS bound to this exact commit and pipeline. Failed or
    # skipped acceptance runs must never overwrite the historical checked-in snapshot.
    - |
      if [ -n "${OPSC_PG_ACCEPTANCE_URL:-}" ]; then
        RESULT_FILE="/tmp/opscore-postgres-http-acceptance-result.json"
        test -s "$RESULT_FILE" || { echo "POSTGRES_HTTP_ACCEPTANCE_RESULT_MISSING"; exit 2; }
        node -e 'const fs=require("node:fs");const [file,commit,pipelineId]=process.argv.slice(1);const evidence=JSON.parse(fs.readFileSync(file,"utf8"));if(evidence.status!=="PASS")throw new Error("POSTGRES_HTTP_ACCEPTANCE_NOT_PASS");if(evidence.commit!==commit)throw new Error("POSTGRES_HTTP_ACCEPTANCE_COMMIT_MISMATCH");if(String(evidence.pipelineId)!==String(pipelineId))throw new Error("POSTGRES_HTTP_ACCEPTANCE_PIPELINE_MISMATCH");console.log("POSTGRES_HTTP_ACCEPTANCE_PROMOTION=PASS");' "$RESULT_FILE" "$CI_COMMIT_SHA" "$CI_PIPELINE_ID"
        cp "$RESULT_FILE" docs/verification/POSTGRES_HTTP_ACCEPTANCE_RESULT.json
      fi
    - npm run contact-center:i18n
    - npm run contact-center:i18n:forensic
    - node --test test/contact_center_i18n.test.js test/contact_center_i18n_completion.test.js
    # Keep local, isolated recovery/install evidence available even when live DB credentials are misconfigured.
    - npm run backup:verify
    - npm run recovery:gate
    - npm run verify:installation
    - npm run runtime:gate
    - npm run deployment:qualification
    - npm run production:readiness
    - npm run db:postgres-live-rls
    - npm run db:postgres-identity-rls
    - npm run commercial:closure
    - cd ..
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl zip unzip && rm -rf /var/lib/apt/lists/*
    - node scripts/package-release.js ../OPSCORE.zip
    - mkdir -p dist
    - cp ../OPSCORE.zip dist/
    - node scripts/write-release-attestation.js dist/OPSCORE.zip dist/COMMERCIAL_RELEASE_STATEMENT.json
    - |
      PACKAGE="dist/OPSCORE.zip"
      # Sigstore OIDC disabled on clean-project transfer (id_token_burned_project_path).
      # Package integrity is still bound by SHA-256 sums from CI artifacts.
      (cd dist && sha256sum *.zip COMMERCIAL_RELEASE_STATEMENT.json > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
      echo "PACKAGE_SHA256=$(sha256sum "$PACKAGE" | awk '{print $1}')"
  artifacts:
    when: always
    expire_in: 14 days
    access: maintainer
    reports:
      junit: backend/junit.xml
    paths:
      - backend/junit.xml
      - backend/docs/verification/I18N_FORENSIC_AUDIT_RESULT.json
      - backend/docs/verification/RELEASE_TEST_RUN_RESULT.json
      - backend/docs/verification/COMMERCIAL_CLOSURE_GATE_RESULT.json
      - backend/docs/verification/POSTGRES_LIVE_RLS_RESULT.json
      - backend/docs/verification/POSTGRES_HTTP_ACCEPTANCE_RESULT.json
      - backend/docs/verification/RECOVERY_GATE_RESULT.json
      - backend/docs/verification/TENANT_ISOLATION_MATRIX.json
      - docs/BUYER_INSTALLATION_VERIFICATION.json
      - dist/

artifact-fingerprints:
  stage: verify
  image: node:22.23.4-bookworm-slim
  interruptible: true
  needs: []
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
    - node scripts/ci/artifact-fingerprints.js dist/ARTIFACT_SHA256_MANIFEST.json
    - test -s dist/ARTIFACT_SHA256_MANIFEST.json
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dist/ARTIFACT_SHA256_MANIFEST.json

# Keyless signing is deliberately opt-in until the GitLab project token-subject setting is corrected.
# Set ci_id_token_sub_claim_components=["project_id","ref_type","ref"] first, then set
# OPSC_SIGSTORE_ENABLED=true as a protected project CI/CD variable.
release-signature:
  stage: sign
  image: node:22.23.4-bookworm-slim
  interruptible: false
  needs:
    - job: commercial-closure
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $OPSC_SIGSTORE_ENABLED == "true"'
    - when: never
  variables:
    COSIGN_YES: "true"
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - |
      set -eu
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl
      rm -rf /var/lib/apt/lists/*
      COSIGN_VERSION="3.1.4"
      curl --fail --location --retry 3 --retry-all-errors \
        "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
        --output /usr/local/bin/cosign
      echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  /usr/local/bin/cosign" | sha256sum --check --status
      chmod 0755 /usr/local/bin/cosign
      test -n "${SIGSTORE_ID_TOKEN:-}"
      PACKAGE="dist/OPSCORE.zip"
      STATEMENT="dist/COMMERCIAL_RELEASE_STATEMENT.json"
      test -s "$PACKAGE"
      test -s "$STATEMENT"
      cosign version
      cosign sign-blob --yes --bundle "${PACKAGE}.sigstore.json" "$PACKAGE"
      cosign verify-blob "$PACKAGE" \
        --bundle "${PACKAGE}.sigstore.json" \
        --certificate-identity "https://gitlab.com/mosamiryamany-hub1/opscore-commercial-final//.gitlab-ci.yml@refs/heads/main" \
        --certificate-oidc-issuer "https://gitlab.com"
      cosign sign-blob --yes --bundle "${STATEMENT}.sigstore.json" "$STATEMENT"
      cosign verify-blob "$STATEMENT" \
        --bundle "${STATEMENT}.sigstore.json" \
        --certificate-identity "https://gitlab.com/mosamiryamany-hub1/opscore-commercial-final//.gitlab-ci.yml@refs/heads/main" \
        --certificate-oidc-issuer "https://gitlab.com"
      (cd dist && sha256sum *.sigstore.json >> SHA256SUMS.txt)
      echo "SIGSTORE_BUNDLE_VERIFICATION=PASS"
  artifacts:
    when: always
    expire_in: 14 days
    access: maintainer
    paths:
      - dist/OPSCORE.zip
      - dist/COMMERCIAL_RELEASE_STATEMENT.json
      - dist/SHA256SUMS.txt
      - dist/*.sigstore.json


# ---- Vercel deploy via GitLab CI (no Git integration needed) ----
# Pin a published CLI release newer than the deployment API minimum; keep install output visible for diagnosis.
deploy-preview:
  stage: deploy
  image: node:22.23.4-bookworm-slim
  interruptible: true
  needs:
    - job: commercial-closure
      artifacts: true
  # Preview deploys are explicit opt-in: a push must never consume Vercel deployment quota.
  # Hobby accounts are capped at 100 deployments/day, so an implicit preview on every push
  # turns ordinary branch work into a failed pipeline for reasons unrelated to the code.
  rules:
    - if: '$CI_COMMIT_BRANCH == "commercial/buyer-installation-hardening-2026-11-01"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "security/mobile-dependency-remediation-2026-11-01"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web" && $OPSC_RUN_PREVIEW_DEPLOY == "true" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  script:
    - npm install -g vercel@48.0.0 --no-audit --no-fund
    - vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
    - vercel build --token="$VERCEL_TOKEN"
    - |
      RELEASE_PACKAGE_COMMIT="$(node -p 'require("./dist/COMMERCIAL_RELEASE_STATEMENT.json").sourceCommit || ""')"
      RELEASE_PACKAGE_PIPELINE="$(node -p 'require("./dist/COMMERCIAL_RELEASE_STATEMENT.json").pipelineId || ""')"
      RELEASE_PACKAGE_SHA256="$(node -p 'require("./dist/COMMERCIAL_RELEASE_STATEMENT.json").artifact.sha256.value || ""')"
      test "$RELEASE_PACKAGE_COMMIT" = "$CI_COMMIT_SHA"
      test "$RELEASE_PACKAGE_PIPELINE" = "$CI_PIPELINE_ID"
      test "$(printf '%s' "$RELEASE_PACKAGE_SHA256" | grep -Ec '^[a-f0-9]{64}$')" -eq 1
      test -n "${OPSC_PG_ACCEPTANCE_URL:-}" || { echo 'OPSC_PG_ACCEPTANCE_URL_REQUIRED_FOR_SAFE_PREVIEW'; exit 2; }
      # Keep the protected database URL out of the shell trace. The deployment-only
      # runtime override binds Preview to the exact isolated acceptance database.
      export RELEASE_PACKAGE_COMMIT RELEASE_PACKAGE_PIPELINE RELEASE_PACKAGE_SHA256
      node <<'NODE'
      const cp = require('node:child_process');
      const raw = String(process.env.OPSC_PG_ACCEPTANCE_URL || '');
      const u = new URL(raw);
      const db = decodeURIComponent(u.pathname.startsWith('/') ? u.pathname.slice(1) : u.pathname);
      const role = decodeURIComponent(u.username);
      const ssl = (u.searchParams.get('sslmode') || '').toLowerCase();
      if (!['postgres:', 'postgresql:'].includes(u.protocol)) throw new Error('PREVIEW_DATABASE_URL_PROTOCOL_INVALID');
      if (role !== 'opscore_app') throw new Error('PREVIEW_DATABASE_RUNTIME_ROLE_MUST_BE_OPSCORE_APP');
      if (u.hostname.toLowerCase().includes('-pooler')) throw new Error('PREVIEW_DATABASE_DIRECT_CONNECTION_REQUIRED');
      if (!/(preview|test|testing|ci|acceptance|scratch|disposable)/i.test(db)) throw new Error('PREVIEW_DATABASE_MUST_BE_ISOLATED_ACCEPTANCE_DATABASE');
      if (!['require','verify-ca','verify-full'].includes(ssl)) throw new Error('PREVIEW_DATABASE_SSL_REQUIRED');
      if (!process.env.VERCEL_TOKEN) throw new Error('VERCEL_TOKEN_REQUIRED');
      const args = [
        'deploy','--prebuilt','--target=preview','--token',process.env.VERCEL_TOKEN,
        '--env',`OPSC_DATABASE_URL=${raw}`,
        '--env',`DATABASE_URL=${raw}`,
        '--env','DATABASE_ENGINE=postgres',
        '--env','OPSC_RELEASE_DEPLOYMENT_SOURCE=gitlab-ci-cli',
        '--env',`OPSC_RELEASE_CI_COMMIT=${process.env.CI_COMMIT_SHA}`,
        '--env',`OPSC_RELEASE_CI_PIPELINE_ID=${process.env.CI_PIPELINE_ID}`,
        '--env',`OPSC_RELEASE_CI_REF=${process.env.CI_COMMIT_REF_NAME}`,
        '--env',`OPSC_RELEASE_PACKAGE_COMMIT=${process.env.RELEASE_PACKAGE_COMMIT}`,
        '--env',`OPSC_RELEASE_PACKAGE_SHA256=${process.env.RELEASE_PACKAGE_SHA256}`
      ];
      cp.execFileSync('vercel', args, {stdio:'inherit'});
      console.log('PREVIEW_RUNTIME_DATABASE_BOUND_TO_ISOLATED_ACCEPTANCE=PASS');
      NODE
deploy-production:
  stage: deploy
  # Root path without Vercel Git OAuth: GitLab CI + Vercel CLI (official docs).
  # Does not require Pro reconnect of Git integration. Sigstore remains optional.
  needs:
    - job: commercial-closure
      artifacts: true
  image: node:22.23.4-bookworm-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

  script:
    - npm install -g vercel@48.0.0 --no-audit --no-fund
    - vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
    - |
      set -e
      ENV_LIST="$(vercel env ls production --token="$VERCEL_TOKEN" 2>&1)"
      test -n "$ENV_LIST"
      for name in VERCEL_GIT_COMMIT_SHA OPSC_SOURCE_COMMIT_SHA; do
        if printf '%s\n' "$ENV_LIST" | grep -Eq "(^|[[:space:]])${name}([[:space:]]|$)"; then
          echo "Removing stale production metadata variable: $name"
          vercel env rm "$name" production --yes --token="$VERCEL_TOKEN"
        fi
      done
    - vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
    - vercel build --prod --token="$VERCEL_TOKEN"
    - |
      RELEASE_PACKAGE_COMMIT="$(node -p 'require("./dist/COMMERCIAL_RELEASE_STATEMENT.json").sourceCommit || ""')"
      RELEASE_PACKAGE_PIPELINE="$(node -p 'require("./dist/COMMERCIAL_RELEASE_STATEMENT.json").pipelineId || ""')"
      RELEASE_PACKAGE_SHA256="$(node -p 'require("./dist/COMMERCIAL_RELEASE_STATEMENT.json").artifact.sha256.value || ""')"
      test "$RELEASE_PACKAGE_COMMIT" = "$CI_COMMIT_SHA"
      test "$RELEASE_PACKAGE_PIPELINE" = "$CI_PIPELINE_ID"
      test "$(printf '%s' "$RELEASE_PACKAGE_SHA256" | grep -Ec '^[a-f0-9]{64}$')" -eq 1
      vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
        --env "OPSC_RELEASE_DEPLOYMENT_SOURCE=gitlab-ci-cli" \
        --env "OPSC_RELEASE_CI_COMMIT=$CI_COMMIT_SHA" \
        --env "OPSC_RELEASE_CI_PIPELINE_ID=$CI_PIPELINE_ID" \
        --env "OPSC_RELEASE_CI_REF=$CI_COMMIT_REF_NAME" \
        --env "OPSC_RELEASE_PACKAGE_COMMIT=$RELEASE_PACKAGE_COMMIT" \
        --env "OPSC_RELEASE_PACKAGE_SHA256=$RELEASE_PACKAGE_SHA256"


# Fail closed unless the just-deployed production alias proves commit + CI package identity.
verify-production:
  stage: postdeploy
  image: node:22.23.4-bookworm-slim
  needs:
    - job: deploy-production
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $OPSC_SIGSTORE_ENABLED == "true"'
  variables:
    OPSC_PRODUCTION_BASE_URL: "https://opscore-commercial-final.vercel.app"
  script:
    - |
      node <<'NODE'
      const base = process.env.OPSC_PRODUCTION_BASE_URL;
      const expectedCommit = process.env.CI_COMMIT_SHA;
      const expectedPipeline = Number(process.env.CI_PIPELINE_ID);
      async function getJson(path, validate) {
        let lastError;
        for (let attempt = 1; attempt <= 12; attempt++) {
          try {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(15000), headers: { accept: 'application/json', 'cache-control': 'no-cache' } });
            const text = await response.text();
            if (!response.ok) throw new Error(path + ' HTTP ' + response.status + ': ' + text.slice(0, 500));
            const payload = JSON.parse(text);
            if (validate && !validate(payload)) throw new Error(path + ' response has not converged to expected identity');
            return payload;
          } catch (error) {
            lastError = error;
            if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
          }
        }
        throw lastError;
      }
      (async () => {
        const expectedVersion = require('./backend/package.json').version;
        const health = await getJson('/api/health', h => h.status === 'healthy' && h.engine === 'postgres' && h.version === expectedVersion);
        if (health.status !== 'healthy' || health.engine !== 'postgres' || health.version !== require('./backend/package.json').version) {
          throw new Error('Health gate failed: ' + JSON.stringify({status:health.status,engine:health.engine,version:health.version}));
        }
        const deployment = await getJson('/api/verify/deployment', d => d.status === 'identified' && d.source?.commitSha === expectedCommit && d.deployment?.environment === 'production' && Boolean(d.deployment?.id));
        if (deployment.status !== 'identified' || deployment.source?.commitSha !== expectedCommit ||
            deployment.deployment?.environment !== 'production' || !deployment.deployment?.id) {
          throw new Error('Deployment identity mismatch: ' + JSON.stringify(deployment));
        }
        const release = await getJson('/api/verify/release', r => r.status === 'PASS_WITH_BUYER_RESIDUALS' && r.sourceCommit === expectedCommit && r.ci?.status === 'PASS' && r.ci?.commitSha === expectedCommit && r.ci?.pipelineId === expectedPipeline && r.packageFingerprint?.status === 'PUBLISHED' && r.packageFingerprint?.sourceCommit === expectedCommit && /^[a-f0-9]{64}$/.test(r.packageFingerprint?.value || ''));
        if (release.status !== 'PASS_WITH_BUYER_RESIDUALS' ||
            release.sourceCommit !== expectedCommit ||
            release.ci?.status !== 'PASS' ||
            release.ci?.commitSha !== expectedCommit ||
            release.ci?.pipelineId !== expectedPipeline ||
            release.packageFingerprint?.status !== 'PUBLISHED' ||
            release.packageFingerprint?.sourceCommit !== expectedCommit ||
            !/^[a-f0-9]{64}$/.test(release.packageFingerprint?.value || '')) {
          throw new Error('Release proof not bound to this commit/pipeline/package: ' + JSON.stringify({
            status:release.status,sourceCommit:release.sourceCommit,ci:release.ci,packageFingerprint:release.packageFingerprint
          }));
        }
        const security = await getJson('/api/verify/database-security');
        console.log(JSON.stringify({
          result:'LIVE_PRODUCTION_IDENTITY_PASS',
          commit:expectedCommit,
          pipeline:expectedPipeline,
          deploymentId:deployment.deployment.id,
          commitIdentitySource:deployment.source.commitIdentitySource,
          health:{status:health.status,engine:health.engine,version:health.version},
          release:{status:release.status,packageFingerprint:release.packageFingerprint.status},
          databaseSecurityStatus:security.status || security.result || 'HTTP_200_REVIEW_REQUIRED'
        }, null, 2));
      })().catch(error => { console.error(error.stack || String(error)); process.exit(1); });
      NODE
